    d.color = '';

function dgPorBarcode(codigo){

/* ---------- color dominante de la carátula ---------- */
function colorDominante(url){
  return new Promise(function(res, rej){
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      try{
        var c = document.createElement('canvas'); c.width = 16; c.height = 16;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, 16, 16);
        var px = ctx.getImageData(0, 0, 16, 16).data;
        var r = 0, g = 0, b = 0, n = 0;
        for(var i = 0; i < px.length; i += 4){
          if(px[i+3] < 128) continue;
          r += px[i]; g += px[i+1]; b += px[i+2]; n++;
        }
        if(!n) return rej();
        res([Math.round(r/n), Math.round(g/n), Math.round(b/n)].join(','));
      }catch(e){ rej(e); }
    };
    img.onerror = rej;
    img.src = url;
  });
}
function aseguraColor(d){
  if(d.color || !d.portada) return Promise.resolve(d.color);
  return colorDominante(d.portada).then(function(c){ d.color = c; persist(true); return c; }).catch(function(){ return ''; });
}

  L.push('Campos: portada (URL directa a imagen pública), tracklist (array de {"titulo","duracion"}), anio, sello, numeroCatalogo, pais, formatoDetalle, genero, notas.');
  L.push('El género debe ser exactamente uno de: ' + GENEROS.join(' | '));
  L.push('Nacional = artista de España; Internacional = resto. BSO para bandas sonoras.');
  L.push('Formato: {"portada":"","tracklist":[],"anio":"","sello":"","numeroCatalogo":"","pais":"","formatoDetalle":"","genero":"","notas":""}');
  L.push('No inventes: si no verificas un dato, deja "" o [].');
  return fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6', max_tokens:2000,
      messages:[{role:'user', content:L.join('\n')}],
      tools:[{type:'web_search_20250305', name:'web_search'}]
    })
  }).then(function(r){ if(!r.ok) throw new Error('api'); return r.json(); }).then(function(data){
    var text = (data.content || []).filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('\n');
    var m = text.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('json');
    var p = JSON.parse(m[0]);
    var g = (p.genero || '').trim();
    if(g && GENEROS.indexOf(g) < 0) g = clasificar(g, /nacional/i.test(g), artista);
    return {

    };
  });

   7. IMPORTACIÓN Y EXPORTACIÓN
   ============================================================ */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  var rows = [], row = [], cur = '', q = false, i = 0;
  while(i < text.length){
    var c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    }else{
      if(c === '"') q = true;
      else if(c === ','){ row.push(cur); cur = ''; }
      else if(c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
      else if(c === '\r'){ /* nada */ }
      else cur += c;
    }
    i++;
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  if(!rows.length) return [];
  var head = rows.shift().map(function(h){ return h.trim(); });
  return rows.filter(function(r){ return r.length > 1; }).map(function(r){
    var o = {}; head.forEach(function(h, j){ o[h] = (r[j] || '').trim(); }); return o;
  });
}
function csvCell(v){
  var s = (v == null ? '' : String(v));
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function filaADisco(x){
  var titulo = (x['Title'] || x['Título'] || x['Titulo'] || '').trim();
  var artista = (x['Artist'] || x['Artista'] || '').trim();
  if(!titulo && !artista) return null;
  var fmtRaw = (x['Format'] || x['Formato'] || '').trim();
  var formato = fmtRaw.toLowerCase().indexOf('cd') >= 0 ? 'CD' : 'Vinilo';
  return normDisc({
    id: uid(), artista: artista, titulo: titulo,
    'año': (x['Released'] || x['Año'] || '').trim(),
    formato: formato, formatoDetalle: fmtRaw,
    genero: clasificar(x['Genre'] || x['Style'] || x['Género'] || '', false, artista),
    sello: (x['Label'] || x['Sello'] || '').trim(),
    numeroCatalogo: (x['Catalog#'] || x['Catálogo'] || '').trim(),
    estado: (x['Collection Media Condition'] || x['Estado'] || '').trim(),
    notas: (x['Collection Notes'] || x['Notas'] || '').trim(),
    lista: /wishlist|deseos/i.test(x['CollectionFolder'] || '') ? 'deseos' : 'coleccion',

  });

/* Clasifica cada fila del CSV: nuevo, idéntico o dudoso.
   Nunca sobrescribe: los idénticos se descartan y los dudosos se preguntan. */
function nucleoTitulo(t){
  return plain(String(t || '')
    .replace(/[\(\[][^\)\]]*[\)\]]/g, ' ')
    .replace(/\b(remaster(ed)?|remasterizado|deluxe|expanded|edition|edicion|edición|anniversary|aniversario|reissue|reedicion|reedición|bonus|special|especial|limited|limitada|version|versión|digipak|digipack|vol|volume|volumen)\b/gi, ' ')
    .replace(/\s*[-–—:]\s*$/, ''));
}
function analizarImportacion(filas){
  var nuevos = [], identicos = [], dudosos = [];
  var porClave = {}, porArtista = {}, porCat = {};
  var registrar = function(d){
    porClave[key(d)] = d;
    var a = plain(d.artista);
    (porArtista[a] = porArtista[a] || []).push(d);
    if(d.numeroCatalogo) porCat[plain(d.numeroCatalogo)] = d;
  };
  DB.discos.forEach(registrar);
  filas.forEach(function(fila){
    var d = filaADisco(fila);
    if(!d) return;
    var exacto = porClave[key(d)];
    if(exacto){ identicos.push({nuevo:d, actual:exacto}); return; }

    var cands = porArtista[plain(d.artista)] || [], mejor = null, mejorS = 0, motivo = '';
    var nuc = nucleoTitulo(d.titulo);
    cands.forEach(function(c){
      var s = similitud(c.titulo, d.titulo), m = 'títulos parecidos';
      var nc = nucleoTitulo(c.titulo);
      if(nuc && nc && nuc === nc){ s = Math.max(s, 0.97); m = 'mismo álbum, edición distinta'; }
      if(d.numeroCatalogo && c.numeroCatalogo && plain(d.numeroCatalogo) === plain(c.numeroCatalogo)){ s = 1; m = 'mismo número de catálogo'; }
      if(s > mejorS){ mejorS = s; mejor = c; motivo = m; }
    });
    if(!mejor && d.numeroCatalogo && porCat[plain(d.numeroCatalogo)]){
      mejor = porCat[plain(d.numeroCatalogo)]; mejorS = 1; motivo = 'mismo número de catálogo';
    }
    if(mejor && mejorS >= 0.72){ dudosos.push({nuevo:d, actual:mejor, score:mejorS, motivo:motivo}); return; }
    nuevos.push(d);
    registrar(d);
  });
  return {nuevos:nuevos, identicos:identicos, dudosos:dudosos};
}
function importCsv(file){
  var r = new FileReader();
  r.onload = function(){
    var filas = parseCSV(String(r.result));
    if(!filas.length){ toast('El CSV está vacío o no se pudo leer', true); return; }
    var an = analizarImportacion(filas);
    pantallaImportacion(an, filas.length);
  };
  r.readAsText(file);
}

function revisarDudosos(dudosos, yaAnadidos){
  var i = 0, res = {mantener:0, sustituir:0, ambos:0}, aplicarTodo = '';
  var nuevosCompletar = [];
  var s = sheet('Revisar posibles repetidos', '<div id="revBody"></div>',
    '<button class="btn" id="revSalir">Terminar</button><div class="rowb" id="revBtns"></div>');
  var $ = function(q){ return s.querySelector(q); };

  function campo(k, a, b){
    var dif = String(a || '') !== String(b || '');
    return '<div class="f' + (dif ? ' dif' : '') + '"><span class="k">' + k + '</span><span class="v">' + esc(a || '—') + '</span></div>';
  }
  function ficha(d, titulo, clase){
    return '<div class="vsc ' + (clase || '') + '"><div class="h">' + titulo + '</div>'
      + '<div style="text-align:center;margin-bottom:10px"><div style="width:76px;height:76px;margin:0 auto;border-radius:10px;overflow:hidden;background:var(--fill);display:flex;align-items:center;justify-content:center">'
      + (d.portada ? '<img src="' + esc(d.portada) + '" style="width:100%;height:100%;object-fit:cover" onerror="this.remove()">' : I.disc) + '</div></div>'
      + '<div style="font-size:14px;font-weight:600;text-align:center;line-height:1.3;margin-bottom:2px">' + esc(d.titulo) + '</div>'
      + '<div style="font-size:12.5px;color:var(--txt2);text-align:center;margin-bottom:10px">' + esc(d.artista) + '</div>'
      + '<div>' + '</div></div>';
  }
  function pintar(){
    if(i >= dudosos.length){ terminar(); return; }
    var par = dudosos[i], a = par.actual, b = par.nuevo;
    var comparar = function(d, otro){
      return campo('Año', d['año'], otro['año']) + campo('Soporte', d.formato, otro.formato)
        + campo('Formato', d.formatoDetalle, otro.formatoDetalle) + campo('Sello', d.sello, otro.sello)
        + campo('Catálogo', d.numeroCatalogo, otro.numeroCatalogo) + campo('Estado', d.estado, otro.estado)
        + campo('Temas', d.tracklist.length || '—', otro.tracklist.length || '—');
    };
    $('#revBody').innerHTML =
      '<div class="impbar"><span>Dudoso ' + (i + 1) + ' de ' + dudosos.length + '</span>'
      + '<span>' + esc(par.motivo || 'parecido') + ' · ' + Math.round(par.score * 100) + '%</span></div>'
      + '<div class="vs">'
        + ficha(a, 'La tuya', 'win').replace('<div></div>', comparar(a, b))
        + ficha(b, 'La del CSV', '').replace('<div></div>', comparar(b, a))
      + '</div>'
      + '<div class="rowb" style="justify-content:center"><label style="font-size:12.5px;color:var(--txt2);display:flex;align-items:center;gap:6px">'
      + '<input type="checkbox" id="revTodo"> Aplicar lo mismo al resto</label></div>';
    $('#revBtns').innerHTML =
      '<button class="btn sm" data-r="ambos">Guardar las dos</button>'
      + '<button class="btn sm" data-r="sustituir">Sustituir</button>'
      + '<button class="btn pri sm" data-r="mantener">Mantener la mía</button>';
    $('#revBtns').querySelectorAll('[data-r]').forEach(function(b2){
      b2.onclick = function(){
        var acc = b2.dataset.r;
        if($('#revTodo') && $('#revTodo').checked) aplicarTodo = acc;
        decidir(acc);
      };
    });
  }
  function decidir(acc){
    var par = dudosos[i], a = par.actual, b = par.nuevo;
    if(acc === 'sustituir'){
      b.id = a.id; b.fechaAlta = a.fechaAlta;
      b.portada = b.portada || a.portada;
      b.tracklist = b.tracklist.length ? b.tracklist : a.tracklist;
      b.etiquetas = a.etiquetas; b.escuchas = a.escuchas; b.prestadoA = a.prestadoA; b.prestadoDesde = a.prestadoDesde;
      DB.discos = DB.discos.map(function(x){ return x.id === a.id ? b : x; });
      nuevosCompletar.push(b);
      res.sustituir++;
    }else if(acc === 'ambos'){
      DB.discos.push(b);
      nuevosCompletar.push(b);
      res.ambos++;
    }else res.mantener++;
    i++;
    if(aplicarTodo && i < dudosos.length){ decidir(aplicarTodo); return; }
    pintar();
  }
  function terminar(){
    persist();
    s.remove();
    var partes = [];
    if(yaAnadidos) partes.push(yaAnadidos + ' añadidos');
    if(res.ambos) partes.push(res.ambos + ' guardados aparte');
    if(res.sustituir) partes.push(res.sustituir + ' sustituidos');
    if(res.mantener) partes.push(res.mantener + ' conservados');
    toast(partes.join(' · ') || 'Sin cambios');
    var pend = nuevosCompletar.filter(incompleto);
    if(pend.length) setTimeout(function(){ bulkRun(pend); }, 600);
  }
  $('#revSalir').onclick = terminar;
  pintar();
}

/* ---------- imagen local para la carátula ---------- */
function shrinkDataUri(dataUri, maxPx, q){
  return new Promise(function(res){
    var img = new Image();
    img.onload = function(){
      var m = maxPx || 600, sc = Math.min(1, m / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try{ res(c.toDataURL('image/jpeg', q || 0.82)); }catch(e){ res(dataUri); }
    };
    img.onerror = function(){ res(dataUri); };
    img.src = dataUri;
  });
}
function fileToDataUri(file, maxPx){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ shrinkDataUri(String(fr.result), maxPx || 600, .82).then(res); };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

function catalogoImprimible(){

/* ============================================================
   8. ESCÁNER DE CÓDIGOS DE BARRAS
      Chrome de escritorio y Android usan el lector del sistema.
      En iPhone se carga un lector en JavaScript que sí funciona
      sobre el motor de Safari.
   ============================================================ */
var ZX_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
var zxCargando = null;
function cargarZX(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(zxCargando) return zxCargando;
  zxCargando = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = ZX_URL;
    s.onload = function(){ res(window.ZXing); };
    s.onerror = function(){ zxCargando = null; rej(new Error('cdn')); };
    document.head.appendChild(s);
  });
  return zxCargando;
}
function lectorZX(){
  var Z = window.ZXing;
  var hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [
    Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.EAN_8,
    Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39
  ]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  return new Z.BrowserMultiFormatReader(hints, 200);
}
/* Reduce una foto a un tamaño que el lector maneja bien */
function fotoParaLeer(file, lado){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var m = lado || 1600, sc = Math.min(1, m / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, c.width, c.height);
        /* más contraste: los códigos impresos en fundas brillantes se leen mucho mejor */
        try{
          var dat = ctx.getImageData(0, 0, c.width, c.height), px = dat.data;
          for(var i = 0; i < px.length; i += 4){
            var g = (px[i] * .299 + px[i+1] * .587 + px[i+2] * .114);
            g = g < 110 ? 0 : (g > 150 ? 255 : (g - 110) * 255 / 40);
            px[i] = px[i+1] = px[i+2] = g;
          }
          ctx.putImageData(dat, 0, 0);
        }catch(e){}
        res(c.toDataURL('image/png'));
      };
      img.onerror = rej;
      img.src = String(fr.result);
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
function escanear(){
  var body = '<div id="scanwrap"><video id="vid" playsinline muted autoplay></video>'
    + '<div class="scanbox"><i></i><i></i><i></i><i></i></div><div class="scanline"></div></div>'
    + '<div class="note busy" id="snote" style="margin-top:12px">Preparando la cámara…</div>'
    + '<div class="warnb info" style="margin-top:14px">' + I.info
    + '<span>Acerca el código hasta que llene el recuadro y sujeta firme un par de segundos. '
    + 'Con poca luz cuesta: usa la opción de la foto.</span></div>'
    + '<div class="group"><div class="grow"><label>O escríbelo</label>'
    + '<input id="cbMan" type="text" inputmode="numeric" enterkeyhint="search" placeholder="0724384296520"></div></div>';
  var pie = '<button class="btn sm" id="btnFoto">' + I.img + 'Usar una foto</button>'
    + '<div class="rowb"><button class="btn" id="scanCancel">Cancelar</button><button class="btn pri" id="cbOk">Buscar</button></div>';
  var s = sheet('Escanear disco', body, pie);
  var video = s.querySelector('#vid'), stream = null, parar = false, lector = null;
  var nota = function(txt, cls){ var n = s.querySelector('#snote'); if(n){ n.className = 'note ' + (cls || 'busy'); n.textContent = txt; } };
  var cerrar = function(){
    parar = true;
    try{ if(lector) lector.reset(); }catch(e){}
    if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
  };
  var encontrado = function(codigo){
    if(parar) return;
    cerrar(); s.remove();
    altaPorCodigo(codigo);
  };
  s.querySelector('#scanCancel').onclick = function(){ cerrar(); s.remove(); };
  s.querySelector('[data-close]').addEventListener('click', cerrar);
  s.querySelector('#cbOk').onclick = function(){
    var v = s.querySelector('#cbMan').value.replace(/\D/g, '');
    if(v.length >= 8){ cerrar(); s.remove(); altaPorCodigo(v); }
    else nota('Ese código no parece válido', 'err');
  };
  s.querySelector('#cbMan').onkeydown = function(e){ if(e.key === 'Enter') s.querySelector('#cbOk').click(); };
  s.querySelector('#btnFoto').onclick = function(){
    var inp = document.getElementById('filePhoto');
    inp.value = '';
    inp.onchange = function(ev){
      var f = ev.target.files[0];
      if(!f) return;
      nota('Leyendo la foto…');
      cargarZX().then(function(){
        return fotoParaLeer(f, 1600);
      }).then(function(uri){
        var rd = lectorZX();
        return rd.decodeFromImageUrl(uri).catch(function(){
          return fotoParaLeer(f, 2400).then(function(u2){ return lectorZX().decodeFromImageUrl(u2); });
        });
      }).then(function(r){
        encontrado(r.getText());
      }).catch(function(){
        nota('No se distingue el código en esa foto. Prueba más cerca, con buena luz y el código recto.', 'err');
      });
    };
    inp.click();
  };

  /* La cámara necesita resolución alta: con 640x480 las barras finas no se resuelven */
  var restricciones = {
    video: {
      facingMode: {ideal:'environment'},
      width: {ideal: 1920}, height: {ideal: 1080},
      focusMode: 'continuous', advanced: [{focusMode:'continuous'}]
    }
  };
  var conNativo = function(){
    if(!('BarcodeDetector' in window)) return Promise.reject(new Error('sin api'));
    var det = new window.BarcodeDetector({formats:['ean_13','upc_a','ean_8','upc_e','code_128']});
    return navigator.mediaDevices.getUserMedia(restricciones).then(function(st){
      stream = st; video.srcObject = st;
      nota('Encuadra el código de barras de la contraportada');
      var tick = function(){
        if(parar) return;
        det.detect(video).then(function(c){
          if(c && c.length) return encontrado(c[0].rawValue);
          setTimeout(tick, 250);
        }).catch(function(){ setTimeout(tick, 450); });
      };
      video.play().then(function(){ setTimeout(tick, 500); }).catch(function(){ setTimeout(tick, 900); });
    });
  };
  var conZX = function(){
    nota('Preparando el lector…');
    return cargarZX().then(function(){
      lector = lectorZX();
      nota('Encuadra el código de barras de la contraportada');
      return lector.decodeFromConstraints(restricciones, video, function(result, err){
        if(result) encontrado(result.getText());
      });
    });
  };
  conNativo().catch(conZX).catch(function(){
    nota('No se pudo abrir la cámara. Escribe el código o usa una foto.', 'err');
  });
}

function filtrados(base){

    if(fType === 'rev' && d.confianza !== 'baja') return false;
    if(fType === 'noesc' && totalEscuchas(d) > 0) return false;
    if(fType === 'fav' && (d.valoracion || 0) < 4) return false;

        + ' ' + d.tracklist.map(function(t){ return t.titulo; }).join(' ').toLowerCase();

function ordenar(list){
  var l = list.slice();
  if(sortBy === 'random') return rngShuffle(l, randomSeed);
  l.sort(function(a, b){
    if(sortBy === 'artist') return (a.artista || '').localeCompare(b.artista || '', 'es')
      || String(a['año'] || '').localeCompare(String(b['año'] || ''))
      || (a.titulo || '').localeCompare(b.titulo || '', 'es');
    if(sortBy === 'title') return (a.titulo || '').localeCompare(b.titulo || '', 'es');
    if(sortBy === 'year-desc') return (parseInt(b['año']) || 0) - (parseInt(a['año']) || 0);
    if(sortBy === 'year-asc') return (parseInt(a['año']) || 9999) - (parseInt(b['año']) || 9999);
    if(sortBy === 'plays') return totalEscuchas(b) - totalEscuchas(a) || (a.artista || '').localeCompare(b.artista || '', 'es');
    if(sortBy === 'last') return String(b.ultimaEscucha || '').localeCompare(String(a.ultimaEscucha || ''));
    if(sortBy === 'rating') return (b.valoracion || 0) - (a.valoracion || 0) || totalEscuchas(b) - totalEscuchas(a);
    return String(b.fechaAlta || '').localeCompare(String(a.fechaAlta || ''));
  });
  return l;
}

  var list = ordenar(filtrados(base));

    + kpi(I.img, 'Con portada', conPort, conPort / tot, 'var(--green)')

    pintarAZ([]);

    pintarAZ(sortBy === 'artist' || sortBy === 'title' ? list.map(function(d){ return (sortBy === 'artist' ? d.artista : d.titulo); }) : []);
  }else{
    var orden = [], mapa = {};
    list.forEach(function(d){
      var k = claveGrupo(d);
      if(!mapa[k]){ mapa[k] = []; orden.push(k); }
      mapa[k].push(d);
    });
    if(grupo === 'artista' || grupo === 'sello' || grupo === 'pais' || grupo === 'genero') orden.sort(function(a, b){ return a.localeCompare(b, 'es'); });
    if(grupo === 'decada') orden.sort();
    board.innerHTML = orden.map(function(k, i){

function abrirPaleta(){
  var p = document.createElement('div');
  p.className = 'pal';
  p.innerHTML = '<div class="palbox"><div class="palin">' + I.search
    + '<input id="pq" placeholder="Buscar discos, artistas, canciones o acciones…" autocomplete="off"></div>'
    + '<div class="palres" id="pres"></div>'
    + '<div class="palhint"><span>↑↓ moverse</span><span>↵ abrir</span><span>esc cerrar</span></div></div>';
  document.body.appendChild(p);
  var inp = p.querySelector('#pq'), res = p.querySelector('#pres'), sel = 0, items = [];
  var acciones = [
    {t:'Añadir disco', s:'Nueva ficha', k:'Acción', run:function(){ openForm(null); }},
    {t:'Añadir a deseos', s:'Lista de deseos', k:'Acción', run:function(){ openForm(null, 'deseos'); }},
    {t:'Completar todo automáticamente', s:'Rellena las fichas incompletas', k:'Acción', run:function(){ setView('col'); bulkRun(); }},
    {t:'Guardar', s:'Escribe o descarga el index.html', k:'Acción', run:function(){ guardar(); }},
    {t:'Sorpréndeme', s:'Un disco al azar', k:'Acción', run:function(){ discoAlAzar(); }},
    {t:'Escanear código de barras', s:'Alta con la cámara', k:'Acción', run:function(){ escanear(); }},
    {t:'Estadísticas', s:'Gráficos de la colección', k:'Ir a', run:function(){ setView('stats'); }},
    {t:'Archivo y copias', s:'Guardar, exportar, importar', k:'Ir a', run:function(){ setView('db'); }},
    {t:'Catálogo imprimible', s:'Genera un PDF con portadas', k:'Acción', run:function(){ catalogoImprimible(); }}
  ];
  function pinta(){
    var q = inp.value.trim().toLowerCase();
    items = [];
    if(q){
      var vistos = 0;
      DB.discos.forEach(function(d){
        if(vistos >= 8) return;
        var enFicha = (d.titulo + ' ' + d.artista + ' ' + d.sello).toLowerCase().indexOf(q) >= 0;
        var cancion = enFicha ? null : d.tracklist.filter(function(t){ return t.titulo.toLowerCase().indexOf(q) >= 0; })[0];
        if(enFicha || cancion){
          items.push({
            t: d.titulo,
            s: d.artista + ' · ' + (d['año'] || '') + (cancion ? ' · ♪ ' + cancion.titulo : '')
               + (d.lista === 'deseos' ? ' · deseos' : '') + (escuchadoHoy(d) ? ' · escuchado hoy' : ''),
            img: d.portada, d: d, k: cancion ? 'Canción' : d.formato
          });
          if(!readOnly) items.push({
            t: 'Marcar escucha: ' + d.titulo, s: 'Registra que lo has puesto hoy', k: '▶',
            run: (function(x){ return function(){ marcarEscucha(x.id); renderAll(); }; })(d)
          });
          vistos++;
        }
      });
      var arts = [];
      DB.discos.forEach(function(d){ if(d.artista && arts.indexOf(d.artista) < 0 && d.artista.toLowerCase().indexOf(q) >= 0) arts.push(d.artista); });
      arts.slice(0, 3).forEach(function(a){
        items.push({t:a, s:'Ver todos sus discos', k:'Artista', run:function(){ fArt = a; grupo = 'none'; document.getElementById('selGroup').value = 'none'; setView('col'); paintCol(); }});
      });
      acciones.forEach(function(a){ if(a.t.toLowerCase().indexOf(q) >= 0) items.push(a); });
    }else{
      items = acciones.slice();
    }
    sel = 0;
    res.innerHTML = items.map(function(it, i){
      var img = it.img ? '<img src="' + esc(it.img) + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '<div class="phb">' + I.music + '</div>';
      return '<div class="palrow' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '">' + img
        + '<div class="txt"><div class="t">' + esc(it.t) + '</div><div class="s">' + esc(it.s || '') + '</div></div>'
        + '<span class="k">' + esc(it.k || '') + '</span></div>';
    }).join('') || '<div class="tl-empty">Sin resultados</div>';
    res.querySelectorAll('.palrow').forEach(function(r){
      r.onclick = function(){ ejecutar(+r.dataset.i); };
    });
  }
  function marca(){
    res.querySelectorAll('.palrow').forEach(function(r, i){ r.className = 'palrow' + (i === sel ? ' sel' : ''); });
    var el = res.querySelectorAll('.palrow')[sel];
    if(el) el.scrollIntoView({block:'nearest'});
  }
  function ejecutar(i){
    var it = items[i];
    if(!it) return;
    cerrar();
    if(it.run) it.run();
    else if(it.d) openDetail(it.d.id);
  }
  function cerrar(){ p.remove(); document.removeEventListener('keydown', tecla, true); }
  function tecla(e){
    if(e.key === 'Escape'){ e.preventDefault(); cerrar(); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(sel + 1, items.length - 1); marca(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(sel - 1, 0); marca(); }
    else if(e.key === 'Enter'){ e.preventDefault(); ejecutar(sel); }
  }
  inp.oninput = pinta;
  document.addEventListener('keydown', tecla, true);
  p.addEventListener('mousedown', function(e){ if(e.target === p) cerrar(); });
  pinta();
  inp.focus();
}

  openDetail(ds[Math.floor(Math.random() * ds.length)].id);

function sheet(title, bodyHtml, footHtml, ancho){
  var s = document.createElement('div');

  s.innerHTML = '<div class="sheet' + (ancho ? ' wide' : '') + '"><div class="grabber"></div><div class="sheet-hd"><h2>' + esc(title) + '</h2>'

  s.querySelector('[data-close]').onclick = cerrar;
  s.dataset.cerrable = '1';
  s.addEventListener('mousedown', function(e){ if(e.target === s) cerrar(); });
  function onKey(ev){ if(ev.key === 'Escape' && !document.querySelector('.pal')) cerrar(); }
  document.addEventListener('keydown', onKey);
  arrastrarParaCerrar(s, cerrar);
  return s;
}
/* En el móvil, arrastrar desde la barrita superior cierra la hoja.
   Nunca interfiere con el desplazamiento del contenido. */
function arrastrarParaCerrar(scrim, cerrar){
  var hoja = scrim.querySelector('.sheet');
  if(!hoja || window.innerWidth > 760) return;
  var asa = hoja.querySelector('.grabber');
  if(!asa) return;
  var y0 = null, dy = 0;
  asa.addEventListener('touchstart', function(e){
    y0 = e.touches[0].clientY; dy = 0;
    hoja.style.transition = 'none';
  }, {passive:true});
  asa.addEventListener('touchmove', function(e){
    if(y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    hoja.style.transform = 'translateY(' + dy + 'px)';
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  var soltar = function(){
    if(y0 === null) return;
    hoja.style.transition = 'transform .28s var(--ease)';
    if(dy > 90){ hoja.style.transform = 'translateY(100%)'; setTimeout(cerrar, 230); }
    else hoja.style.transform = '';
    y0 = null; dy = 0;
  };
  asa.addEventListener('touchend', soltar);
  asa.addEventListener('touchcancel', soltar);
}

/* ---------- fusionar duplicados ---------- */
function fusionarDuplicados(base){
  var grupo2 = DB.discos.filter(function(x){ return key(x) === key(base); });
  if(grupo2.length < 2){ toast('No hay fichas repetidas de este disco'); return; }
  var campos = ['año','genero','sello','numeroCatalogo','pais','estado','fechaCompra','portada','notas','formatoDetalle','mbid','rgid','discogs','codigoBarras'];
  var res = normDisc(JSON.parse(JSON.stringify(grupo2[0])));
  grupo2.forEach(function(d){
    campos.forEach(function(f){ if(!res[f] && d[f]) res[f] = d[f]; });
    if(!res.precioCompra && d.precioCompra) res.precioCompra = d.precioCompra;
    if(res.tracklist.length < d.tracklist.length) res.tracklist = d.tracklist;
    d.etiquetas.forEach(function(t){ if(res.etiquetas.indexOf(t) < 0) res.etiquetas.push(t); });
    res.escuchas = Math.max(res.escuchas, d.escuchas || 0);
  });
  var s = sheet('Fusionar ' + grupo2.length + ' fichas',
    '<p style="font-size:14.5px;color:var(--txt2);line-height:1.5;margin:0 0 14px">Se conservará una sola ficha con lo mejor de cada una: '
    + 'el tracklist más completo, la portada, y todos los campos rellenos. Las demás se eliminarán.</p>'
    + '<div class="specs">' + spec('Título', res.titulo) + spec('Artista', res.artista) + spec('Año', res['año'] || '—')
    + spec('Sello', res.sello || '—') + spec('Temas', res.tracklist.length) + spec('Portada', res.portada ? 'Sí' : 'No') + '</div>',
    '<span></span><div class="rowb"><button class="btn" data-close5>Cancelar</button><button class="btn pri" id="okf">Fusionar</button></div>');

function estrellaSVG(llena){
  return '<svg class="ic st' + (llena ? ' on' : '') + '" viewBox="0 0 24 24"' + (llena ? ' fill="currentColor" stroke="none"' : '') + '>'
    + '<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>';
}
function estrellasHtml(n, grande, id){
  var v = Number(n) || 0, out = '<span class="stars' + (grande ? ' big' : '') + '"' + (id ? ' data-rate="' + id + '"' : '') + '>';
  for(var i = 1; i <= 5; i++){
    out += grande ? '<span data-v="' + i + '" role="button" aria-label="' + i + ' estrellas">' + estrellaSVG(i <= v) + '</span>'
                  : estrellaSVG(i <= v);
  }
  return out + '</span>';
}
var TEXTO_VALORACION = ['Sin valorar', 'Flojo', 'Correcto', 'Bueno', 'Muy bueno', 'Imprescindible'];
function montarEstrellas(caja, d, alCambiar){
  if(!caja) return;
  caja.querySelectorAll('[data-v]').forEach(function(el){

      d.valoracion = (d.valoracion === v) ? 0 : v;

      montarEstrellas(caja, d, alCambiar);
      if(alCambiar) alCambiar(d.valoracion);

}

/* ---------- Wikipedia en español ---------- */
var wikiCache = {};
function wikiBuscar(termino){
  if(wikiCache[termino]) return Promise.resolve(wikiCache[termino]);
  var api = 'https://es.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts|pageimages'
    + '&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=300&redirects=1&generator=search&gsrlimit=1&gsrsearch='
    + encodeURIComponent(termino);
  return fetch(api).then(function(r){ return r.json(); }).then(function(j){
    var pages = j && j.query && j.query.pages;
    if(!pages) throw new Error('sin resultados');
    var k = Object.keys(pages)[0], p = pages[k];
    if(!p || !p.extract) throw new Error('sin extracto');
    var res = {
      titulo: p.title,
      extracto: p.extract,
      img: p.thumbnail ? p.thumbnail.source : '',
      url: 'https://es.wikipedia.org/wiki/' + encodeURIComponent(p.title.replace(/ /g, '_'))
    };
    wikiCache[termino] = res;
    return res;
  });
}
function verWikipedia(d, sobreAlbum){
  var termino = sobreAlbum ? (d.titulo + ' ' + d.artista + ' álbum') : d.artista;
  var s = sheet(sobreAlbum ? d.titulo : d.artista,
    '<div class="note busy" id="wnote">Buscando en Wikipedia en español…</div><div id="wbody"></div>',
    '<button class="btn" id="wOtro">' + (sobreAlbum ? 'Ver el artista' : 'Ver el álbum') + '</button>'
    + '<a class="btn pri" id="wLink" target="_blank" rel="noopener" href="#">Abrir en Wikipedia</a>');
  var $ = function(q){ return s.querySelector(q); };
  $('#wOtro').onclick = function(){ s.remove(); verWikipedia(d, !sobreAlbum); };
  wikiBuscar(termino).then(function(w){
    $('#wnote').style.display = 'none';
    $('#wLink').href = w.url;
    var parrafos = w.extracto.split('\n').filter(function(p){ return p.trim().length > 30; }).slice(0, 3);
    $('#wbody').innerHTML =
      '<div class="wikihd">' + (w.img ? '<img src="' + esc(w.img) + '" alt="">' : '')
      + '<div><div class="n">' + esc(w.titulo) + '</div><div class="d">Wikipedia en español</div></div></div>'
      + '<div class="wiki">' + parrafos.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('')
      + '<div class="fuente">Extracto de <a href="' + esc(w.url) + '" target="_blank" rel="noopener">'
      + esc(w.titulo) + '</a> en Wikipedia, bajo licencia CC BY-SA.</div></div>';
  }).catch(function(){
    $('#wnote').className = 'note err';
    $('#wnote').textContent = 'No hay artículo en español sobre ' + (sobreAlbum ? 'este disco' : 'este artista') + '.';
    $('#wLink').href = 'https://es.wikipedia.org/w/index.php?search=' + encodeURIComponent(termino);
  });
}

function duracionTotal(d){
  var seg = 0, n = 0;
  (d.tracklist || []).forEach(function(t){
    var m = String(t.duracion || '').match(/^(\d+):(\d{2})$/);
    if(m){ seg += (+m[1]) * 60 + (+m[2]); n++; }
  });
  if(!n) return '';
  var h = Math.floor(seg / 3600), mi = Math.round(seg % 3600 / 60);
  return h ? h + ' h ' + mi + ' min' : mi + ' min';

function cargarExtra(d){
  if(!d.mbid) return Promise.reject(new Error('sin mbid'));
  return mbGet('release/' + d.mbid + '?inc=artist-rels+label-rels+release-groups+genres+ratings+recordings')
    .then(function(r){
      var rg = r['release-group'] || {};
      var creditos = {};
      (r.relations || []).forEach(function(rel){
        var tipo = ROLES[rel.type] || null;
        if(!tipo) return;
        var quien = (rel.artist && rel.artist.name) || (rel.label && rel.label.name) || (rel.place && rel.place.name);
        if(!quien) return;
        creditos[tipo] = creditos[tipo] ? (creditos[tipo].indexOf(quien) < 0 ? creditos[tipo] + ', ' + quien : creditos[tipo]) : quien;
      });
      var tags = ((r.genres || []).concat(rg.genres || []))
        .sort(function(a, b){ return (b.count || 0) - (a.count || 0); })
        .map(function(g){ return g.name; }).filter(function(v, i, a){ return a.indexOf(v) === i; }).slice(0, 6);
      var ex = {
        fecha: r.date || '',
        primera: rg['first-release-date'] || '',
        packaging: r.packaging || '',
        idioma: (r['text-representation'] && r['text-representation'].language) || '',
        estado: r.status || '',
        barcode: r.barcode || '',
        discos: (r.media || []).length,
        tipo: rg['primary-type'] || '',
        secundarios: (rg['secondary-types'] || []).join(', '),
        nota: (rg.rating && rg.rating.value) || 0,
        votos: (rg.rating && rg.rating['votes-count']) || 0,
        tags: tags,
        creditos: creditos,
        cargado: nowISO()
      };
      d.extra = ex;
      if(!d.codigoBarras && ex.barcode) d.codigoBarras = ex.barcode;
      persist(true);
      return ex;
    });
}
function pintaExtra(caja, d){
  var ex = d.extra;
  if(!caja) return;
  if(!ex){ caja.innerHTML = ''; return; }
  var filas = [];
  var f = function(k, v){ if(v) filas.push('<div class="cred"><span class="k">' + k + '</span><span class="v">' + esc(v) + '</span></div>'); };
  if(ex.fecha && ex.fecha.length > 4){
    try{ f('Publicado', new Date(ex.fecha + 'T12:00:00').toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'})); }
    catch(e){ f('Publicado', ex.fecha); }
  }
  if(ex.primera && ex.primera.slice(0, 4) !== String(d['año'])) f('Álbum original', ex.primera.slice(0, 4));
  f('Duración', duracionTotal(d));
  if(ex.discos > 1) f('Discos', ex.discos);
  f('Estuche', PACKAGING[ex.packaging] || ex.packaging);
  f('Idioma', IDIOMAS[ex.idioma] || '');
  f('Tipo', traduceTipo([ex.tipo, ex.secundarios].filter(Boolean).join(', ')));
  if(ex.nota) f('Nota en MusicBrainz', ex.nota.toFixed(1) + ' / 5' + (ex.votos ? ' (' + ex.votos + ' votos)' : ''));
  if(ex.barcode) f('Código de barras', ex.barcode);
  Object.keys(ex.creditos).forEach(function(k){ f(k, ex.creditos[k]); });
  var etiquetas = (ex.tags || []).length
    ? '<div class="rowb" style="margin:0 0 18px">' + ex.tags.map(function(t){
        return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>'
    : '';
  caja.innerHTML = (filas.length ? '<div class="tl-hd"><h4>Detalles y créditos</h4></div><div class="creds">' + filas.join('') + '</div>' : '')
    + etiquetas;
}

/* ---------- deseos: ya lo tengo ---------- */
function marcarComprado(id, padre){
  var d = DB.discos.filter(function(x){ return x.id === id; })[0];
  if(!d) return;
  var body = '<p style="font-size:15px;color:var(--txt2);line-height:1.5;margin:0 0 16px">Vas a mover <b style="color:var(--txt)">'
    + esc(d.titulo) + '</b> de ' + esc(d.artista) + ' a tu colección. ¿En qué formato lo has comprado?</p>'
    + '<div class="segtype" id="cFmt">'
      + '<button data-f="Vinilo" class="' + (d.formato === 'Vinilo' ? 'on' : '') + '">' + I.vinilo + 'Vinilo</button>'
      + '<button data-f="CD" class="' + (d.formato === 'CD' ? 'on' : '') + '">' + I.cdIc + 'CD</button>'
    + '</div>'
    + '<div class="group">'
      + '<div class="grow"><label>Comprado el</label><input id="cFecha" type="date" value="' + new Date().toISOString().slice(0, 10) + '"></div>'
      + '<div class="grow"><label>Precio (€)</label><input id="cPrecio" type="number" step="0.01" min="0" placeholder="opcional"></div>'
      + '<div class="grow"><label>Estado</label><input id="cEstado" type="text" value="' + esc(d.estado) + '" placeholder="Mint, VG+…"></div>'
    + '</div>';
  var s = sheet('¿Ya lo tienes?', body,
    '<button class="btn" data-cx>Cancelar</button><button class="btn ok" id="cOk">' + I.check + 'Añadir a la colección</button>');
  var fmt = d.formato;
  s.querySelector('[data-cx]').onclick = function(){ s.remove(); };
  s.querySelector('#cFmt').onclick = function(e){
    var b = e.target.closest('button');
    if(!b) return;
    fmt = b.dataset.f;
    s.querySelectorAll('#cFmt button').forEach(function(x){ x.className = x.dataset.f === fmt ? 'on' : ''; });
  };
  s.querySelector('#cOk').onclick = function(){
    d.lista = 'coleccion';
    d.formato = fmt;
    d.fechaCompra = s.querySelector('#cFecha').value || '';
    var pr = parseFloat(s.querySelector('#cPrecio').value);
    if(pr) d.precioCompra = pr;
    d.estado = s.querySelector('#cEstado').value.trim();
    if(!d.fechaAlta) d.fechaAlta = nowISO();
    persist();
    s.remove();
    if(padre) padre.remove();
    toast('«' + d.titulo + '» ya está en tu colección');
    if(incompleto(d)) enrich(d.id, false);
  };
}

/* ---------- curiosidades ---------- */
function curiosidades(){
  var ds = coleccion();
  if(ds.length < 4) return [];
  var out = [];
  var cuenta = function(fn){
    var m = {};
    ds.forEach(function(d){ var k = fn(d); if(k) m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).map(function(k){ return {k:k, v:m[k]}; }).sort(function(a, b){ return b.v - a.v; });
  };
  var art = cuenta(function(d){ return d.artista; });
  var sel = cuenta(function(d){ return d.sello; });
  var dec = cuenta(function(d){ var y = parseInt(d['año']); return y ? Math.floor(y / 10) * 10 : 0; });
  var anios = cuenta(function(d){ return d['año']; });
  var pais = cuenta(function(d){ return d.pais; });
  var vin = ds.filter(function(d){ return d.formato === 'Vinilo'; }).length;
  var temas = ds.reduce(function(a, d){ return a + d.tracklist.length; }, 0);

  if(art[0] && art[0].v > 1) out.push('Tu artista más presente es <b>' + esc(art[0].k) + '</b>, con <b>' + art[0].v + ' discos</b> en la estantería.');
  if(dec[0]) out.push('La década de los <b>' + dec[0].k + '</b> domina tu colección: <b>' + dec[0].v + ' discos</b>, un ' + Math.round(dec[0].v / ds.length * 100) + '% del total.');
  if(anios[0] && anios[0].v > 2) out.push('<b>' + anios[0].k + '</b> fue un buen año para ti: tienes <b>' + anios[0].v + ' discos</b> publicados ese año.');
  if(sel[0] && sel[0].v > 2) out.push('El sello que más se repite es <b>' + esc(sel[0].k) + '</b>, con <b>' + sel[0].v + ' referencias</b>.');
  if(temas) out.push('Entre todos tus discos suman <b>' + temas + ' canciones</b>. Puestas seguidas serían más de <b>' + Math.round(temas * 4 / 60) + ' horas</b> de música.');
  out.push('Tu colección es <b>' + Math.round(vin / ds.length * 100) + '% vinilo</b> y <b>' + Math.round((ds.length - vin) / ds.length * 100) + '% CD</b>.');
  if(pais[0] && PAISES[pais[0].k]) out.push('La mayoría de tus prensados vienen de <b>' + nombrePais(pais[0].k) + '</b> ' + bandera(pais[0].k) + ': <b>' + pais[0].v + ' discos</b>.');

  var viejo = ds.filter(function(d){ return parseInt(d['año']) > 1900; }).sort(function(a, b){ return parseInt(a['año']) - parseInt(b['año']); })[0];
  if(viejo) out.push('El disco más veterano es <b>' + esc(viejo.titulo) + '</b> de ' + esc(viejo.artista) + ', de <b>' + viejo['año'] + '</b>. Tiene ya ' + (new Date().getFullYear() - parseInt(viejo['año'])) + ' años.');
  var nuevo = ds.slice().sort(function(a, b){ return parseInt(b['año'] || 0) - parseInt(a['año'] || 0); })[0];
  if(nuevo && nuevo['año']) out.push('Lo más reciente que tienes es de <b>' + nuevo['año'] + '</b>: ' + esc(nuevo.titulo) + ', de ' + esc(nuevo.artista) + '.');

  var largo = ds.filter(function(d){ return d.tracklist.length; }).sort(function(a, b){ return b.tracklist.length - a.tracklist.length; })[0];
  if(largo) out.push('<b>' + esc(largo.titulo) + '</b> es tu disco con más canciones: <b>' + largo.tracklist.length + ' temas</b>.');

  var titulos = {};
  ds.forEach(function(d){ d.tracklist.forEach(function(t){ var k = plain(t.titulo); if(k.length > 3) titulos[k] = (titulos[k] || 0) + 1; }); });
  var rep = Object.keys(titulos).filter(function(k){ return titulos[k] > 1; }).sort(function(a, b){ return titulos[b] - titulos[a]; })[0];
  if(rep){
    var nombreReal = '';
    ds.some(function(d){ return d.tracklist.some(function(t){ if(plain(t.titulo) === rep){ nombreReal = t.titulo; return true; } }); });
    out.push('Tienes <b>' + titulos[rep] + ' versiones</b> de la misma canción: <b>' + esc(nombreReal) + '</b>.');
  }

  var conNota = ds.filter(function(d){ return d.valoracion; });
  if(conNota.length > 2){
    var media = conNota.reduce(function(a, d){ return a + d.valoracion; }, 0) / conNota.length;
    out.push('Has valorado <b>' + conNota.length + ' discos</b> con una media de <b>' + media.toFixed(1) + ' estrellas</b>.');
    var cinco = conNota.filter(function(d){ return d.valoracion === 5; });
    if(cinco.length) out.push('Para ti son imprescindibles <b>' + cinco.length + ' discos</b>. El primero de la lista: ' + esc(cinco[0].titulo) + '.');
  }
  var escuchados = ds.filter(function(d){ return totalEscuchas(d) > 0; });
  if(escuchados.length){
    var top = escuchados.slice().sort(function(a, b){ return totalEscuchas(b) - totalEscuchas(a); })[0];
    out.push('El disco que más has puesto es <b>' + esc(top.titulo) + '</b>, <b>' + totalEscuchas(top) + ' veces</b>.');
    out.push('Llevas <b>' + escuchados.length + ' discos</b> estrenados de ' + ds.length + '. Te quedan <b>' + (ds.length - escuchados.length) + '</b> por poner.');
  }
  var gasto = ds.reduce(function(a, d){ return a + (d.precioCompra || 0); }, 0);
  if(gasto > 0) out.push('Lo que llevas registrado en compras suma <b>' + gasto.toFixed(0) + ' €</b>, a una media de ' + (gasto / ds.filter(function(d){ return d.precioCompra; }).length).toFixed(1) + ' € por disco.');

  var huecos = [];
  for(var y = 1960; y <= new Date().getFullYear(); y += 10){
    if(!dec.some(function(x){ return +x.k === y; })) huecos.push(y + 's');
  }
  if(huecos.length && huecos.length < 4) out.push('No tienes ningún disco de los <b>' + huecos.join(' ni de los ') + '</b>. Un hueco por llenar.');

  var solos = art.filter(function(a){ return a.v === 1; }).length;
  if(solos) out.push('De <b>' + solos + ' artistas</b> tienes un único disco. La mitad de tu colección son visitas de una sola vez.');

  var letras = {};
  ds.forEach(function(d){ var L = (d.artista || '?')[0]; if(L) letras[L.toUpperCase()] = (letras[L.toUpperCase()] || 0) + 1; });
  var topL = Object.keys(letras).sort(function(a, b){ return letras[b] - letras[a]; })[0];
  if(topL) out.push('La letra <b>' + topL + '</b> es la más poblada de tu estantería, con <b>' + letras[topL] + ' artistas o discos</b>.');

  return out;
}
function pintaCuriosidad(caja){
  if(!caja) return;
  var lista = curiosidades();
  if(!lista.length){ caja.innerHTML = ''; return; }
  var i = Math.floor(Math.random() * lista.length);
  var pinta = function(){
    caja.innerHTML = '<div class="tip"><div class="bulb">' + I.bombilla + '</div>'
      + '<div class="tx"><div class="k">¿Sabías que…?</div><div class="v">' + lista[i] + '</div></div>'
      + '<button class="otro" id="otraCur" title="Otra curiosidad">' + I.refresh + '</button></div>';
    caja.querySelector('#otraCur').onclick = function(){
      i = (i + 1 + Math.floor(Math.random() * (lista.length - 1))) % lista.length;
      pinta();
    };
  };
  pinta();
}


/* ============================================================
   11. GRÁFICOS
   ============================================================ */
function tally(arr, fn){
  var m = {};
  arr.forEach(function(d){ var k = fn(d); if(k) m[k] = (m[k] || 0) + 1; });
  return Object.keys(m).map(function(k){ return {k:k, v:m[k]}; }).sort(function(a, b){ return b.v - a.v; });
}
function miniRing(pct, color, size){
  var s = size || 42, t = 5, r = (s - t) / 2, c = s / 2, circ = 2 * Math.PI * r;
  var len = circ * Math.max(0, Math.min(1, pct || 0));
  return '<svg class="ring" viewBox="0 0 ' + s + ' ' + s + '" style="width:' + s + 'px;height:' + s + 'px;flex-shrink:0">'
    + '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="var(--fill)" stroke-width="' + t + '"/>'
    + '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + t + '" stroke-linecap="round"'
    + ' stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" transform="rotate(-90 ' + c + ' ' + c + ')"/>'
    + '<text x="' + c + '" y="' + (c + 4) + '" text-anchor="middle" style="font-size:11px;font-weight:600;fill:var(--txt)">'
    + Math.round((pct || 0) * 100) + '%</text></svg>';
}
function donut(data, size, thick){
  var total = data.reduce(function(a, b){ return a + b.v; }, 0) || 1;
  var s = size || 150, t = thick || 22, r = (s - t) / 2, c = s / 2, circ = 2 * Math.PI * r, off = 0;
  var out = '<svg class="chart" viewBox="0 0 ' + s + ' ' + s + '" style="width:' + s + 'px;height:' + s + 'px;flex-shrink:0">';
  out += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="var(--fill)" stroke-width="' + t + '"/>';
  data.forEach(function(d){
    var len = d.v / total * circ;
    out += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + d.c + '" stroke-width="' + t
      + '" stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2)
      + '" transform="rotate(-90 ' + c + ' ' + c + ')"><title>' + esc(d.k) + ': ' + d.v + '</title></circle>';
    off += len;
  });
  out += '<text x="' + c + '" y="' + (c - 3) + '" text-anchor="middle" style="font-size:25px;font-weight:600;fill:var(--txt);letter-spacing:-.03em">' + total + '</text>';
  out += '<text x="' + c + '" y="' + (c + 15) + '" text-anchor="middle" style="font-size:11px;fill:var(--txt3)">discos</text>';
  return out + '</svg>';
}
function columns(data, color){
  if(!data.length) return '<div class="tl-empty">Sin datos</div>';
  var W = 640, H = 190, pad = 26, bw = (W - pad * 2) / data.length;
  var max = Math.max.apply(null, data.map(function(d){ return d.v; })) || 1;
  var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 34) + '">';
  out += '<line class="axis" x1="' + pad + '" y1="' + H + '" x2="' + (W - pad) + '" y2="' + H + '"/>';
  data.forEach(function(d, i){
    var h = Math.max(3, d.v / max * (H - 26));
    var x = pad + i * bw + bw * .16, w = bw * .68, y = H - h;
    out += '<g><rect class="b" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1)
      + '" rx="4" fill="' + (color || 'var(--blue)') + '"><title>' + esc(d.k) + ': ' + d.v + '</title></rect>'
      + '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" style="font-size:10.5px;font-weight:600">' + d.v + '</text>'
      + '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H + 17) + '" text-anchor="middle">' + esc(d.k) + '</text></g>';
  });
  return out + '</svg>';
}
function hbars(data, colorFn, clickable){
  if(!data.length) return '<div class="tl-empty">Sin datos</div>';
  var max = Math.max.apply(null, data.map(function(d){ return d.v; })) || 1;
  return '<div class="hbars">' + data.map(function(d, i){
    return '<div class="hb' + (clickable ? ' click' : '') + '" data-k="' + esc(d.k) + '">'
      + '<div class="top"><span class="n">' + esc(d.k) + '</span><span class="v">' + d.v + '</span></div>'
      + '<div class="track"><span style="width:' + (d.v / max * 100).toFixed(1) + '%;background:'
      + (colorFn ? colorFn(i) : PAL[i % PAL.length]) + '"></span></div></div>';
  }).join('') + '</div>';
}
function areaLine(data, color){
  if(data.length < 2) return '<div class="tl-empty">Sin datos suficientes</div>';
  var W = 640, H = 170, pad = 30;
  var max = Math.max.apply(null, data.map(function(d){ return d.v; })) || 1;
  var stepX = (W - pad * 2) / (data.length - 1);
  var pts = data.map(function(d, i){ return [pad + i * stepX, H - (d.v / max) * (H - 30)]; });
  var path = pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var area = path + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + H + ' L' + pts[0][0].toFixed(1) + ' ' + H + ' Z';
  var c = color || 'var(--purple)';
  var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 26) + '">';
  out += '<line class="axis" x1="' + pad + '" y1="' + H + '" x2="' + (W - pad) + '" y2="' + H + '"/>';
  out += '<path d="' + area + '" fill="' + c + '" opacity=".14"/>';
  out += '<path d="' + path + '" fill="none" stroke="' + c + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  data.forEach(function(d, i){
    out += '<circle cx="' + pts[i][0].toFixed(1) + '" cy="' + pts[i][1].toFixed(1) + '" r="3.2" fill="' + c + '"><title>' + esc(d.k) + ': ' + d.v + '</title></circle>';
    if(data.length <= 14 || i % Math.ceil(data.length / 12) === 0)
      out += '<text x="' + pts[i][0].toFixed(1) + '" y="' + (H + 16) + '" text-anchor="middle">' + esc(d.k) + '</text>';
  });
  return out + '</svg>';
}
function mapaMundo(data){
  var W = 700, H = 340;
  var max = Math.max.apply(null, data.map(function(d){ return d.v; })) || 1;
  var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">';
  out += '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="14" fill="var(--fill)" opacity=".45"/>';
  for(var lon = -150; lon <= 150; lon += 30){
    var x = (lon + 180) / 360 * W;
    out += '<line x1="' + x.toFixed(1) + '" y1="8" x2="' + x.toFixed(1) + '" y2="' + (H - 8) + '" stroke="var(--sep)" stroke-width="1"/>';
  }
  for(var lat = -60; lat <= 60; lat += 30){
    var y = (90 - lat) / 180 * H;
    out += '<line x1="8" y1="' + y.toFixed(1) + '" x2="' + (W - 8) + '" y2="' + y.toFixed(1) + '" stroke="var(--sep)" stroke-width="1"/>';
  }
  data.forEach(function(d, i){
    var p = PAISES[d.k];
    if(!p) return;
    var x = (p[2] + 180) / 360 * W, y = (90 - p[1]) / 180 * H;
    var r = 7 + Math.sqrt(d.v / max) * 22;
    out += '<g class="mapdot"><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="'
      + PAL[i % PAL.length] + '" opacity=".62"/><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.4" fill="'
      + PAL[i % PAL.length] + '"/><title>' + esc(p[0]) + ': ' + d.v + '</title>'
      + '<text x="' + x.toFixed(1) + '" y="' + (y - r - 5).toFixed(1) + '" text-anchor="middle" style="font-size:10.5px;font-weight:600;fill:var(--txt)">'
      + esc(p[0]) + ' ' + d.v + '</text></g>';
  });
  return out + '</svg>';
}
function wcard(icon, k, v, s, grad){
  return '<div class="wcard" style="background:' + grad + '"><div class="bgic">' + icon + '</div>'
    + '<div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div>'
    + (s ? '<div class="s">' + esc(s) + '</div>' : '') + '</div>';
}

/* ============================================================
   12. ESTADÍSTICAS
   ============================================================ */
function paintStats(){
  var box = document.getElementById('statsBody');
  if(!box) return;
  var ds = coleccion();
  if(!ds.length){ box.innerHTML = '<div class="blank">' + I.music + '<h3>Sin datos</h3><p>Añade discos para ver tus estadísticas.</p></div>'; return; }

  var nv = ds.filter(function(d){ return d.formato === 'Vinilo'; }).length, nc = ds.length - nv;
  var artistas = tally(ds, function(d){ return d.artista; });
  var generos = tally(ds, function(d){ return d.genero || 'Sin clasificar'; });
  var sellos = tally(ds, function(d){ return d.sello; });
  var paises = tally(ds, function(d){ return d.pais; }).filter(function(p){ return PAISES[p.k]; });
  var decadas = tally(ds, function(d){ var y = parseInt(d['año']); return y ? (Math.floor(y / 10) * 10) + 's' : ''; })
    .sort(function(a, b){ return parseInt(a.k) - parseInt(b.k); });
  var compras = tally(ds, function(d){ return d.fechaCompra ? d.fechaCompra.slice(0, 4) : ''; })
    .sort(function(a, b){ return parseInt(a.k) - parseInt(b.k); });
  var gasto = ds.reduce(function(a, d){ return a + (Number(d.precioCompra) || 0); }, 0);
  var temas = ds.reduce(function(a, d){ return a + d.tracklist.length; }, 0);
  var years = ds.map(function(d){ return parseInt(d['año']); }).filter(function(y){ return y > 1900; });
  var medio = years.length ? Math.round(years.reduce(function(a, b){ return a + b; }, 0) / years.length) : '—';
  var masAntiguo = ds.filter(function(d){ return parseInt(d['año']) > 1900; })
    .sort(function(a, b){ return parseInt(a['año']) - parseInt(b['año']); })[0];
  var masEscuchado = ds.slice().sort(function(a, b){ return (b.escuchas || 0) - (a.escuchas || 0); })[0];
  var decaTop = decadas.slice().sort(function(a, b){ return b.v - a.v; })[0];
  var prestados = ds.filter(function(d){ return d.prestadoA; });

  var porAnio = {}, porMesAct = {}, totalEsc = 0, anioAct = String(new Date().getFullYear());
  ds.forEach(function(d){
    (d.escuchasFechas || []).forEach(function(f){
      var a = String(f).slice(0, 4);
      porAnio[a] = (porAnio[a] || 0) + 1;
      totalEsc++;
      if(a === anioAct){
        var m = String(f).slice(5, 7);
        porMesAct[m] = (porMesAct[m] || 0) + 1;
      }
    });
  });
  var escAnios = Object.keys(porAnio).sort().map(function(a){ return {k:a, v:porAnio[a]}; });
  var MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var escMeses = MESES.map(function(nm, i){ var mm = ('0' + (i + 1)).slice(-2); return {k:nm, v:porMesAct[mm] || 0}; });
  var masPuestos = ds.filter(function(d){ return totalEscuchas(d) > 0; })
    .sort(function(a, b){ return totalEscuchas(b) - totalEscuchas(a); }).slice(0, 12);
  var nunca = ds.filter(function(d){ return totalEscuchas(d) === 0; }).length;

  var crec = [], acc = 0, porMes = {};
  ds.forEach(function(d){ var m = (d.fechaAlta || '').slice(0, 7); if(m) porMes[m] = (porMes[m] || 0) + 1; });
  Object.keys(porMes).sort().forEach(function(m){ acc += porMes[m]; crec.push({k:m.slice(2).replace('-', '/'), v:acc}); });

  var valorados = ds.filter(function(d){ return d.valoracion; });
  var notaMedia = valorados.length ? (valorados.reduce(function(a, d){ return a + d.valoracion; }, 0) / valorados.length) : 0;
  var porNota = [5,4,3,2,1].map(function(n){ return {k:n + '★', v: ds.filter(function(d){ return d.valoracion === n; }).length}; });
  var favoritos = ds.filter(function(d){ return d.valoracion >= 4; })
    .sort(function(a, b){ return b.valoracion - a.valoracion || totalEscuchas(b) - totalEscuchas(a); }).slice(0, 12);
  var duraciones = ds.map(function(d){
    var seg = 0;
    d.tracklist.forEach(function(t){ var m = String(t.duracion || '').match(/^(\d+):(\d{2})$/); if(m) seg += (+m[1]) * 60 + (+m[2]); });
    return {d:d, seg:seg};
  }).filter(function(x){ return x.seg > 0; }).sort(function(a, b){ return b.seg - a.seg; });
  var horas = duraciones.reduce(function(a, x){ return a + x.seg; }, 0) / 3600;
  var porLetra = {};
  ds.forEach(function(d){
    var L = (d.artista || '#').replace(/^(el|la|los|las|the|a|an)\s+/i, '').trim()[0];
    L = L ? L.toUpperCase() : '#';
    if(!/[A-Z]/.test(L)) L = '#';
    porLetra[L] = (porLetra[L] || 0) + 1;
  });
  var letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').map(function(L){ return {k:L, v:porLetra[L] || 0}; });

  box.innerHTML =
    '<div id="curiosidad"></div>'
    + '<div class="wrapped" style="margin-bottom:18px">'
    + wcard(I.user, 'Artista más repetido', artistas[0] ? artistas[0].k : '—', artistas[0] ? artistas[0].v + ' discos' : '', 'linear-gradient(135deg,#ff2d55,#af52de)')
    + wcard(I.cal, 'Tu década', decaTop ? decaTop.k : '—', decaTop ? decaTop.v + ' discos de esa época' : '', 'linear-gradient(135deg,#0071e3,#30b0c7)')
    + wcard(I.disc, 'El más antiguo', masAntiguo ? masAntiguo['año'] : '—', masAntiguo ? masAntiguo.artista + ' · ' + masAntiguo.titulo : '', 'linear-gradient(135deg,#ff9500,#ffcc00)')
    + wcard(I.music, 'Canciones', temas, 'en ' + ds.length + ' discos', 'linear-gradient(135deg,#34c759,#00c7be)')
    + (masEscuchado && totalEscuchas(masEscuchado) ? wcard(I.playF, 'Más escuchado', masEscuchado.titulo, totalEscuchas(masEscuchado) + ' veces', 'linear-gradient(135deg,#5856d6,#0a84ff)') : '')
    + (totalEsc ? wcard(I.oreja, 'Escuchas registradas', totalEsc, (ds.length - nunca) + ' discos distintos', 'linear-gradient(135deg,#00c7be,#0071e3)') : '')
    + (gasto ? wcard(I.euro, 'Invertido', gasto.toFixed(0) + ' €', 'media de ' + (gasto / ds.length).toFixed(1) + ' € por disco', 'linear-gradient(135deg,#8e8e93,#48484a)') : '')
    + (horas > 1 ? wcard(I.clock, 'Música en casa', Math.round(horas) + ' h', 'seguidas, sin repetir disco', 'linear-gradient(135deg,#ff9500,#ff2d55)') : '')
    + (valorados.length ? wcard(I.estrella, 'Nota media', notaMedia.toFixed(1) + ' ★', valorados.length + ' discos valorados', 'linear-gradient(135deg,#ffb400,#ff7a00)') : '')
    + '</div>'
    + '<div class="kpis">'
    + kpi(I.layers, 'Discos', ds.length, 1, 'var(--blue)')
    + kpi(I.user, 'Artistas', artistas.length, Math.min(1, artistas.length / ds.length), 'var(--pink)')
    + kpi(I.music, 'Géneros', generos.length, Math.min(1, generos.length / GENEROS.length), 'var(--purple)')
    + kpi(I.globe, 'Países', paises.length, Math.min(1, paises.length / 20), 'var(--teal)')
    + kpi(I.cal, 'Año medio', medio, .7, 'var(--orange)')
    + kpi(I.hand, 'Prestados', prestados.length, prestados.length / ds.length, 'var(--indigo)')
    + '</div>'
    + (totalEsc
      ? '<div class="cards" style="margin-bottom:16px">'
        + '<div class="card full"><h3>Escuchas por año</h3><div class="sub">' + totalEsc
          + ' escuchas registradas · una por disco y día</div><div class="chartwrap">'
          + columns(escAnios, 'var(--green)') + '</div></div>'
        + '<div class="card full"><h3>' + anioAct + ' mes a mes</h3><div class="sub">Cómo va el año en curso</div>'
          + '<div class="chartwrap">' + columns(escMeses, 'var(--teal)') + '</div></div>'
        + '<div class="card"><h3>Los que más pones</h3><div class="sub">Pulsa para abrir la ficha</div><div id="topEsc">'
          + '<div class="tl">' + masPuestos.map(function(d){
              return '<div class="trk" data-disco="' + d.id + '" style="cursor:pointer">'
                + '<span class="num">' + totalEscuchas(d) + '</span>'
                + '<span class="nm">' + esc(d.titulo) + '<span style="color:var(--txt3)"> · ' + esc(d.artista) + '</span></span>'
                + '<span class="dur">' + fechaBonita(d.ultimaEscucha) + '</span></div>';
            }).join('') + '</div></div>'
        + '<div class="card"><h3>Aún sin estrenar</h3><div class="sub">Discos que no has marcado nunca</div>'
          + '<div style="display:flex;align-items:center;gap:16px"><div style="font-size:44px;font-weight:700;letter-spacing:-.04em">'
          + nunca + '</div><div style="font-size:13.5px;color:var(--txt2);line-height:1.45">de ' + ds.length
          + ' discos.<br>' + Math.round((ds.length - nunca) / ds.length * 100) + '% de la colección estrenada.</div></div>'
          + '<button class="btn sm" id="verNunca" style="margin-top:14px">Ver los que faltan</button></div>'
        + '</div>'
      : '<div class="banner" style="border-left-color:var(--green)"><div><div class="t">Aún no has registrado ninguna escucha</div>'
        + '<div class="s">Pulsa el ▶ de cualquier portada, o «He escuchado» dentro de la ficha, y aquí verás tu año</div></div></div>')
    + '<div class="cards">'
      + '<div class="card"><h3>Soportes</h3><div class="sub">Vinilo frente a CD</div><div class="ringwrap">'
        + donut([{k:'Vinilo', v:nv, c:'#af52de'}, {k:'CD', v:nc, c:'#30b0c7'}], 158, 22)
        + '<div class="legend" style="flex-direction:column;align-items:flex-start;margin:0">'
        + '<div class="lg"><i style="background:#af52de"></i>Vinilo <b>' + nv + '</b> · ' + Math.round(nv / ds.length * 100) + '%</div>'
        + '<div class="lg"><i style="background:#30b0c7"></i>CD <b>' + nc + '</b> · ' + Math.round(nc / ds.length * 100) + '%</div>'
        + '</div></div></div>'
      + '<div class="card"><h3>Géneros</h3><div class="sub">Pulsa para filtrar</div><div class="ringwrap">'
        + donut(generos.slice(0, 9).map(function(g, i){ return {k:g.k, v:g.v, c:PAL[i % PAL.length]}; }), 158, 22)
        + '<div class="legend" id="lgGen" style="flex-direction:column;align-items:flex-start;margin:0;max-height:172px;overflow:auto">'
        + generos.slice(0, 9).map(function(g, i){
            return '<div class="lg" data-gen="' + esc(g.k) + '" style="cursor:pointer"><i style="background:' + PAL[i % PAL.length] + '"></i>'
              + esc(g.k) + ' <b>' + g.v + '</b></div>';
          }).join('')
        + '</div></div></div>'
      + '<div class="card full"><h3>Por década de edición</h3><div class="sub">Cuándo se publicaron tus discos</div><div class="chartwrap">'
        + columns(decadas, 'var(--blue)') + '</div></div>'
      + (paises.length ? '<div class="card full"><h3>Mapa de ediciones</h3><div class="sub">De dónde viene cada prensado</div>'
        + '<div class="worldmap">' + mapaMundo(paises.slice(0, 14)) + '</div></div>' : '')
      + '<div class="card"><h3>Top artistas</h3><div class="sub">Pulsa para ver sus discos</div><div id="topArt">'
        + hbars(artistas.slice(0, 12), null, true) + '</div></div>'
      + '<div class="card"><h3>Top sellos</h3><div class="sub">Pulsa para filtrar</div><div id="topSel">'
        + hbars(sellos.slice(0, 12), function(i){ return PAL[(i + 3) % PAL.length]; }, true) + '</div></div>'
      + (crec.length > 2 ? '<div class="card full"><h3>Crecimiento de la colección</h3><div class="sub">Discos acumulados según su fecha de alta</div>'
        + '<div class="chartwrap">' + areaLine(crec, 'var(--purple)') + '</div></div>' : '')
      + (compras.length > 1 ? '<div class="card full"><h3>Compras por año</h3><div class="sub">Según la fecha de compra registrada</div>'
        + '<div class="chartwrap">' + areaLine(compras, 'var(--green)') + '</div></div>' : '')
      + '<div class="card"><h3>Calidad de las fichas</h3><div class="sub">Qué datos tienes completos</div>'
        + hbars([
            {k:'Con portada', v: ds.filter(function(d){ return !!d.portada; }).length},
            {k:'Con tracklist', v: ds.filter(function(d){ return d.tracklist.length > 0; }).length},
            {k:'Con género', v: ds.filter(function(d){ return !!d.genero; }).length},
            {k:'Con año', v: ds.filter(function(d){ return !!d['año']; }).length},
            {k:'Con sello', v: ds.filter(function(d){ return !!d.sello; }).length}
          ], function(i){ return ['#34c759','#0071e3','#af52de','#ff9500','#30b0c7'][i]; }) + '</div>'
      + (valorados.length ? '<div class="card"><h3>Cómo puntúas</h3><div class="sub">Reparto de tus estrellas</div>'
        + hbars(porNota, function(i){ return ['#ffb400','#ffc93a','#c8c8cc','#a1a1a6','#c7c7cc'][i]; }) + '</div>' : '')
      + (favoritos.length ? '<div class="card"><h3>Tus favoritos</h3><div class="sub">Cuatro estrellas o más</div><div class="tl">'
        + favoritos.map(function(d){
            return '<div class="trk" data-disco="' + d.id + '" style="cursor:pointer"><span class="nm">' + esc(d.titulo)
              + '<span style="color:var(--txt3)"> · ' + esc(d.artista) + '</span></span>'
              + '<span>' + estrellasHtml(d.valoracion) + '</span></div>';
          }).join('') + '</div></div>' : '')
      + (duraciones.length > 3 ? '<div class="card"><h3>Los más largos</h3><div class="sub">Por duración total del disco</div><div class="tl">'
        + duraciones.slice(0, 6).map(function(x){
            return '<div class="trk" data-disco="' + x.d.id + '" style="cursor:pointer"><span class="nm">' + esc(x.d.titulo)
              + '<span style="color:var(--txt3)"> · ' + esc(x.d.artista) + '</span></span>'
              + '<span class="dur">' + Math.floor(x.seg / 60) + ' min</span></div>';
          }).join('') + '</div></div>' : '')
      + '<div class="card full"><h3>Tu estantería por letra</h3><div class="sub">Cómo se reparte el alfabeto</div>'
        + '<div class="chartwrap">' + columns(letras, 'var(--indigo)') + '</div></div>'
      + (prestados.length ? '<div class="card"><h3>Prestados ahora</h3><div class="sub">Quién tiene qué</div><div class="tl">'
        + prestados.map(function(d){
            return '<div class="trk"><span class="nm">' + esc(d.titulo) + '</span><span class="dur">' + esc(d.prestadoA) + '</span></div>';
          }).join('') + '</div></div>' : '')
    + '</div>';

  box.querySelectorAll('#topArt .hb').forEach(function(el){
    el.onclick = function(){ fArt = el.dataset.k; grupo = 'none'; document.getElementById('selGroup').value = 'none'; setView('col'); paintCol(); };
  });
  box.querySelectorAll('#topSel .hb').forEach(function(el){
    el.onclick = function(){ fSello = el.dataset.k; setView('col'); paintCol(); };
  });
  pintaCuriosidad(box.querySelector('#curiosidad'));
  box.querySelectorAll('[data-disco]').forEach(function(el){
    el.onclick = function(){ openDetail(el.dataset.disco); };
  });
  var vn = box.querySelector('#verNunca');
  if(vn) vn.onclick = function(){
    fType = 'noesc';
    document.querySelectorAll('#segType button').forEach(function(x){ x.className = x.dataset.f === 'noesc' ? 'on' : ''; });
    setView('col'); paintCol();
  };
  box.querySelectorAll('[data-gen]').forEach(function(el){
    el.onclick = function(){ fGen = el.dataset.gen; setView('col'); paintCol(); };
  });
}

/* ============================================================
   13. ARCHIVO Y SINCRONIZACIÓN
   ============================================================ */
function paintDb(){
  var box = document.getElementById('dbBody');
  if(!box) return;
  var estados = {
    local:['Solo en este dispositivo', 'var(--orange)'], ok:['Sincronizada', 'var(--green)'],
    pend:['Cambios sin subir', 'var(--orange)'], busy:['Sincronizando', 'var(--blue)'],
    err:['Error', 'var(--red)'], off:['Sin conexión', 'var(--txt3)']
  };
  var est = estados[syncState] || estados.local;
  var pesoDatos = new Blob([JSON.stringify(DB.discos)]).size;

  box.innerHTML =
    (configurado()
      ? '<div class="tipbox"><b>Tu colección vive en GitHub.</b> Se guarda en <b>' + esc(CFG.owner + '/' + CFG.repo) + ' › ' + esc(CFG.path)
        + '</b>. Cada dispositivo la baja al abrir y sube lo que cambies, fusionando por la fecha de cada ficha: '
        + 'puedes editar en el Mac y escanear en el iPhone sin que se pisen los cambios.</div>'
      : '<div class="tipbox"><b>Todavía sin sincronizar.</b> Ahora mismo la colección solo está en este dispositivo. '
        + 'Conéctala a tu repositorio de GitHub y la tendrás igual en el Mac y en el iPhone.</div>')
    + '<div class="dbgrid">'
    + kpi(I.db, 'Discos', DB.discos.length, 1, 'var(--blue)')
    + kpi(I.cloud, 'Estado', est[0], syncState === 'ok' ? 1 : .5, est[1])
    + kpi(I.clock, 'Última sincronía', lastSync ? fhora(lastSync) : '—', lastSync ? 1 : 0, 'var(--purple)')
    + kpi(I.layers, 'Tamaño', bytes(pesoDatos), .6, 'var(--teal)')
    + '</div>'
    + '<div style="font-size:13px;color:var(--txt2);margin:-4px 0 16px 3px">Último cambio: <b style="color:var(--txt)">' + fdate(DB.actualizado) + '</b>'
    + (syncMsg ? ' · <b style="color:var(--red)">' + esc(syncMsg) + '</b>' : '') + '</div>'
    + '<div class="dbact">'
      + accion(I.cloud, 'Sincronización', configurado()
          ? 'Conectada a ' + esc(CFG.owner + '/' + CFG.repo) + '. Puedes cambiar el repositorio o desconectar este dispositivo.'
          : 'Conecta la app con tu repositorio de GitHub para compartir la colección entre todos tus dispositivos.',
          'cfg', configurado() ? '' : 'pri', configurado() ? 'Ajustes' : 'Configurar ahora')
      + accion(I.refresh, 'Sincronizar ahora', 'Baja los cambios de otros dispositivos y sube los tuyos. Se hace solo, pero puedes forzarlo.', 'sync', '', 'Sincronizar')
      + accion(I.down, 'Copia de seguridad', 'Guarda un JSON con toda la colección. En el iPhone se abre la hoja de compartir.', 'bak', '', 'Descargar copia')
      + accion(I.up, 'Restaurar copia', 'Fusiona un JSON exportado antes. Nunca borra lo que ya tienes.', 'impbak', '', 'Seleccionar JSON')
      + accion(I.down, 'Importar CSV de Discogs', 'Añade solo lo que falte: los repetidos exactos se descartan y los dudosos te los pregunto.', 'csv', '', 'Seleccionar CSV')
      + accion(I.file, 'Exportar CSV', 'Genera un CSV con las columnas de Discogs más tus campos propios.', 'expcsv', '', 'Exportar CSV')
      + accion(I.print, 'Catálogo imprimible', 'Catálogo con portadas agrupado por artista, listo para imprimir o guardar en PDF.', 'print', '', 'Generar catálogo')
      + accion(I.spark, 'Completar fichas', 'Busca carátula, tracklist, sello y género de todo lo que esté incompleto.', 'bulk', '', 'Completar todo')
    + '</div>'
    + '<div class="card" style="margin-top:16px"><h3>Instalarla en el iPhone</h3>'
    + '<div class="sub">Para tenerla con su icono, a pantalla completa y siempre a mano</div>'
    + '<div style="font-size:13.5px;line-height:1.6;color:var(--txt2)">Abre esta misma dirección en Chrome en el iPhone, '
    + 'pulsa el botón de compartir y elige <b style="color:var(--txt)">Añadir a pantalla de inicio</b>. '
    + 'La primera vez, entra en Sincronización y pega el mismo token que usas en el Mac.</div></div>'
    + '<div class="card" style="margin-top:16px"><h3>Vaciar colección</h3>'
    + '<div class="sub">Elimina todos los discos. Si estás sincronizado, el borrado se propagará al resto de dispositivos.</div>'
    + '<button class="btn destr" id="wipe">' + I.trash + 'Vaciar colección</button></div>';

  var on = function(a, fn){ var el = box.querySelector('[data-a=' + a + ']'); if(el) el.onclick = fn; };
  on('cfg', pantallaSync);
  on('sync', function(){ sincronizarAhora(); toast('Sincronizando…'); });
  on('bak', exportBackup);
  on('impbak', function(){ document.getElementById('fileBak').click(); });
  on('csv', function(){ document.getElementById('fileCsv').click(); });
  on('expcsv', exportarCsv);
  on('print', catalogoImprimible);
  on('bulk', function(){ setView('col'); bulkRun(); });
  box.querySelector('#wipe').onclick = function(){
    if(confirm('¿Eliminar los ' + DB.discos.length + ' discos?')){
      DB.discos = []; persist(); toast('Colección vaciada');
    }
  };
}

/* ============================================================
   14. EVENTOS
   ============================================================ */
function montarEventos(){
  var byId = function(id){ return document.getElementById(id); };
  byId('btnAdd').onclick = function(){ openForm(null); };
  byId('btnAddMob').onclick = function(){ openForm(null); };
  byId('qClear').onclick = function(){
    byId('q').value = '';
    byId('searchw').classList.remove('lleno');
    paintCol();
  };
  byId('btnPal').onclick = abrirPaleta;
  byId('btnDice').onclick = discoAlAzar;
  byId('btnScan').onclick = escanear;
  byId('fabScan').onclick = escanear;
  byId('logo').onclick = function(){ setView('col'); };
  byId('syncBadge').onclick = function(){ configurado() ? sincronizarAhora() : pantallaSync(); };
  byId('q').oninput = function(){
    byId('searchw').classList.toggle('lleno', !!byId('q').value);
    paintCol();
  };
  byId('sortBy').onchange = function(e){
    sortBy = e.target.value;
    if(sortBy === 'random') randomSeed = Date.now() % 99991;
    paintCol();
  };
  byId('selGroup').onchange = function(e){ grupo = e.target.value; paintCol(); };
  byId('fGenre').onchange = function(e){ fGen = e.target.value; paintCol(); };
  byId('segType').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#segType button').forEach(function(x){ x.className = ''; });
    b.className = 'on'; fType = b.dataset.f; paintCol();
  };
  byId('segMode').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#segMode button').forEach(function(x){ x.className = ''; });
    b.className = 'on'; modo = b.dataset.m; paintCol();
  };
  var tabClick = function(e){
    var b = e.target.closest('button[data-v]');
    if(b) setView(b.dataset.v);
  };
  byId('tabs').onclick = tabClick;
  byId('tabbar').onclick = tabClick;
  byId('fileCsv').onchange = function(e){ var f = e.target.files[0]; if(f) importCsv(f); e.target.value = ''; };
  byId('fileBak').onchange = function(e){ var f = e.target.files[0]; if(f) importBackup(f); e.target.value = ''; };

  var nav = byId('nav'), ultimoY = 0;
  window.addEventListener('scroll', function(){
    var y = window.scrollY || 0;
    if((y > 40) !== (ultimoY > 40)) nav.classList.toggle('shrink', y > 40);
    ultimoY = y;
  }, {passive:true});

  (function(){
    var ptr = byId('ptr'), y0 = null, dy = 0, tirando = false;
    document.addEventListener('touchstart', function(e){
      if(window.scrollY > 0 || document.querySelector('.scrim,.pal')) return;
      y0 = e.touches[0].clientY; dy = 0; tirando = true;
    }, {passive:true});
    document.addEventListener('touchmove', function(e){
      if(!tirando || y0 === null) return;
      dy = e.touches[0].clientY - y0;
      if(dy <= 0){ ptr.style.opacity = 0; return; }
      var p = Math.min(1, dy / 90);
      ptr.style.opacity = p;
      ptr.style.transform = 'translateX(-50%) scale(' + (.5 + p * .5) + ') rotate(' + (dy * 2.2) + 'deg)';
    }, {passive:true});
    document.addEventListener('touchend', function(){
      if(!tirando) return;
      tirando = false;
      if(dy > 85){
        ptr.classList.add('girando');
        ptr.style.opacity = 1;
        ptr.style.transform = 'translateX(-50%) scale(1)';
        var fin = function(){
          ptr.classList.remove('girando');
          ptr.style.opacity = 0;
          ptr.style.transform = 'translateX(-50%) scale(.5)';
        };
        if(configurado()) pull().then(fin, fin);
        else setTimeout(function(){ renderAll(); fin(); }, 450);
      }else{
        ptr.style.opacity = 0;
        ptr.style.transform = 'translateX(-50%) scale(.5)';
      }
      y0 = null; dy = 0;
    });
  })();

  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && configurado() && Date.now() - ultimoPull > 20000) pull(true);
  });
  window.addEventListener('online', function(){ if(configurado()) sincronizarAhora(); });
  window.addEventListener('offline', function(){ marcar('off'); });
  window.addEventListener('beforeunload', function(e){
    if(syncState === 'pend' && configurado()){ e.preventDefault(); e.returnValue = ''; }
  });
  setInterval(function(){
    if(configurado() && !document.hidden && navigator.onLine && Date.now() - ultimoPull > 300000) pull(true);
  }, 60000);

  document.addEventListener('keydown', function(e){
    var enCampo = /input|textarea|select/i.test((e.target.tagName || ''));
    if((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); sincronizarAhora(); return; }
    if((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); abrirPaleta(); return; }
    if(enCampo || document.querySelector('.scrim') || document.querySelector('.pal')) return;
    if(e.key === '/'){ e.preventDefault(); document.getElementById('q').focus(); }
    else if(e.key === 'n'){ e.preventDefault(); openForm(null); }
    else if(e.key === 'r'){ e.preventDefault(); discoAlAzar(); }
    else if(e.key === '1'){ setView('col'); }
    else if(e.key === '2'){ setView('wish'); }
    else if(e.key === '3'){ setView('stats'); }
    else if(e.key === '4'){ setView('db'); }
  });
  document.body.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.body.addEventListener('drop', function(e){
    e.preventDefault();
    var f = e.dataTransfer.files[0];
    if(!f) return;
    if(/\.csv$/i.test(f.name)) importCsv(f);
    else if(/\.json$/i.test(f.name)) importBackup(f);
  });
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    var recargado = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(recargado) return;
      recargado = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.waiting) reg.waiting.postMessage('saltar');
      reg.addEventListener('updatefound', function(){
        var nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener('statechange', function(){
          if(nuevo.state === 'installed' && navigator.serviceWorker.controller) nuevo.postMessage('saltar');
        });
      });
      setInterval(function(){ reg.update().catch(function(){}); }, 900000);
    }).catch(function(){});
  }
}

boot();


</script>
</body>
</html>
