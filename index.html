  box.querySelectorAll('[data-pais]').forEach(function(el){
    el.onclick = function(){ verPais(el.dataset.pais); };
  });
  box.querySelectorAll('[data-disco]').forEach(function(el){
    el.onclick = function(){ openDetail(el.dataset.disco); };
  });
  var vc = box.querySelector('#verCal');
  if(vc) vc.onclick = function(){ calendarioEscuchas('anio'); };
  var mini = box.querySelector('#calMini');
  if(mini){
    var pd = {};
    ds.forEach(function(d){ (d.escuchasFechas || []).forEach(function(f){ if(f.slice(0, 4) === anioAct) pd[f] = (pd[f] || 0) + 1; }); });
    var mx = Math.max.apply(null, Object.keys(pd).map(function(k){ return pd[k]; }).concat([1]));
    var celdas = '';
    var ini = new Date(+anioAct, 0, 1), fin = new Date(+anioAct, 11, 31);
    for(var t = ini.getTime(); t <= fin.getTime(); t += 86400000){
      var f = new Date(t);
      var iso = f.getFullYear() + '-' + ('0' + (f.getMonth() + 1)).slice(-2) + '-' + ('0' + f.getDate()).slice(-2);
      var n = pd[iso] || 0;
      celdas += '<i class="c n' + (n ? Math.min(4, Math.ceil(n / mx * 4)) : 0) + '"></i>';
    }
    mini.innerHTML = '<div style="display:grid;grid-template-columns:repeat(28,1fr);gap:2px">' + celdas + '</div>';
  }
  var vn = box.querySelector('#verNunca');
  if(vn) vn.onclick = function(){
    fType = 'noesc';
    document.querySelectorAll('#segType button').forEach(function(x){ x.className = x.dataset.f === 'noesc' ? 'on' : ''; });
    setView('col'); paintCol();
  };
  box.querySelectorAll('[data-gen]').forEach(function(el){
    el.onclick = function(){ fGen = el.dataset.gen; setView('col'); paintCol(); };
  });
}

/* ============================================================
   13. ARCHIVO Y SINCRONIZACIÓN
   ============================================================ */
function paintDb(){
  var box = document.getElementById('dbBody');
  if(!box) return;
  var estados = {
    local:['Sin conectar', 'var(--orange)'], ok:['Al día', 'var(--green)'],
    pend:['Cambios sin subir', 'var(--orange)'], busy:['Sincronizando', 'var(--blue)'],
    err:['Error', 'var(--red)'], off:['Sin conexión', 'var(--txt3)']
  };
  var est = estados[syncState] || estados.local;
  var pesoDatos = new Blob([JSON.stringify(DB.discos)]).size;
  var instalada = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  var ultimaCopia = (DB.historial || []).filter(function(x){ return /copia/i.test(x.tipo); }).pop();
  var diasCopia = ultimaCopia ? Math.floor((Date.now() - new Date(ultimaCopia.fecha).getTime()) / 86400000) : null;
  var tema = temaActual();

  var seccion = function(icono, titulo, sub){
    return '<div class="secc"><div class="si">' + icono + '</div><div><h3>' + titulo + '</h3>'
      + (sub ? '<div class="ss">' + sub + '</div>' : '') + '</div></div>';
  };

  box.innerHTML =
    /* ---- estado ---- */
    '<div class="estado ' + syncState + '">'
      + '<div class="ehd"><div class="epunto"></div><div class="etxt">'
      + '<div class="et">' + est[0] + '</div>'
      + '<div class="es">' + (configurado()
          ? esc(CFG.owner + '/' + CFG.repo) + ' › ' + esc(CFG.path)
          : 'La colección solo está en este dispositivo, en modo consulta') + '</div>'
      + '</div>' + (configurado()
          ? '<button class="btn sm" data-a="sync">' + I.refresh + 'Sincronizar</button>'
          : '<button class="btn pri sm" data-a="cfg">Conectar</button>') + '</div>'
      + '<div class="efilas">'
        + '<div><span>Discos</span><b>' + DB.discos.length + '</b></div>'
        + '<div><span>Última sincronía</span><b>' + (lastSync ? fdate(lastSync) : '—') + '</b></div>'
        + '<div><span>Último cambio</span><b>' + fdate(DB.actualizado) + '</b></div>'
        + '<div><span>Tamaño</span><b>' + bytes(pesoDatos) + '</b></div>'
      + '</div>'
      + (syncMsg ? '<div class="emsg">' + esc(syncMsg) + '</div>' : '')
      + (configurado() ? '<div class="epie"><a href="https://github.com/' + esc(CFG.owner) + '/' + esc(CFG.repo)
          + '/commits/' + esc(CFG.branch) + '/' + esc(CFG.path) + '" target="_blank" rel="noopener">'
          + I.clock + 'Ver el historial de cambios en GitHub</a>'
          + '<button class="lnk ext" data-a="cfg">' + I.key + 'Ajustes de sincronización</button></div>' : '')
    + '</div>'

    /* ---- apariencia ---- */
    + seccion(I.eye, 'Apariencia')
    + '<div class="card"><div class="fila"><div><div class="ft">Tema</div>'
      + '<div class="fs">Automático sigue lo que tengas puesto en el sistema</div></div>'
      + '<div class="seg" id="segTema">'
        + ['claro:Claro', 'oscuro:Oscuro', 'auto:Automático'].map(function(o){
            var q = o.split(':');
            return '<button data-t="' + q[0] + '"' + (tema === q[0] ? ' class="on"' : '') + '>' + q[1] + '</button>';
          }).join('')
      + '</div></div></div>'

    /* ---- copias ---- */
    + seccion(I.save, 'Copias de seguridad', diasCopia === null
        ? 'Aún no has descargado ninguna copia'
        : (diasCopia === 0 ? 'Última copia: hoy' : 'Última copia hace ' + diasCopia + (diasCopia === 1 ? ' día' : ' días')))
    + (diasCopia !== null && diasCopia > 30
        ? '<div class="warnb">' + I.warn + '<span>Hace más de un mes que no descargas una copia. '
          + 'Tus datos están en GitHub con su historial, pero una copia local no está de más.</span></div>' : '')
    + '<div class="dbact">'
      + accion(I.down, 'Descargar copia', 'Un JSON con toda la colección. En el iPhone se abre la hoja de compartir.', 'bak', '', 'Descargar')
      + accion(I.up, 'Restaurar copia', 'Fusiona un JSON exportado antes. Nunca borra lo que ya tienes.', 'impbak', '', 'Seleccionar JSON')
    + '</div>'

    /* ---- importar y exportar ---- */
    + seccion(I.layers, 'Importar y exportar')
    + '<div class="dbact">'
      + accion(I.down, 'Importar CSV de Discogs', 'Añade solo lo que falte: los repetidos se descartan y los dudosos te los pregunto.', 'csv', '', 'Seleccionar CSV')
      + accion(I.file, 'Exportar CSV', 'Con las columnas de Discogs más tus campos propios.', 'expcsv', '', 'Exportar')
    + '</div>'

    /* ---- herramientas ---- */
    + seccion(I.spark, 'Herramientas')
    + '<div class="dbact">'
      + accion(I.refresh, 'Revisar y actualizar todo', 'Recorre los ' + DB.discos.length
          + ' discos y rellena lo que falte: caras del tracklist, créditos, foto del disco, Apple Music. No pisa nada tuyo.', 'revisar', 'pri', 'Revisar')
      + accion(I.warn, 'Reparar la base de datos', 'Busca variantes del mismo artista, sellos sucios y años imposibles.', 'reparar', '', 'Analizar')
      + (hayDiscogs() ? accion(I.down, 'Traer de Discogs', 'Añade los discos que tengas allí y aquí no.', 'dgcol', '', 'Consultar') : '')
      + (configurado() ? accion(I.clock, 'Máquina del tiempo', 'Mira cómo era tu colección en cualquier fecha pasada.', 'maquina', '', 'Viajar') : '')
      + accion(I.spark, 'Completar fichas', 'Busca carátula, tracklist, sello y género de lo que esté incompleto.', 'bulk', '', 'Completar')
      + accion(I.copy, 'Buscar repetidos', 'Revisa si hay fichas duplicadas del mismo disco y te deja fusionarlas.', 'dups', '', 'Revisar')
    + '</div>'

    /* ---- instalación ---- */
    + (instalada ? '' : seccion(I.cloud, 'Instalar en el iPhone')
      + '<div class="card"><div style="font-size:13.5px;line-height:1.6;color:var(--txt2)">'
      + 'Abre esta misma dirección en el iPhone, pulsa compartir y elige '
      + '<b style="color:var(--txt)">Añadir a pantalla de inicio</b>. La primera vez, entra en Sincronización '
      + 'y pega el mismo token que usas aquí.</div></div>')

    /* ---- zona delicada ---- */
    + '<details class="plega peligro" style="margin-top:24px"><summary>Zona delicada'
      + '<svg class="ic ch" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></summary>'
      + '<div class="cuerpo" style="padding:16px">'
      + '<div class="fila"><div><div class="ft">Desconectar este dispositivo</div>'
        + '<div class="fs">La colección se queda solo aquí y pasa a modo consulta.</div></div>'
        + '<button class="btn sm" data-a="cfg">Ajustes</button></div>'
      + '<div class="fila"><div><div class="ft" style="color:var(--red)">Vaciar la colección</div>'
        + '<div class="fs">Elimina los ' + DB.discos.length + ' discos. Si estás sincronizado, se propaga al resto de dispositivos.</div></div>'
        + '<button class="btn destr sm" id="wipe">' + I.trash + 'Vaciar</button></div>'
      + '</div></details>'
    + (function(){
        var faltan = DB.discos.filter(function(d){ return d.faltan; });
        if(!faltan.length) return '';
        var motivos = {};
        faltan.forEach(function(d){
          String(d.faltan).split(', ').forEach(function(m){ motivos[m] = (motivos[m] || 0) + 1; });
        });
        return '<details class="plega" style="margin-top:20px"><summary>Lo que no se pudo completar'
          + '<svg class="ic ch" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></summary>'
          + '<div class="cuerpo">'
          + Object.keys(motivos).sort(function(a, b){ return motivos[b] - motivos[a]; }).map(function(k){
              return '<div class="cred"><span class="k">Sin ' + esc(k) + '</span><span class="v">'
                + motivos[k] + ' discos</span></div>';
            }).join('')
          + '<div class="cred"><span class="k" style="color:var(--txt3)">Se reintentan solos pasados 45 días</span>'
          + '<span class="v"></span></div></div></details>';
      })()
    + '<div class="pie-version">Discoteca · versión ' + VERSION + (instalada ? ' · instalada' : '') + '</div>';

  var on = function(a, fn){
    box.querySelectorAll('[data-a=' + a + ']').forEach(function(el){ el.onclick = fn; });
  };
  on('cfg', pantallaSync);
  on('sync', function(){ sincronizarAhora(); toast('Sincronizando…'); });
  on('bak', exportBackup);
  on('impbak', function(){ document.getElementById('fileBak').click(); });
  on('csv', function(){ document.getElementById('fileCsv').click(); });
  on('expcsv', exportarCsv);
  on('print', catalogoImprimible);
  on('inv', inventarioUbicaciones);
  on('valor', valorColeccion);
  on('bulk', function(){ setView('col'); bulkRun(); });
  on('revisar', pantallaRevision);
  on('reparar', pantallaReparar);
  on('dgcol', pantallaDiscogs);
  on('maquina', maquinaDelTiempo);
  on('dups', function(){
    var dups = dupSet();
    var n = Object.keys(dups).length;
    if(!n){ toast('No hay fichas repetidas'); return; }
    fType = 'dup';
    document.querySelectorAll('#segType button').forEach(function(x){ x.className = x.dataset.f === 'dup' ? 'on' : ''; });
    setView('col'); paintCol();
    toast(n + ' fichas repetidas · ábrelas para fusionarlas');
  });
  box.querySelectorAll('#segTema button').forEach(function(b){
    b.onclick = function(){
      aplicarTema(b.dataset.t);
      box.querySelectorAll('#segTema button').forEach(function(x){ x.className = x.dataset.t === b.dataset.t ? 'on' : ''; });
    };
  });
  var w = box.querySelector('#wipe');
  if(w) w.onclick = function(){
    if(confirm('¿Eliminar los ' + DB.discos.length + ' discos?')){
      guardarDeshacer(DB.discos.slice(), 'vaciar la colección');
      DB.discos = []; persist(); toast('Colección vaciada');
    }
  };
  montarAyudas(box);
}

/* ============================================================
   14. EVENTOS
   ============================================================ */
function montarEventos(){
  var byId = function(id){ return document.getElementById(id); };
  aplicarTema();
  if(window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if(mq.addEventListener) mq.addEventListener('change', function(){ if(temaActual() === 'auto') aplicarTema('auto'); });
  }
  montarAyudas(document);
  byId('btnAdd').onclick = function(){ openForm(null); };
  byId('btnAddMob').onclick = function(){ openForm(null); };
  byId('qClear').onclick = function(){
    byId('q').value = '';
    byId('searchw').classList.remove('lleno');
    paintCol();
  };
  byId('btnPal').onclick = abrirPaleta;
  byId('btnDice').onclick = discoAlAzar;
  byId('btnSel').onclick = function(){ modoSeleccion(!selMulti); };
  byId('btnScan').onclick = escanear;
  byId('fabScan').onclick = escanear;
  var bt = byId('btnTienda');
  if(bt) bt.onclick = modoTienda;
  byId('logo').onclick = function(){ setView('col'); };
  byId('syncBadge').onclick = function(){ configurado() ? sincronizarAhora() : pantallaSync(); };
  byId('q').oninput = function(){
    byId('searchw').classList.toggle('lleno', !!byId('q').value);
    paintCol();
  };
  byId('sortBy').onchange = function(e){
    sortBy = e.target.value;
    if(sortBy === 'random') randomSeed = Date.now() % 99991;
    paintCol();
  };
  byId('selGroup').onchange = function(e){ grupo = e.target.value; paintCol(); };
  byId('fGenre').onchange = function(e){ fGen = e.target.value; paintCol(); };
  byId('segType').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#segType button').forEach(function(x){ x.className = ''; });
    b.className = 'on'; fType = b.dataset.f; paintCol();
  };
  byId('segMode').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#segMode button').forEach(function(x){ x.className = ''; });
    b.className = 'on'; modo = b.dataset.m; paintCol();
  };
  var tabClick = function(e){
    var b = e.target.closest('button[data-v]');
    if(b) setView(b.dataset.v);
  };
  byId('tabs').onclick = tabClick;
  byId('tabbar').onclick = tabClick;
  byId('fileCsv').onchange = function(e){ var f = e.target.files[0]; if(f) importCsv(f); e.target.value = ''; };
  byId('fileBak').onchange = function(e){ var f = e.target.files[0]; if(f) importBackup(f); e.target.value = ''; };

  var nav = byId('nav'), ultimoY = 0;
  window.addEventListener('scroll', function(){
    var y = window.scrollY || 0;
    if((y > 40) !== (ultimoY > 40)) nav.classList.toggle('shrink', y > 40);
    ultimoY = y;
  }, {passive:true});

  (function(){
    var ptr = byId('ptr'), y0 = null, dy = 0, tirando = false;
    document.addEventListener('touchstart', function(e){
      if(window.scrollY > 0 || document.querySelector('.scrim,.pal')) return;
      y0 = e.touches[0].clientY; dy = 0; tirando = true;
    }, {passive:true});
    document.addEventListener('touchmove', function(e){
      if(!tirando || y0 === null) return;
      dy = e.touches[0].clientY - y0;
      if(dy <= 0){ ptr.style.opacity = 0; return; }
      var p = Math.min(1, dy / 90);
      ptr.style.opacity = p;
      ptr.style.transform = 'translateX(-50%) scale(' + (.5 + p * .5) + ') rotate(' + (dy * 2.2) + 'deg)';
    }, {passive:true});
    document.addEventListener('touchend', function(){
      if(!tirando) return;
      tirando = false;
      if(dy > 85){
        ptr.classList.add('girando');
        ptr.style.opacity = 1;
        ptr.style.transform = 'translateX(-50%) scale(1)';
        var fin = function(){
          ptr.classList.remove('girando');
          ptr.style.opacity = 0;
          ptr.style.transform = 'translateX(-50%) scale(.5)';
        };
        if(configurado()) pull().then(fin, fin);
        else setTimeout(function(){ renderAll(); fin(); }, 450);
      }else{
        ptr.style.opacity = 0;
        ptr.style.transform = 'translateX(-50%) scale(.5)';
      }
      y0 = null; dy = 0;
    });
  })();

  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && configurado() && Date.now() - ultimoPull > 20000) pull(true);
  });
  window.addEventListener('online', function(){ if(configurado()) sincronizarAhora(); });
  window.addEventListener('offline', function(){ marcar('off'); });
  window.addEventListener('beforeunload', function(e){
    if(syncState === 'pend' && configurado()){ e.preventDefault(); e.returnValue = ''; }
  });
  setInterval(function(){
    if(configurado() && !document.hidden && navigator.onLine && Date.now() - ultimoPull > 300000) pull(true);
  }, 60000);

  document.addEventListener('keydown', function(e){
    var enCampo = /input|textarea|select/i.test((e.target.tagName || ''));
    if((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); sincronizarAhora(); return; }
    if((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); abrirPaleta(); return; }
    if(enCampo || document.querySelector('.scrim') || document.querySelector('.pal')) return;
    if(e.key === '/'){ e.preventDefault(); document.getElementById('q').focus(); }
    else if(e.key === 'n'){ e.preventDefault(); openForm(null); }
    else if(e.key === 'r'){ e.preventDefault(); discoAlAzar(); }
    else if(e.key === '1'){ setView('col'); }
    else if(e.key === '2'){ setView('wish'); }
    else if(e.key === '3'){ setView('stats'); }
    else if(e.key === '4'){ setView('db'); }
    else if(e.key === 't'){ e.preventDefault(); modoTienda(); }
  });
  document.body.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.body.addEventListener('drop', function(e){
    e.preventDefault();
    var f = e.dataTransfer.files[0];
    if(!f) return;
    if(/\.csv$/i.test(f.name)) importCsv(f);
    else if(/\.json$/i.test(f.name)) importBackup(f);
  });
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    var recargado = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(recargado) return;
      recargado = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.waiting) reg.waiting.postMessage('saltar');
      reg.addEventListener('updatefound', function(){
        var nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener('statechange', function(){
          if(nuevo.state === 'installed' && navigator.serviceWorker.controller) nuevo.postMessage('saltar');
        });
      });
      setInterval(function(){ reg.update().catch(function(){}); }, 900000);
    }).catch(function(){});
  }
}

boot();
