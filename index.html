/* ============================================================
   16. FICHA TÉCNICA DE DISCOGS, COMPARTIR Y MENÚ RÁPIDO
   ============================================================ */
var COMPANIAS = {
  'Recorded At':'Grabado en', 'Mixed At':'Mezclado en', 'Mastered At':'Masterizado en',
  'Pressed By':'Prensado por', 'Manufactured By':'Fabricado por', 'Distributed By':'Distribuido por',
  'Made By':'Fabricado por', 'Printed By':'Impreso por', 'Published By':'Editado por',
  'Record Company':'Discográfica', 'Phonographic Copyright (p)':'Copyright fonográfico',
  'Copyright (c)':'Copyright', 'Glass Mastered At':'Masterizado en', 'Lacquer Cut At':'Corte de laca'
};
var CREDITOS_DG = {
  'Producer':'Producción', 'Co-producer':'Coproducción', 'Executive-Producer':'Producción ejecutiva',
  'Engineer':'Ingeniería', 'Mixed By':'Mezcla', 'Mastered By':'Masterización', 'Recorded By':'Grabación',
  'Written-By':'Composición', 'Music By':'Música', 'Lyrics By':'Letra', 'Arranged By':'Arreglos',
  'Design':'Diseño', 'Artwork':'Ilustración', 'Photography By':'Fotografía', 'Cover':'Portada'
};
function cargarDiscogs(d){
  if(!hayDiscogs()) return Promise.reject(new Error('sin token'));
  var m = String(d.discogs || '').match(/release\/(\d+)/);
  var busca = m
    ? dgGet('releases/' + m[1])
    : dgGet('database/search?type=release&per_page=3&q='
        + encodeURIComponent((d.artista || '') + ' ' + (d.titulo || ''))
        + (d.numeroCatalogo ? '&catno=' + encodeURIComponent(d.numeroCatalogo) : ''))
      .then(function(j){
        var r = (j.results || [])[0];
        if(!r) throw new Error('no encontrado');
        return dgGet('releases/' + r.id);
      });
  return busca.then(function(r){
    var comp = {}, cred = {};
    (r.companies || []).forEach(function(c){
      var k = COMPANIAS[c.entity_type_name] || null;
      if(!k) return;
      comp[k] = comp[k] ? (comp[k].indexOf(c.name) < 0 ? comp[k] + ', ' + limpiaNombre(c.name) : comp[k]) : limpiaNombre(c.name);
    });
    (r.extraartists || []).forEach(function(a){
      String(a.role || '').split(/,\s*/).forEach(function(rol){
        var k = CREDITOS_DG[rol.replace(/\s*\[.*$/, '').trim()];
        if(!k) return;
        cred[k] = cred[k] ? (cred[k].indexOf(a.name) < 0 ? cred[k] + ', ' + limpiaNombre(a.name) : cred[k]) : limpiaNombre(a.name);
      });
    });
    var ids = {};
    (r.identifiers || []).forEach(function(i){
      var t = String(i.type || '');
      if(/barcode/i.test(t)) ids['Código de barras'] = i.value;
      else if(/depósito legal|deposito legal|legal deposit/i.test(t + ' ' + (i.description || ''))) ids['Depósito legal'] = i.value;
      else if(/rights society/i.test(t)) ids['Entidad de gestión'] = i.value;
      else if(/matrix/i.test(t) && !ids['Matriz']) ids['Matriz'] = i.value;
    });
    var fmt = (r.formats || [])[0] || {};
    var tec = {
      prensado: [fmt.name, fmt.qty > 1 ? fmt.qty + ' unidades' : '', (fmt.descriptions || []).join(', '), fmt.text]
        .filter(Boolean).join(' · '),
      pais: r.country || '', publicado: r.released || String(r.year || ''),
      estilos: (r.styles || []).join(', '),
      versiones: 0, url: r.uri ? ('https://www.discogs.com' + r.uri) : '',
      valor: (r.lowest_price != null ? r.lowest_price : null),
      nota: (r.community && r.community.rating && r.community.rating.average) || 0,
      votos: (r.community && r.community.rating && r.community.rating.count) || 0,
      tienen: (r.community && r.community.have) || 0,
      quieren: (r.community && r.community.want) || 0,
      companias: comp, creditos: cred, ids: ids, cargado: nowISO()
    };
    /* posiciones de corte (A1, B2…), muy útiles en vinilo */
    var pistas = (r.tracklist || []).filter(function(t){ return !t.type_ || t.type_ === 'track'; });
    if(pistas.length && d.tracklist.length){
      var cambio = false;
      d.tracklist.forEach(function(t, i){
        var p = pistas[i];
        if(p && p.position && plain(p.title).slice(0, 8) === plain(t.titulo).slice(0, 8) && !t.pos){
          t.pos = p.position;
          var mm = String(p.position).match(/^(\d+)-/);
          if(mm) t.disco = +mm[1];
          cambio = true;
        }
      });
      if(cambio) d.tracklist = d.tracklist.slice();
    }
    if(!d.discogs && tec.url) d.discogs = tec.url;
    d.tecnica = tec;
    persist(true);
    return tec;
  });
}
function pintaTecnica(caja, d){
  if(!caja) return;
  var t = d.tecnica;
  if(!t){ caja.innerHTML = ''; return; }
  var filas = [];
  var f = function(k, v, credito){
    if(!v) return;
    var val = credito
      ? String(v).split(', ').map(function(q){
          return '<button class="credl" data-rol="' + esc(k) + '" data-quien="' + esc(q) + '">' + esc(q) + '</button>';
        }).join(', ')
      : esc(v);
    filas.push('<div class="cred"><span class="k">' + k + '</span><span class="v">' + val + '</span></div>');
  };
  f('Prensado', t.prensado);
  f('Estilos', t.estilos);
  Object.keys(t.ids).forEach(function(k){ f(k, t.ids[k]); });
  Object.keys(t.companias).forEach(function(k){ f(k, t.companias[k], true); });
  Object.keys(t.creditos).forEach(function(k){ f(k, t.creditos[k], true); });

/* ---------- compartir el disco como imagen ---------- */
function compartirDisco(d){
  var t = toast('Preparando la imagen…');
  var W = 1080, H = 1350;
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var x = c.getContext('2d');
  var fondo = d.color ? 'rgb(' + d.color + ')' : '#1d1d1f';
  var grad = x.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, fondo);
  grad.addColorStop(1, '#0d0d10');
  x.fillStyle = grad; x.fillRect(0, 0, W, H);
  var pinta = function(img){
    if(img){
      var s = 760, px = (W - s) / 2, py = 170;
      x.save();
      x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 60; x.shadowOffsetY = 24;
      x.beginPath(); x.roundRect(px, py, s, s, 28); x.closePath(); x.clip();
      x.drawImage(img, px, py, s, s);
      x.restore();
    }
    x.fillStyle = '#fff';
    x.textAlign = 'center';
    x.font = '700 62px -apple-system, "SF Pro Display", Helvetica, Arial';
    var tit = d.titulo.length > 26 ? d.titulo.slice(0, 25) + '…' : d.titulo;
    x.fillText(tit, W / 2, 1055);
    x.fillStyle = 'rgba(255,255,255,.72)';
    x.font = '500 42px -apple-system, "SF Pro Text", Helvetica, Arial';
    x.fillText(d.artista, W / 2, 1115);
    x.fillStyle = 'rgba(255,255,255,.5)';
    x.font = '400 32px -apple-system, "SF Pro Text", Helvetica, Arial';
    x.fillText([d['año'], d.formato, d.genero].filter(Boolean).join('  ·  '), W / 2, 1170);
    if(d.valoracion){
      x.fillStyle = '#ffb400';
      x.font = '400 46px -apple-system, Helvetica, Arial';
      var est = '';
      for(var i = 0; i < 5; i++) est += i < d.valoracion ? '★' : '☆';
      x.fillText(est, W / 2, 1245);
    }
    c.toBlob(function(blob){
      t.remove();
      if(!blob) return toast('No se pudo generar la imagen', true);
      var file = new File([blob], 'disco.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title: d.titulo}).catch(function(){});
      }else{
        download((d.artista + ' - ' + d.titulo).replace(/[^\w\s-]/g, '') + '.png', blob);
        toast('Imagen descargada');
      }
    }, 'image/png');
  };
  if(!d.portada) return pinta(null);
  var img = new Image(), hecho = false;
  var una = function(x){ if(hecho) return; hecho = true; pinta(x); };
  img.crossOrigin = 'anonymous';
  img.onload = function(){ una(img); };
  img.onerror = function(){ una(null); };
  setTimeout(function(){ una(null); }, 3500);
  img.src = d.portada;
}

    + '</div>';

      else if(a === 'abrir') openDetail(d.id);
      else if(a === 'editar') openForm(d);
      else if(a === 'compartir') compartirDisco(d);
    };
  });
}
function montarPulsacionLarga(root){
  root.querySelectorAll('.tile,.lrow').forEach(function(el){
    var t = null, movido = false;
    var arranca = function(){
      movido = false;
      t = setTimeout(function(){
        if(!movido){ menuRapido(el.dataset.id); }
      }, 480);
    };
    var para = function(){ clearTimeout(t); };
    el.addEventListener('touchstart', arranca, {passive:true});
    el.addEventListener('touchmove', function(){ movido = true; para(); }, {passive:true});
    el.addEventListener('touchend', para);
    el.addEventListener('touchcancel', para);
    el.addEventListener('contextmenu', function(e){
      if(window.innerWidth > 760) return;
      e.preventDefault();
      menuRapido(el.dataset.id);
    });
  });
}

/* ============================================================
   17. RESUMEN POR PAÍS
   ============================================================ */
function verPais(cc){
  var ds = coleccion().filter(function(d){ return d.pais === cc; });
  if(!ds.length) return;
  var nv = ds.filter(function(d){ return d.formato === 'Vinilo'; }).length;
  var cuenta = function(fn){
    var m = {};
    ds.forEach(function(d){ var k = fn(d); if(k) m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).map(function(k){ return {k:k, v:m[k]}; }).sort(function(a, b){ return b.v - a.v; });
  };
  var sellos = cuenta(function(d){ return d.sello; }).slice(0, 4);
  var decadas = cuenta(function(d){ var y = parseInt(d['año']); return y ? Math.floor(y / 10) * 10 + 's' : ''; })
    .sort(function(a, b){ return parseInt(a.k) - parseInt(b.k); });
  var orden = ds.slice().sort(function(a, b){
    return (a.artista || '').localeCompare(b.artista || '', 'es') || String(a['año']).localeCompare(String(b['año']));
  });
  var body =
    '<div class="paishd">' + (bandera(cc) ? '<div class="bandera">' + bandera(cc) + '</div>' : '')
    + '<div><div class="pn">' + esc(nombrePais(cc)) + '</div>'
    + '<div class="pd">' + ds.length + (ds.length === 1 ? ' disco prensado aquí' : ' discos prensados aquí') + '</div></div></div>'
    + '<div class="resumen" style="display:flex;margin-bottom:16px">'
      + '<div><div class="v vin">' + nv + '</div><div class="k">vinilos</div></div>'
      + '<div><div class="v cd">' + (ds.length - nv) + '</div><div class="k">CDs</div></div>'
      + '<div><div class="v">' + cuenta(function(d){ return d.artista; }).length + '</div><div class="k">artistas</div></div>'
      + (decadas.length ? '<div><div class="v" style="font-size:16px;padding-top:3px">' + decadas[0].k
          + '</div><div class="k">desde</div></div>' : '')
    + '</div>'
    + (sellos.length ? '<div class="tl-hd"><h4>Sellos</h4></div><div class="rowb" style="margin-bottom:16px">'
        + sellos.map(function(s){ return '<span class="tag">' + esc(s.k) + ' · ' + s.v + '</span>'; }).join('') + '</div>' : '')
    + '<div class="tl-hd"><h4>Discos<span class="n"> · ' + ds.length + '</span></h4></div>'
    + '<div class="grid paisgrid">' + orden.map(function(d){ return tileHtml(d, null); }).join('') + '</div>';
  var s = sheet(nombrePais(cc), body,
    '<span></span><button class="btn pri" id="verTodos">Ver en la colección</button>', true);
  enlazarTiles(s, null);
  s.querySelector('#verTodos').onclick = function(){
    fPais = cc;
    s.remove();
    setView('col');
    paintCol();
  };
}

/* ============================================================
   18. CALENDARIO DE ESCUCHAS
   ============================================================ */
var DIAS_SEM = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
var MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function todasLasEscuchas(){
  var out = [];
  coleccion().forEach(function(d){
    (d.escuchasFechas || []).forEach(function(f){ out.push({f:f, d:d}); });
  });
  return out.sort(function(a, b){ return a.f.localeCompare(b.f); });
}
function diaSemana(iso){
  var p = iso.split('-');
  var j = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
  return (j + 6) % 7;   /* 0 = lunes */
}
function statsPeriodo(lista, etiqueta){
  if(!lista.length) return '<div class="tl-empty">Sin escuchas en ' + etiqueta + '</div>';
  var porDia = {}, porDisco = {}, porSem = [0,0,0,0,0,0,0];
  lista.forEach(function(x){
    porDia[x.f] = (porDia[x.f] || 0) + 1;
    porDisco[x.d.id] = (porDisco[x.d.id] || 0) + 1;
    porSem[diaSemana(x.f)]++;
  });
  var dias = Object.keys(porDia).sort();
  /* racha más larga de días consecutivos */
  var racha = 0, mejor = 0, prev = null;
  dias.forEach(function(f){
    var t = new Date(f + 'T12:00:00').getTime();
    if(prev !== null && Math.round((t - prev) / 86400000) === 1) racha++;
    else racha = 1;
    if(racha > mejor) mejor = racha;
    prev = t;
  });
  var top = Object.keys(porDisco).sort(function(a, b){ return porDisco[b] - porDisco[a]; })[0];
  var td = DB.discos.filter(function(d){ return d.id === top; })[0];
  var mejorDia = porSem.indexOf(Math.max.apply(null, porSem));
  var NOM = ['lunes','martes','miércoles','jueves','viernes','sábados','domingos'];
  var f = function(k, v){ return '<div class="cred"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; };
  return '<div class="creds">'
    + f('Escuchas', lista.length)
    + f('Discos distintos', Object.keys(porDisco).length)
    + f('Días con música', dias.length)
    + f('Racha más larga', mejor + (mejor === 1 ? ' día' : ' días seguidos'))
    + f('Día preferido', 'los ' + NOM[mejorDia] + ' (' + porSem[mejorDia] + ')')
    + (td ? f('El más puesto', esc(td.titulo) + ' · ' + porDisco[top]) : '')
    + '</div>';
}
function calendarioEscuchas(nivel, ref){
  var todas = todasLasEscuchas();
  var hoy = new Date();
  nivel = nivel || 'anio';
  ref = ref || hoy.getFullYear() + '-' + ('0' + (hoy.getMonth() + 1)).slice(-2) + '-' + ('0' + hoy.getDate()).slice(-2);
  var s = sheet('Calendario de escuchas', '<div id="calBody"></div>', null, true);
  var caja = s.querySelector('#calBody');

  function pinta(){
    var anio = +ref.slice(0, 4), mes = +ref.slice(5, 7), dia = +ref.slice(8, 10);
    var titulo = '', lista = [], cuerpo = '';
    var seg = '<div class="seg" id="calSeg" style="margin-bottom:16px">'
      + ['anio:Año', 'mes:Mes', 'sem:Semana', 'dia:Día'].map(function(o){
          var p = o.split(':');
          return '<button data-n="' + p[0] + '"' + (nivel === p[0] ? ' class="on"' : '') + '>' + p[1] + '</button>';
        }).join('') + '</div>';

    if(nivel === 'anio'){
      titulo = anio;
      lista = todas.filter(function(x){ return +x.f.slice(0, 4) === anio; });
      var porDia = {};
      lista.forEach(function(x){ porDia[x.f] = (porDia[x.f] || 0) + 1; });
      var maxd = Math.max(1, Math.max.apply(null, Object.keys(porDia).map(function(k){ return porDia[k]; }).concat([1])));
      var meses = '';
      for(var m = 0; m < 12; m++){
        var pri = new Date(anio, m, 1), ult = new Date(anio, m + 1, 0).getDate();
        var hueco = (pri.getDay() + 6) % 7, celdas = '';
        for(var e = 0; e < hueco; e++) celdas += '<i class="c vacia"></i>';
        for(var d2 = 1; d2 <= ult; d2++){
          var f2 = anio + '-' + ('0' + (m + 1)).slice(-2) + '-' + ('0' + d2).slice(-2);
          var n = porDia[f2] || 0;
          var nv2 = n === 0 ? 0 : Math.min(4, Math.ceil(n / maxd * 4));
          celdas += '<i class="c n' + nv2 + '" data-dia="' + f2 + '" title="' + d2 + ' de ' + MESES_L[m] + ': '
            + (n || 'sin escuchas') + '"></i>';
        }
        meses += '<div class="calmes" data-mes="' + anio + '-' + ('0' + (m + 1)).slice(-2) + '-01">'
          + '<div class="cm">' + MESES_L[m].slice(0, 3) + '</div><div class="cg">' + celdas + '</div></div>';
      }
      cuerpo = '<div class="calanio">' + meses + '</div>'
        + '<div class="calleyenda"><span>menos</span><i class="c n0"></i><i class="c n1"></i><i class="c n2"></i>'
        + '<i class="c n3"></i><i class="c n4"></i><span>más</span></div>';
    }
    else if(nivel === 'mes'){
      titulo = MESES_L[mes - 1] + ' de ' + anio;
      lista = todas.filter(function(x){ return x.f.slice(0, 7) === ref.slice(0, 7); });
      var porDia2 = {};
      lista.forEach(function(x){ (porDia2[x.f] = porDia2[x.f] || []).push(x.d); });
      var pri2 = new Date(anio, mes - 1, 1), ult2 = new Date(anio, mes, 0).getDate();
      var hueco2 = (pri2.getDay() + 6) % 7, celdas2 = '';
      for(var e2 = 0; e2 < hueco2; e2++) celdas2 += '<div class="cd vacia"></div>';
      for(var d3 = 1; d3 <= ult2; d3++){
        var f3 = anio + '-' + ('0' + mes).slice(-2) + '-' + ('0' + d3).slice(-2);
        var ds3 = porDia2[f3] || [];
        celdas2 += '<div class="cd' + (ds3.length ? ' con' : '') + '" data-dia="' + f3 + '">'
          + '<span class="dn">' + d3 + '</span>'
          + (ds3.length ? '<div class="minis">' + ds3.slice(0, 3).map(function(d4){
              return d4.portada ? '<img src="' + esc(d4.portada) + '" alt="" onerror="this.remove()">' : '<i></i>';
            }).join('') + (ds3.length > 3 ? '<span class="mas">+' + (ds3.length - 3) + '</span>' : '') + '</div>' : '')
          + '</div>';
      }
      cuerpo = '<div class="calsem">' + DIAS_SEM.map(function(x){ return '<span>' + x + '</span>'; }).join('') + '</div>'
        + '<div class="calmesg">' + celdas2 + '</div>';
    }
    else if(nivel === 'sem'){
      var base = new Date(anio, mes - 1, dia);
      base.setDate(base.getDate() - diaSemana(ref));
      var dias7 = [];
      for(var i7 = 0; i7 < 7; i7++){
        var dd = new Date(base.getTime() + i7 * 86400000);
        dias7.push(dd.getFullYear() + '-' + ('0' + (dd.getMonth() + 1)).slice(-2) + '-' + ('0' + dd.getDate()).slice(-2));
      }
      var m1 = +dias7[0].slice(5, 7), m2 = +dias7[6].slice(5, 7);
      titulo = 'Semana del ' + (+dias7[0].slice(8)) + (m1 !== m2 ? ' de ' + MESES_L[m1 - 1] : '')
        + ' al ' + (+dias7[6].slice(8)) + ' de ' + MESES_L[m2 - 1];
      lista = todas.filter(function(x){ return dias7.indexOf(x.f) >= 0; });
      cuerpo = '<div class="calsemg">' + dias7.map(function(f4, i4){
        var ds4 = lista.filter(function(x){ return x.f === f4; });
        return '<div class="cs" data-dia="' + f4 + '"><div class="ch">' + DIAS_SEM[i4] + ' ' + (+f4.slice(8)) + '</div>'
          + (ds4.length ? ds4.map(function(x){
              return '<div class="ci">' + (x.d.portada ? '<img src="' + esc(x.d.portada) + '" alt="" onerror="this.remove()">' : '')
                + '<span>' + esc(x.d.titulo) + '</span></div>';
            }).join('') : '<div class="cv">—</div>') + '</div>';
      }).join('') + '</div>';
    }
    else{
      titulo = dia + ' de ' + MESES_L[mes - 1] + ' de ' + anio;
      lista = todas.filter(function(x){ return x.f === ref; });
      cuerpo = lista.length
        ? '<div class="grid">' + lista.map(function(x){ return tileHtml(x.d, null); }).join('') + '</div>'
        : '<div class="tl-empty">Ese día no pusiste nada</div>';
    }

    caja.innerHTML = seg
      + '<div class="calnav"><button class="iconbtn" data-mov="-1"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg></button>'
      + '<div class="calt">' + titulo + '</div>'
      + '<button class="iconbtn" data-mov="1"><svg class="ic" viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg></button></div>'
      + cuerpo
      + '<div class="tl-hd" style="margin-top:20px"><h4>Resumen</h4></div>'
      + statsPeriodo(lista, 'este periodo');

    caja.querySelectorAll('#calSeg button').forEach(function(b){
      b.onclick = function(){ nivel = b.dataset.n; pinta(); };
    });
    caja.querySelectorAll('[data-mov]').forEach(function(b){
      b.onclick = function(){
        var m = +b.dataset.mov, f = new Date(+ref.slice(0, 4), +ref.slice(5, 7) - 1, +ref.slice(8, 10));
        if(nivel === 'anio') f.setFullYear(f.getFullYear() + m);
        else if(nivel === 'mes') f.setMonth(f.getMonth() + m);
        else if(nivel === 'sem') f.setDate(f.getDate() + 7 * m);
        else f.setDate(f.getDate() + m);
        ref = f.getFullYear() + '-' + ('0' + (f.getMonth() + 1)).slice(-2) + '-' + ('0' + f.getDate()).slice(-2);
        pinta();
      };
    });
    caja.querySelectorAll('[data-mes]').forEach(function(b){
      b.onclick = function(){ ref = b.dataset.mes; nivel = 'mes'; pinta(); };
    });
    caja.querySelectorAll('[data-dia]').forEach(function(b){
      b.onclick = function(e){ e.stopPropagation(); ref = b.dataset.dia; nivel = 'dia'; pinta(); };
    });
    enlazarTiles(caja, null);
  }
  pinta();
}

      + accion(I.trash, 'Eliminar', 'Los borra de la colección. Podrás deshacerlo.', 'del', 'destr', 'Eliminar')
    + '</div>';

    '<button class="btn" data-lx>Cerrar</button><button class="btn pri" id="lOk">Aplicar cambios</button>');

        if(d.etiquetas.indexOf(t) < 0) d.etiquetas.push(t);
      });

  on('oir', function(){
    ds.forEach(function(d){ if(!escuchadoHoy(d)) marcarEscucha(d.id, true); });
    persist(); s.remove(); modoSeleccion(false);
    toast('Escucha registrada en ' + ds.length + ' discos');
  });
  on('wish', function(){
    guardarDeshacer(ds, 'mover a deseos');
    ds.forEach(function(d){ d.lista = 'deseos'; });
    persist(); s.remove(); modoSeleccion(false);
    toast(ds.length + ' discos movidos a deseos');
  });
  on('comp', function(){
    s.remove(); modoSeleccion(false);
    bulkRun(ds.filter(incompleto));
  });
  on('del', function(){
    if(!confirm('¿Eliminar ' + ds.length + ' discos?')) return;
    guardarDeshacer(ds, 'eliminar ' + ds.length + ' discos');
    DB.discos = DB.discos.filter(function(d){ return !seleccion[d.id]; });
    persist(); s.remove(); modoSeleccion(false);
    toast(ds.length + ' discos eliminados');
  });
}

   20. DESHACER
   ============================================================ */
var pilaDeshacer = null, temporizadorDeshacer = null;
function guardarDeshacer(discos, etiqueta){
  pilaDeshacer = {
    copia: JSON.parse(JSON.stringify(discos)),
    ids: discos.map(function(d){ return d.id; }),
    etiqueta: etiqueta
  };
  clearTimeout(temporizadorDeshacer);
  temporizadorDeshacer = setTimeout(function(){ pilaDeshacer = null; ocultarDeshacer(); }, 12000);
  setTimeout(mostrarDeshacer, 60);
}
function mostrarDeshacer(){
  if(!pilaDeshacer) return;
  var t = document.querySelector('.toast');
  if(!t) return;
  if(t.querySelector('.undo')) return;
  var b = document.createElement('button');
  b.className = 'undo';
  b.textContent = 'Deshacer';
  b.onclick = deshacer;
  t.appendChild(b);
}
function ocultarDeshacer(){
  var b = document.querySelector('.toast .undo');
  if(b) b.remove();
}
function deshacer(){
  if(!pilaDeshacer) return;
  var por = {};
  pilaDeshacer.copia.forEach(function(d){ por[d.id] = d; });
  DB.discos = DB.discos.filter(function(d){ return !por[d.id]; });
  pilaDeshacer.copia.forEach(function(d){
    DB.discos.push(normDisc(d));
    DB.borrados = (DB.borrados || []).filter(function(b){ return b.id !== d.id; });
  });
  var n = pilaDeshacer.copia.length;
  pilaDeshacer = null;
  clearTimeout(temporizadorDeshacer);
  persist();
  toast('Deshecho · ' + n + (n === 1 ? ' disco restaurado' : ' discos restaurados'));
}

function valorColeccion(){
  var ds = coleccion();
  var con = ds.filter(function(d){ return d.tecnica && d.tecnica.valor != null && d.tecnica.valor > 0; });
  var suma = con.reduce(function(a, d){ return a + d.tecnica.valor; }, 0);
  var pagado = ds.reduce(function(a, d){ return a + (d.precioCompra || 0); }, 0);
  var body =
    '<div class="warnb info">' + I.info + '<span>Es el <b>precio más bajo al que se vende</b> cada disco en Discogs. '
    + 'Orientativo y algo optimista: es lo que piden los vendedores, no lo que se paga.</span></div>'
    + (con.length
      ? '<div class="resumen" style="display:flex;margin-bottom:18px">'
        + '<div><div class="v">' + suma.toFixed(0) + '<small>€</small></div><div class="k">valor estimado</div></div>'
        + '<div><div class="v">' + con.length + '</div><div class="k">con precio</div></div>'
        + '<div><div class="v">' + (suma / con.length).toFixed(1) + '<small>€</small></div><div class="k">media</div></div>'
        + '</div>'
        + (pagado ? '<div class="creds" style="margin-bottom:18px">'
            + '<div class="cred"><span class="k">Lo que registraste haber pagado</span><span class="v">' + pagado.toFixed(0) + ' €</span></div>'
            + '<div class="cred"><span class="k">Diferencia</span><span class="v">' + (suma - pagado >= 0 ? '+' : '') + (suma - pagado).toFixed(0) + ' €</span></div>'
            + '</div>' : '')
        + '<div class="tl-hd"><h4>Los más valiosos</h4></div><div class="tl">'
        + con.slice().sort(function(a, b){ return b.tecnica.valor - a.tecnica.valor; }).slice(0, 15).map(function(d){
            return '<div class="trk" data-disco="' + d.id + '" style="cursor:pointer"><span class="nm">' + esc(d.titulo)
              + '<span style="color:var(--txt3)"> · ' + esc(d.artista) + '</span></span>'
              + '<span class="dur">' + d.tecnica.valor.toFixed(2) + ' €</span></div>';
          }).join('') + '</div>'
      : '<div class="tl-empty">Todavía no hay precios. Abre fichas de discos para que se consulten en Discogs, '
        + 'o pulsa el botón de abajo para revisarlos todos.</div>');
  var pie = '<span></span><button class="btn pri" id="valTodos">Consultar precios</button>';
  var s = sheet('Valor de la colección', body, pie, true);
  s.querySelectorAll('[data-disco]').forEach(function(el){
    el.onclick = function(){ s.remove(); openDetail(el.dataset.disco); };
  });
  s.querySelector('#valTodos').onclick = function(){
    if(!hayDiscogs()){ toast('Configura antes tu token de Discogs', true); return; }
    var faltan = ds.filter(function(d){ return !d.tecnica || d.tecnica.valor == null; });
    if(!faltan.length){ toast('Ya están todos consultados'); return; }
    s.remove();
    consultarPrecios(faltan);
  };
}
async function consultarPrecios(lista){
  cancelBulk = false;
  bulk = {done:0, total:lista.length, ok:0, actual:''};
  setView('col');
  paintBanner();
  for(var i = 0; i < lista.length; i++){
    if(cancelBulk) break;
    bulk.actual = lista[i].artista + ' — ' + lista[i].titulo;
    paintBanner();
    try{ await cargarDiscogs(lista[i]); bulk.ok++; }catch(e){}
    bulk.done++;
    paintBanner();
  }
  bulk = null;
  renderAll();
  toast('Precios consultados en ' + lista.length + ' discos');
}

function tally(arr, fn){
  var m = {};
  arr.forEach(function(d){ var k = fn(d); if(k) m[k] = (m[k] || 0) + 1; });
  return Object.keys(m).map(function(k){ return {k:k, v:m[k]}; }).sort(function(a, b){ return b.v - a.v; });
}
function miniRing(pct, color, size){
  var s = size || 42, t = 5, r = (s - t) / 2, c = s / 2, circ = 2 * Math.PI * r;
  var len = circ * Math.max(0, Math.min(1, pct || 0));
  return '<svg class="ring" viewBox="0 0 ' + s + ' ' + s + '" style="width:' + s + 'px;height:' + s + 'px;flex-shrink:0">'
    + '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="var(--fill)" stroke-width="' + t + '"/>'
    + '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + t + '" stroke-linecap="round"'
    + ' stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" transform="rotate(-90 ' + c + ' ' + c + ')"/>'
    + '<text x="' + c + '" y="' + (c + 4) + '" text-anchor="middle" style="font-size:11px;font-weight:600;fill:var(--txt)">'
    + Math.round((pct || 0) * 100) + '%</text></svg>';
}
function donut(data, size, thick){
  var total = data.reduce(function(a, b){ return a + b.v; }, 0) || 1;
  var s = size || 150, t = thick || 22, r = (s - t) / 2, c = s / 2, circ = 2 * Math.PI * r, off = 0;
  var out = '<svg class="chart" viewBox="0 0 ' + s + ' ' + s + '" style="width:' + s + 'px;height:' + s + 'px;flex-shrink:0">';
  out += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="var(--fill)" stroke-width="' + t + '"/>';
  data.forEach(function(d){
    var len = d.v / total * circ;
    out += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + d.c + '" stroke-width="' + t
      + '" stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2)
      + '" transform="rotate(-90 ' + c + ' ' + c + ')"><title>' + esc(d.k) + ': ' + d.v + '</title></circle>';
    off += len;
  });
  out += '<text x="' + c + '" y="' + (c - 3) + '" text-anchor="middle" style="font-size:25px;font-weight:600;fill:var(--txt);letter-spacing:-.03em">' + total + '</text>';
  out += '<text x="' + c + '" y="' + (c + 15) + '" text-anchor="middle" style="font-size:11px;fill:var(--txt3)">discos</text>';
  return out + '</svg>';
}
function columns(data, color){
  if(!data.length) return '<div class="tl-empty">Sin datos</div>';
  var W = 640, H = 190, pad = 26, bw = (W - pad * 2) / data.length;
  var max = Math.max.apply(null, data.map(function(d){ return d.v; })) || 1;
  var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 34) + '">';
  out += '<line class="axis" x1="' + pad + '" y1="' + H + '" x2="' + (W - pad) + '" y2="' + H + '"/>';
  data.forEach(function(d, i){
    var h = Math.max(3, d.v / max * (H - 26));
    var x = pad + i * bw + bw * .16, w = bw * .68, y = H - h;
    out += '<g><rect class="b" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1)
      + '" rx="4" fill="' + (color || 'var(--blue)') + '"><title>' + esc(d.k) + ': ' + d.v + '</title></rect>'
      + '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" style="font-size:10.5px;font-weight:600">' + d.v + '</text>'
      + '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H + 17) + '" text-anchor="middle">' + esc(d.k) + '</text></g>';
  });
  return out + '</svg>';
}
function hbars(data, colorFn, clickable){
  if(!data.length) return '<div class="tl-empty">Sin datos</div>';
  var max = Math.max.apply(null, data.map(function(d){ return d.v; })) || 1;
  return '<div class="hbars">' + data.map(function(d, i){
    return '<div class="hb' + (clickable ? ' click' : '') + '" data-k="' + esc(d.k) + '">'
      + '<div class="top"><span class="n">' + esc(d.k) + '</span><span class="v">' + d.v + '</span></div>'
      + '<div class="track"><span style="width:' + (d.v / max * 100).toFixed(1) + '%;background:'
      + (colorFn ? colorFn(i) : PAL[i % PAL.length]) + '"></span></div></div>';
  }).join('') + '</div>';
}
function areaLine(data, color){
  if(data.length < 2) return '<div class="tl-empty">Sin datos suficientes</div>';
  var W = 640, H = 170, pad = 30;
  var max = Math.max.apply(null, data.map(function(d){ return d.v; })) || 1;
  var stepX = (W - pad * 2) / (data.length - 1);
  var pts = data.map(function(d, i){ return [pad + i * stepX, H - (d.v / max) * (H - 30)]; });
  var path = pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var area = path + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + H + ' L' + pts[0][0].toFixed(1) + ' ' + H + ' Z';
  var c = color || 'var(--purple)';
  var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 26) + '">';
  out += '<line class="axis" x1="' + pad + '" y1="' + H + '" x2="' + (W - pad) + '" y2="' + H + '"/>';
  out += '<path d="' + area + '" fill="' + c + '" opacity=".14"/>';
  out += '<path d="' + path + '" fill="none" stroke="' + c + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';

    out += '<circle cx="' + pts[i][0].toFixed(1) + '" cy="' + pts[i][1].toFixed(1) + '" r="3.2" fill="' + c + '"><title>' + esc(d.k) + ': ' + d.v + '</title></circle>';

      out += '<text x="' + pts[i][0].toFixed(1) + '" y="' + (H + 16) + '" text-anchor="middle">' + esc(d.k) + '</text>';
  });
  return out + '</svg>';
}

function mapaMundo(data){
  var W = 760, H = 380;
  var max = Math.max.apply(null, data.map(function(d){ return d.v; })) || 1;
  var out = '<svg class="chart mapa" viewBox="0 0 ' + W + ' ' + H + '">';
  out += '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="16" fill="var(--fill)" opacity=".3"/>';
  out += '<g class="tierra">' + MUNDO_PATHS + '</g>';

  var puntos = data.filter(function(d){ return PAISES[d.k]; }).map(function(d, i){
    var p = PAISES[d.k];
    return {
      k:d.k, v:d.v, i:i,
      x:(p[2] + 180) / 360 * W, y:(90 - p[1]) / 180 * H,
      r:6 + Math.sqrt(d.v / max) * 19,
      nombre:p[0]
    };
  });

  /* etiquetas: se buscan huecos cerca y, si hay que apartarse, se traza una línea al círculo */
  var puestas = [], lineas = [], textos = [];
  puntos.slice().sort(function(a, b){ return b.v - a.v; }).forEach(function(p){
    var ancho = p.nombre.length * 5.7 + 10, alto = 14;
    var cand = [
      [p.x, p.y - p.r - 6, 0], [p.x, p.y + p.r + 12, 0],
      [p.x - p.r - ancho / 2 - 4, p.y + 4, 0], [p.x + p.r + ancho / 2 + 4, p.y + 4, 0],
      [p.x, p.y - p.r - 20, 1], [p.x, p.y + p.r + 26, 1],
      [p.x - p.r - ancho / 2 - 20, p.y - 16, 1], [p.x + p.r + ancho / 2 + 20, p.y - 16, 1],
      [p.x - p.r - ancho / 2 - 20, p.y + 22, 1], [p.x + p.r + ancho / 2 + 20, p.y + 22, 1],
      [p.x, p.y - p.r - 34, 1], [p.x, p.y + p.r + 40, 1]
    ];
    var elegida = null;
    for(var c = 0; c < cand.length && !elegida; c++){
      var x = cand[c][0], y = cand[c][1];
      if(x - ancho / 2 < 3 || x + ancho / 2 > W - 3 || y < 12 || y > H - 5) continue;
      var choca = puestas.some(function(q){
        return Math.abs(q.x - x) < (q.w + ancho) / 2 + 4 && Math.abs(q.y - y) < alto + 2;
      });
      /* tampoco debe caer encima de otra burbuja */
      if(!choca) choca = puntos.some(function(o){
        if(o === p) return false;
        return Math.abs(o.x - x) < ancho / 2 + o.r * .7 && Math.abs(o.y - (y - 4)) < o.r * .7 + 6;
      });
      if(!choca) elegida = cand[c];
    }
    if(!elegida) return;
    puestas.push({x:elegida[0], y:elegida[1], w:ancho});
    if(elegida[2]){
      /* línea guía desde el borde del círculo hasta la etiqueta */
      var dx = elegida[0] - p.x, dy = (elegida[1] - 4) - p.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      var x1 = p.x + dx / dist * (p.r + 1), y1 = p.y + dy / dist * (p.r + 1);
      var x2 = elegida[0] - dx / dist * (ancho / 2 - 2), y2 = (elegida[1] - 4) - dy / dist * 7;
      lineas.push('<line class="mapline" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1)
        + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '"/>');
    }
    textos.push('<text x="' + elegida[0].toFixed(1) + '" y="' + elegida[1].toFixed(1)
      + '" text-anchor="middle" class="maplbl">' + esc(p.nombre) + '</text>');
  });
  out += '<g>' + lineas.join('') + '</g>';

  puntos.slice().sort(function(a, b){ return b.r - a.r; }).forEach(function(p){
    out += '<g class="mapdot" data-pais="' + p.k + '">'
      + '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + p.r.toFixed(1) + '" fill="'
      + PAL[p.i % PAL.length] + '" fill-opacity=".78" stroke="var(--elev)" stroke-width="1.4"/>'
      + '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + 4).toFixed(1) + '" text-anchor="middle" class="mapnum">'
      + p.v + '</text><title>' + esc(p.nombre) + ': ' + p.v + ' discos</title></g>';
  });
  return out + textos.join('') + '</svg>';
}
function wcard(icon, k, v, s, grad){
  return '<div class="wcard" style="background:' + grad + '"><div class="bgic">' + icon + '</div>'
    + '<div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div>'
    + (s ? '<div class="s">' + esc(s) + '</div>' : '') + '</div>';
}

function paintStats(){
  var box = document.getElementById('statsBody');
  if(!box) return;
  var ds = coleccion();
  if(!ds.length){ box.innerHTML = '<div class="blank">' + I.music + '<h3>Sin datos</h3><p>Añade discos para ver tus estadísticas.</p></div>'; return; }

  var nv = ds.filter(function(d){ return d.formato === 'Vinilo'; }).length, nc = ds.length - nv;
  var artistas = tally(ds, function(d){ return d.artista; });
  var generos = tally(ds, function(d){ return d.genero || 'Sin clasificar'; });
  var sellos = tally(ds, function(d){ return d.sello; });
  var paises = tally(ds, function(d){ return d.pais; }).filter(function(p){ return PAISES[p.k]; });
  var decadas = tally(ds, function(d){ var y = parseInt(d['año']); return y ? (Math.floor(y / 10) * 10) + 's' : ''; })
    .sort(function(a, b){ return parseInt(a.k) - parseInt(b.k); });
  var compras = tally(ds, function(d){ return d.fechaCompra ? d.fechaCompra.slice(0, 4) : ''; })
    .sort(function(a, b){ return parseInt(a.k) - parseInt(b.k); });
  var gasto = ds.reduce(function(a, d){ return a + (Number(d.precioCompra) || 0); }, 0);
  var temas = ds.reduce(function(a, d){ return a + d.tracklist.length; }, 0);
  var years = ds.map(function(d){ return parseInt(d['año']); }).filter(function(y){ return y > 1900; });
  var medio = years.length ? Math.round(years.reduce(function(a, b){ return a + b; }, 0) / years.length) : '—';
  var masAntiguo = ds.filter(function(d){ return parseInt(d['año']) > 1900; })
    .sort(function(a, b){ return parseInt(a['año']) - parseInt(b['año']); })[0];
  var masEscuchado = ds.slice().sort(function(a, b){ return (b.escuchas || 0) - (a.escuchas || 0); })[0];
  var decaTop = decadas.slice().sort(function(a, b){ return b.v - a.v; })[0];
  var prestados = ds.filter(function(d){ return d.prestadoA; });

  var porAnio = {}, porMesAct = {}, totalEsc = 0, anioAct = String(new Date().getFullYear());
  ds.forEach(function(d){
    (d.escuchasFechas || []).forEach(function(f){
      var a = String(f).slice(0, 4);
      porAnio[a] = (porAnio[a] || 0) + 1;
      totalEsc++;
      if(a === anioAct){
        var m = String(f).slice(5, 7);
        porMesAct[m] = (porMesAct[m] || 0) + 1;
      }
    });
  });
  var escAnios = Object.keys(porAnio).sort().map(function(a){ return {k:a, v:porAnio[a]}; });
  var MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var escMeses = MESES.map(function(nm, i){ var mm = ('0' + (i + 1)).slice(-2); return {k:nm, v:porMesAct[mm] || 0}; });
  var masPuestos = ds.filter(function(d){ return totalEscuchas(d) > 0; })
    .sort(function(a, b){ return totalEscuchas(b) - totalEscuchas(a); }).slice(0, 12);
  var nunca = ds.filter(function(d){ return totalEscuchas(d) === 0; }).length;

  var crec = [], acc = 0, porMes = {};
  ds.forEach(function(d){ var m = (d.fechaAlta || '').slice(0, 7); if(m) porMes[m] = (porMes[m] || 0) + 1; });
  Object.keys(porMes).sort().forEach(function(m){ acc += porMes[m]; crec.push({k:m.slice(2).replace('-', '/'), v:acc}); });

  var valorados = ds.filter(function(d){ return d.valoracion; });
  var notaMedia = valorados.length ? (valorados.reduce(function(a, d){ return a + d.valoracion; }, 0) / valorados.length) : 0;
  var porNota = [5,4,3,2,1].map(function(n){ return {k:n + '★', v: ds.filter(function(d){ return d.valoracion === n; }).length}; });
  var favoritos = ds.filter(function(d){ return d.valoracion >= 4; })
    .sort(function(a, b){ return b.valoracion - a.valoracion || totalEscuchas(b) - totalEscuchas(a); }).slice(0, 12);
  var duraciones = ds.map(function(d){
    var seg = 0;
    d.tracklist.forEach(function(t){ var m = String(t.duracion || '').match(/^(\d+):(\d{2})$/); if(m) seg += (+m[1]) * 60 + (+m[2]); });
    return {d:d, seg:seg};
  }).filter(function(x){ return x.seg > 0; }).sort(function(a, b){ return b.seg - a.seg; });
  var horas = duraciones.reduce(function(a, x){ return a + x.seg; }, 0) / 3600;
  var porLetra = {};
  ds.forEach(function(d){
    var L = (d.artista || '#').replace(/^(el|la|los|las|the|a|an)\s+/i, '').trim()[0];
    L = L ? L.toUpperCase() : '#';
    if(!/[A-Z]/.test(L)) L = '#';

  box.innerHTML =
    '<div id="curiosidad"></div>'
    + '<div class="wrapped" style="margin-bottom:18px">'

    + wcard(I.cal, 'Tu década', decaTop ? decaTop.k : '—', decaTop ? decaTop.v + ' discos de esa época' : '', 'linear-gradient(135deg,#0071e3,#30b0c7)')
    + wcard(I.disc, 'El más antiguo', masAntiguo ? masAntiguo['año'] : '—', masAntiguo ? masAntiguo.artista + ' · ' + masAntiguo.titulo : '', 'linear-gradient(135deg,#ff9500,#ffcc00)')
    + wcard(I.music, 'Canciones', temas, 'en ' + ds.length + ' discos', 'linear-gradient(135deg,#34c759,#00c7be)')
    + (masEscuchado && totalEscuchas(masEscuchado) ? wcard(I.playF, 'Más escuchado', masEscuchado.titulo, totalEscuchas(masEscuchado) + ' veces', 'linear-gradient(135deg,#5856d6,#0a84ff)') : '')
    + (totalEsc ? wcard(I.oreja, 'Escuchas registradas', totalEsc, (ds.length - nunca) + ' discos distintos', 'linear-gradient(135deg,#00c7be,#0071e3)') : '')
    + (gasto ? wcard(I.euro, 'Invertido', gasto.toFixed(0) + ' €', 'media de ' + (gasto / ds.length).toFixed(1) + ' € por disco', 'linear-gradient(135deg,#8e8e93,#48484a)') : '')
    + (horas > 1 ? wcard(I.clock, 'Música en casa', Math.round(horas) + ' h', 'seguidas, sin repetir disco', 'linear-gradient(135deg,#ff9500,#ff2d55)') : '')
    + (valorados.length ? wcard(I.estrella, 'Nota media', notaMedia.toFixed(1) + ' ★', valorados.length + ' discos valorados', 'linear-gradient(135deg,#ffb400,#ff7a00)') : '')
    + '</div>'
    + '<div class="kpis">'
    + kpi(I.layers, 'Discos', ds.length, 'var(--blue)')
    + kpi(I.user, 'Artistas', artistas.length, 'var(--pink)')

    err:['Error', 'var(--red)'], off:['Sin conexión', 'var(--txt3)']

  var est = estados[syncState] || estados.local;
  var pesoDatos = new Blob([JSON.stringify(DB.discos)]).size;
  var instalada = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  var ultimaCopia = (DB.historial || []).filter(function(x){ return /copia/i.test(x.tipo); }).pop();
  var diasCopia = ultimaCopia ? Math.floor((Date.now() - new Date(ultimaCopia.fecha).getTime()) / 86400000) : null;

  var seccion = function(icono, titulo, sub){
    return '<div class="secc"><div class="si">' + icono + '</div><div><h3>' + titulo + '</h3>'
      + (sub ? '<div class="ss">' + sub + '</div>' : '') + '</div></div>';

  box.innerHTML =
    /* ---- estado ---- */
    '<div class="estado ' + syncState + '">'
      + '<div class="ehd"><div class="epunto"></div><div class="etxt">'
      + '<div class="et">' + est[0] + '</div>'
      + '<div class="es">' + (configurado()
          ? esc(CFG.owner + '/' + CFG.repo) + ' › ' + esc(CFG.path)

      + '</div>' + (configurado()
          ? '<button class="btn sm" data-a="sync">' + I.refresh + 'Sincronizar</button>'
          : '<button class="btn pri sm" data-a="cfg">Conectar</button>') + '</div>'
      + '<div class="efilas">'
        + '<div><span>Discos</span><b>' + DB.discos.length + '</b></div>'
        + '<div><span>Última sincronía</span><b>' + (lastSync ? fdate(lastSync) : '—') + '</b></div>'
        + '<div><span>Último cambio</span><b>' + fdate(DB.actualizado) + '</b></div>'
        + '<div><span>Tamaño</span><b>' + bytes(pesoDatos) + '</b></div>'
      + '</div>'
      + (syncMsg ? '<div class="emsg">' + esc(syncMsg) + '</div>' : '')
      + (configurado() ? '<div class="epie"><a href="https://github.com/' + esc(CFG.owner) + '/' + esc(CFG.repo)
          + '/commits/' + esc(CFG.branch) + '/' + esc(CFG.path) + '" target="_blank" rel="noopener">'
          + I.clock + 'Ver el historial de cambios en GitHub</a>'
          + '<button class="lnk ext" data-a="cfg">' + I.key + 'Ajustes de sincronización</button></div>' : '')
    + '</div>'

    /* ---- apariencia ---- */
    + seccion(I.eye, 'Apariencia')
    + '<div class="card"><div class="fila"><div><div class="ft">Tema</div>'
      + '<div class="fs">Automático sigue lo que tengas puesto en el sistema</div></div>'
      + '<div class="seg" id="segTema">'
        + ['claro:Claro', 'oscuro:Oscuro', 'auto:Automático'].map(function(o){
            var q = o.split(':');
            return '<button data-t="' + q[0] + '"' + (tema === q[0] ? ' class="on"' : '') + '>' + q[1] + '</button>';
          }).join('')
      + '</div></div></div>'

    /* ---- copias ---- */
    + seccion(I.save, 'Copias de seguridad', diasCopia === null
        ? 'Aún no has descargado ninguna copia'
        : (diasCopia === 0 ? 'Última copia: hoy' : 'Última copia hace ' + diasCopia + (diasCopia === 1 ? ' día' : ' días')))
    + (diasCopia !== null && diasCopia > 30
        ? '<div class="warnb">' + I.warn + '<span>Hace más de un mes que no descargas una copia. '
          + 'Tus datos están en GitHub con su historial, pero una copia local no está de más.</span></div>' : '')
    + '<div class="dbact">'
      + accion(I.down, 'Descargar copia', 'Un JSON con toda la colección. En el iPhone se abre la hoja de compartir.', 'bak', '', 'Descargar')
      + accion(I.up, 'Restaurar copia', 'Fusiona un JSON exportado antes. Nunca borra lo que ya tienes.', 'impbak', '', 'Seleccionar JSON')
    + '</div>'

    /* ---- importar y exportar ---- */
    + seccion(I.layers, 'Importar y exportar')
    + '<div class="dbact">'
      + accion(I.down, 'Importar CSV de Discogs', 'Añade solo lo que falte: los repetidos se descartan y los dudosos te los pregunto.', 'csv', '', 'Seleccionar CSV')
      + accion(I.file, 'Exportar CSV', 'Con las columnas de Discogs más tus campos propios.', 'expcsv', '', 'Exportar')
    + '</div>'

    /* ---- herramientas ---- */
    + seccion(I.spark, 'Herramientas')
    + '<div class="dbact">'
      + accion(I.spark, 'Completar fichas', 'Busca carátula, tracklist, sello y género de lo que esté incompleto.', 'bulk', '', 'Completar')
      + accion(I.copy, 'Buscar repetidos', 'Revisa si hay fichas duplicadas del mismo disco y te deja fusionarlas.', 'dups', '', 'Revisar')
      + accion(I.print, 'Catálogo imprimible', 'Con portadas y agrupado por artista.', 'print', '', 'Generar')
      + accion(I.pin, 'Inventario por ubicación', 'Qué hay en cada estantería o caja.', 'inv', '', 'Generar')
      + accion(I.euro, 'Valor de la colección', 'Lo que valen tus discos según Discogs.', 'valor', '', 'Ver valor')
    + '</div>'

    /* ---- instalación ---- */
    + (instalada ? '' : seccion(I.cloud, 'Instalar en el iPhone')
      + '<div class="card"><div style="font-size:13.5px;line-height:1.6;color:var(--txt2)">'
      + 'Abre esta misma dirección en el iPhone, pulsa compartir y elige '
      + '<b style="color:var(--txt)">Añadir a pantalla de inicio</b>. La primera vez, entra en Sincronización '
      + 'y pega el mismo token que usas aquí.</div></div>')

    /* ---- zona delicada ---- */
    + '<details class="plega peligro" style="margin-top:24px"><summary>Zona delicada'
      + '<svg class="ic ch" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></summary>'
      + '<div class="cuerpo" style="padding:16px">'
      + '<div class="fila"><div><div class="ft">Desconectar este dispositivo</div>'
        + '<div class="fs">La colección se queda solo aquí y pasa a modo consulta.</div></div>'
        + '<button class="btn sm" data-a="cfg">Ajustes</button></div>'
      + '<div class="fila"><div><div class="ft" style="color:var(--red)">Vaciar la colección</div>'
        + '<div class="fs">Elimina los ' + DB.discos.length + ' discos. Si estás sincronizado, se propaga al resto de dispositivos.</div></div>'
        + '<button class="btn destr sm" id="wipe">' + I.trash + 'Vaciar</button></div>'
      + '</div></details>'
    + '<div class="pie-version">Discoteca · versión ' + VERSION + (instalada ? ' · instalada' : '') + '</div>';

  var on = function(a, fn){
    box.querySelectorAll('[data-a=' + a + ']').forEach(function(el){ el.onclick = fn; });
  };
  on('cfg', pantallaSync);
  on('sync', function(){ sincronizarAhora(); toast('Sincronizando…'); });
  on('bak', exportBackup);
  on('impbak', function(){ document.getElementById('fileBak').click(); });
  on('csv', function(){ document.getElementById('fileCsv').click(); });
  on('expcsv', exportarCsv);
  on('print', catalogoImprimible);
  on('inv', inventarioUbicaciones);
  on('valor', valorColeccion);
  on('bulk', function(){ setView('col'); bulkRun(); });
  on('dups', function(){
    var dups = dupSet();
    var n = Object.keys(dups).length;
    if(!n){ toast('No hay fichas repetidas'); return; }
    fType = 'dup';
    document.querySelectorAll('#segType button').forEach(function(x){ x.className = x.dataset.f === 'dup' ? 'on' : ''; });
    setView('col'); paintCol();
    toast(n + ' fichas repetidas · ábrelas para fusionarlas');
  });
  box.querySelectorAll('#segTema button').forEach(function(b){
    b.onclick = function(){
      aplicarTema(b.dataset.t);
      box.querySelectorAll('#segTema button').forEach(function(x){ x.className = x.dataset.t === b.dataset.t ? 'on' : ''; });
    };
  });
  var w = box.querySelector('#wipe');
  if(w) w.onclick = function(){
    if(confirm('¿Eliminar los ' + DB.discos.length + ' discos?')){
      guardarDeshacer(DB.discos.slice(), 'vaciar la colección');
      DB.discos = []; persist(); toast('Colección vaciada');
    }
  };
  montarAyudas(box);
}

/* ============================================================

   ============================================================ */
function montarEventos(){
  var byId = function(id){ return document.getElementById(id); };
  aplicarTema();
  if(window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if(mq.addEventListener) mq.addEventListener('change', function(){ if(temaActual() === 'auto') aplicarTema('auto'); });
  }
  montarAyudas(document);
  byId('btnAdd').onclick = function(){ openForm(null); };
  byId('btnAddMob').onclick = function(){ openForm(null); };
  byId('qClear').onclick = function(){
    byId('q').value = '';
    byId('searchw').classList.remove('lleno');
    paintCol();
  };
  byId('btnPal').onclick = abrirPaleta;
  byId('btnDice').onclick = discoAlAzar;
  byId('btnSel').onclick = function(){ modoSeleccion(!selMulti); };
  byId('btnScan').onclick = escanear;
  byId('fabScan').onclick = escanear;
  byId('logo').onclick = function(){ setView('col'); };
  byId('syncBadge').onclick = function(){ configurado() ? sincronizarAhora() : pantallaSync(); };
  byId('q').oninput = function(){
    byId('searchw').classList.toggle('lleno', !!byId('q').value);
    paintCol();
  };
  byId('sortBy').onchange = function(e){
    sortBy = e.target.value;
    if(sortBy === 'random') randomSeed = Date.now() % 99991;
    paintCol();
  };
  byId('selGroup').onchange = function(e){ grupo = e.target.value; paintCol(); };
  byId('fGenre').onchange = function(e){ fGen = e.target.value; paintCol(); };
  byId('segType').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#segType button').forEach(function(x){ x.className = ''; });
    b.className = 'on'; fType = b.dataset.f; paintCol();
  };
  byId('segMode').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#segMode button').forEach(function(x){ x.className = ''; });
    b.className = 'on'; modo = b.dataset.m; paintCol();
  };
  var tabClick = function(e){
    var b = e.target.closest('button[data-v]');
    if(b) setView(b.dataset.v);
  };
  byId('tabs').onclick = tabClick;
  byId('tabbar').onclick = tabClick;
  byId('fileCsv').onchange = function(e){ var f = e.target.files[0]; if(f) importCsv(f); e.target.value = ''; };
  byId('fileBak').onchange = function(e){ var f = e.target.files[0]; if(f) importBackup(f); e.target.value = ''; };

  var nav = byId('nav'), ultimoY = 0;
  window.addEventListener('scroll', function(){
    var y = window.scrollY || 0;
    if((y > 40) !== (ultimoY > 40)) nav.classList.toggle('shrink', y > 40);
    ultimoY = y;
  }, {passive:true});

  (function(){
    var ptr = byId('ptr'), y0 = null, dy = 0, tirando = false;
    document.addEventListener('touchstart', function(e){
      if(window.scrollY > 0 || document.querySelector('.scrim,.pal')) return;
      y0 = e.touches[0].clientY; dy = 0; tirando = true;
    }, {passive:true});
    document.addEventListener('touchmove', function(e){
      if(!tirando || y0 === null) return;
      dy = e.touches[0].clientY - y0;
      if(dy <= 0){ ptr.style.opacity = 0; return; }
      var p = Math.min(1, dy / 90);
      ptr.style.opacity = p;
      ptr.style.transform = 'translateX(-50%) scale(' + (.5 + p * .5) + ') rotate(' + (dy * 2.2) + 'deg)';
    }, {passive:true});
    document.addEventListener('touchend', function(){
      if(!tirando) return;
      tirando = false;
      if(dy > 85){
        ptr.classList.add('girando');
        ptr.style.opacity = 1;
        ptr.style.transform = 'translateX(-50%) scale(1)';
        var fin = function(){
          ptr.classList.remove('girando');
          ptr.style.opacity = 0;
          ptr.style.transform = 'translateX(-50%) scale(.5)';
        };
        if(configurado()) pull().then(fin, fin);
        else setTimeout(function(){ renderAll(); fin(); }, 450);
      }else{
        ptr.style.opacity = 0;
        ptr.style.transform = 'translateX(-50%) scale(.5)';
      }
      y0 = null; dy = 0;
    });
  })();

  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && configurado() && Date.now() - ultimoPull > 20000) pull(true);
  });
  window.addEventListener('online', function(){ if(configurado()) sincronizarAhora(); });
  window.addEventListener('offline', function(){ marcar('off'); });
  window.addEventListener('beforeunload', function(e){
    if(syncState === 'pend' && configurado()){ e.preventDefault(); e.returnValue = ''; }
  });
  setInterval(function(){
    if(configurado() && !document.hidden && navigator.onLine && Date.now() - ultimoPull > 300000) pull(true);
  }, 60000);

  document.addEventListener('keydown', function(e){
    var enCampo = /input|textarea|select/i.test((e.target.tagName || ''));
    if((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); sincronizarAhora(); return; }
    if((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); abrirPaleta(); return; }
    if(enCampo || document.querySelector('.scrim') || document.querySelector('.pal')) return;
    if(e.key === '/'){ e.preventDefault(); document.getElementById('q').focus(); }
    else if(e.key === 'n'){ e.preventDefault(); openForm(null); }
    else if(e.key === 'r'){ e.preventDefault(); discoAlAzar(); }
    else if(e.key === '1'){ setView('col'); }
    else if(e.key === '2'){ setView('wish'); }
    else if(e.key === '3'){ setView('stats'); }
    else if(e.key === '4'){ setView('db'); }
  });
  document.body.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.body.addEventListener('drop', function(e){
    e.preventDefault();
    var f = e.dataTransfer.files[0];
    if(!f) return;
    if(/\.csv$/i.test(f.name)) importCsv(f);
    else if(/\.json$/i.test(f.name)) importBackup(f);
  });
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    var recargado = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(recargado) return;
      recargado = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.waiting) reg.waiting.postMessage('saltar');
      reg.addEventListener('updatefound', function(){
        var nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener('statechange', function(){
          if(nuevo.state === 'installed' && navigator.serviceWorker.controller) nuevo.postMessage('saltar');
        });
      });
      setInterval(function(){ reg.update().catch(function(){}); }, 900000);
    }).catch(function(){});
  }
}

boot();


</script>
</body>
</html>
