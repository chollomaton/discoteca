<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="Catálogo personal de vinilos y CDs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discoteca">
<title>Discoteca</title>

<style>
:root{
  --blue:#0071e3; --blue-h:#0077ed; --blue-s:rgba(0,113,227,.10);
  --bg:#f5f5f7; --elev:#fff; --sunk:#fbfbfd; --glass:rgba(245,245,247,.82);
  --sep:rgba(0,0,0,.08); --sep2:rgba(0,0,0,.14);
  --txt:#1d1d1f; --txt2:#6e6e73; --txt3:#a1a1a6;
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20);
  --red:#ff3b30; --green:#34c759; --orange:#ff9500; --purple:#af52de;
  --teal:#30b0c7; --pink:#ff2d55; --indigo:#5856d6; --yellow:#ffcc00; --mint:#00c7be;
  --vinilo:#af52de; --cd:#30b0c7;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px;
  --sh1:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.05);
  --sh2:0 4px 16px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04);
  --sh3:0 12px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  --sh4:0 30px 90px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.06);
  --ease:cubic-bezier(.32,.72,0,1);
  --nav-h:60px; --tabbar-h:0px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --blue:#0a84ff; --blue-h:#409cff; --blue-s:rgba(10,132,255,.18);
    --bg:#000; --elev:#1c1c1e; --sunk:#141416; --glass:rgba(0,0,0,.76);
    --sep:rgba(255,255,255,.10); --sep2:rgba(255,255,255,.18);
    --txt:#f5f5f7; --txt2:#98989d; --txt3:#6e6e73;
    --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.38);
    --vinilo:#bf5af2; --cd:#40c8e0;
    --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 4px 18px rgba(0,0,0,.55);
    --sh3:0 14px 44px rgba(0,0,0,.65); --sh4:0 30px 90px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.011em;overflow-x:hidden;overscroll-behavior-y:none}
body.ro .hide-ro{display:none !important}
::selection{background:var(--blue-s)}
.ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font-family:inherit}
.only-mob{display:none !important}

/* ---------- barra superior ---------- */
.nav{position:sticky;top:0;z-index:40;background:var(--glass);padding-top:var(--sat);
  backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--sep)}
.nav-in{max-width:1320px;margin:0 auto;padding:10px max(22px,var(--sar)) 10px max(22px,var(--sal));
  display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer}
.logo .disc{width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative;box-shadow:var(--sh1);
  background:conic-gradient(from 210deg,#3a3a3c,#1d1d1f,#48484a,#1d1d1f,#3a3a3c);transition:transform .3s var(--ease)}
.logo:active .disc{transform:scale(.9)}
.logo .disc::before{content:'';position:absolute;inset:11px;border-radius:50%;background:var(--blue)}
.logo .disc::after{content:'';position:absolute;inset:14.5px;border-radius:50%;background:var(--elev)}
.logo h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.02em;transition:font-size .25s var(--ease)}
.logo .cnt{font-size:12.5px;color:var(--txt2);margin-top:-1px}
.tabs{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.tabs button{border:none;background:transparent;font-size:13.5px;font-weight:500;color:var(--txt);padding:6px 13px;border-radius:7px;
  cursor:pointer;transition:background .18s var(--ease),box-shadow .18s;display:flex;align-items:center;gap:6px}
.tabs button.on{background:var(--elev);box-shadow:var(--sh1)}
.tabs .ic{width:14px;height:14px}

.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:550;padding:6px 12px;border-radius:999px;
  cursor:pointer;border:none;background:var(--fill);color:var(--txt2);transition:background .2s,transform .1s}
.sync:hover{background:var(--fill2)}
.sync:active{transform:scale(.95)}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.sync.pend .dot{background:var(--orange);animation:pulse 1.8s infinite}
.sync.busy .dot{background:var(--blue);animation:pulse .9s infinite}
.sync.err{background:rgba(255,59,48,.14);color:var(--red)}
.sync.err .dot{background:var(--red)}
.sync.off .dot{background:var(--txt3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes spin{to{transform:rotate(360deg)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;letter-spacing:-.01em;
  padding:8px 15px;border-radius:980px;cursor:pointer;border:none;background:var(--fill);color:var(--txt);
  transition:background .2s var(--ease),transform .12s var(--ease),opacity .2s}
.btn:hover{background:var(--fill2)}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-h)}
.btn.ok{background:var(--green);color:#fff}
.btn.destr{background:transparent;color:var(--red)}.btn.destr:hover{background:rgba(255,59,48,.12)}
.btn.sm{font-size:13px;padding:6px 12px}
.btn.xs{font-size:12px;padding:5px 10px}
.btn.wide{width:100%;padding:13px;font-size:15.5px}
.btn.icon{padding:8px;width:36px;height:36px;border-radius:50%}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.rowb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btncerrar{display:none}

.page{max-width:1320px;margin:0 auto;padding:22px max(22px,var(--sar)) calc(120px + var(--sab)) max(22px,var(--sal))}
.view{display:none}.view.on{display:block;animation:fadeup .3s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--elev);border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--sh1);display:flex;align-items:center;gap:12px;min-width:0}
.kpi .lbl{font-size:12.5px;color:var(--txt2);font-weight:500;display:flex;align-items:center;gap:5px}
.kpi .lbl .ic{width:13px;height:13px}
.kpi .val{font-size:24px;font-weight:600;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}

.resumen{display:none;background:var(--elev);border-radius:var(--r-md);box-shadow:var(--sh1);padding:11px 4px;margin-bottom:14px}
.resumen div{flex:1;text-align:center;position:relative;min-width:0}
.resumen div+div::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);height:26px;width:.5px;background:var(--sep)}
.resumen .v{font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.resumen .k{font-size:11px;color:var(--txt2);margin-top:2px}
.resumen .v.vin{color:var(--vinilo)}
.resumen .v.cd{color:var(--cd)}

.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;background:var(--elev);
  border-radius:var(--r-md);padding:13px 16px;margin-bottom:16px;box-shadow:var(--sh1);border-left:3px solid var(--blue)}
.banner.warn{border-left-color:var(--orange)}
.banner .t{font-size:14.5px;font-weight:550}
.banner .s{font-size:12.5px;color:var(--txt2);margin-top:2px;max-width:52ch;overflow:hidden;text-overflow:ellipsis}
.bar{width:160px;height:5px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar>div{height:100%;background:var(--blue);border-radius:99px;transition:width .35s var(--ease)}

/* ---------- controles ---------- */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.searchw{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 12px;height:38px;
  transition:box-shadow .2s,background .2s}
.searchw:focus-within{background:var(--elev);box-shadow:0 0 0 2px var(--blue)}
.searchw .ic{color:var(--txt3);width:15px;height:15px}
.searchw input{flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14.5px;color:var(--txt);min-width:0}
.searchw input::placeholder{color:var(--txt3)}
.searchw .clr{border:none;background:var(--fill2);color:var(--txt2);width:19px;height:19px;border-radius:50%;display:none;
  align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.searchw.lleno .clr{display:flex}
.searchw .clr .ic{width:10px;height:10px;stroke-width:3;color:inherit}

.filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;height:38px;align-items:center}
.seg button{border:none;background:transparent;font-size:13.5px;font-weight:500;color:var(--txt2);padding:0 12px;height:34px;border-radius:8px;cursor:pointer;
  transition:background .18s var(--ease),box-shadow .18s,color .18s,transform .1s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button:active{transform:scale(.95)}
.seg button.on{background:var(--elev);box-shadow:var(--sh1);color:var(--txt)}
.seg .ic{width:15px;height:15px}

.selw{position:relative;display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:10px;height:38px;
  padding:0 30px 0 12px;cursor:pointer;transition:background .2s;max-width:100%}
.selw:hover{background:var(--fill2)}
.selw .sl{font-size:11.5px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.03em;flex-shrink:0;pointer-events:none}
.selw select{appearance:none;-webkit-appearance:none;font-family:inherit;font-size:13.5px;font-weight:550;color:var(--txt);
  background:transparent;border:none;padding:0;cursor:pointer;outline:none;max-width:170px;text-overflow:ellipsis}
.selw .cv{position:absolute;right:10px;pointer-events:none;width:13px;height:13px;color:var(--txt2)}
.chipf{display:inline-flex;align-items:center;gap:6px;background:var(--blue-s);color:var(--blue);font-size:13px;font-weight:550;
  padding:0 10px 0 13px;height:38px;border-radius:999px}
.chipf button{border:none;background:transparent;color:inherit;cursor:pointer;display:flex;padding:0;align-items:center}
.chipf .ic{width:14px;height:14px;stroke-width:2.4}

/* ---------- rejilla ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:26px 18px}
.tile{cursor:pointer;position:relative;min-width:0}
.art{position:relative;width:100%;aspect-ratio:1/1;border-radius:var(--r-sm);overflow:hidden;background:var(--fill);
  box-shadow:var(--sh2);transition:transform .32s var(--ease),box-shadow .32s var(--ease);display:flex;align-items:center;justify-content:center}
.tile:hover .art{transform:translateY(-5px) scale(1.018);box-shadow:var(--sh3)}
.tile:active .art{transform:scale(.97)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .ph{width:46%;height:46%;color:var(--txt3);stroke-width:1.3}
.badge{position:absolute;top:8px;left:8px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);
  box-shadow:0 1px 5px rgba(0,0,0,.26)}
.badge.vin .ic{width:23px;height:23px}
.badge.cd .ic{width:17px;height:17px}
.badge .vinilo-out{stroke:#15151a}
.badge .vinilo-lab{fill:#15151a}
.badge .cd-out{stroke:#8b98a8}
.badge .cd-sh{stroke:#c3ccd6}
.pill{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:4px 8px;border-radius:99px;color:#fff}
.pill.dup{background:rgba(255,149,0,.95)}
.pill.low{background:rgba(255,59,48,.95)}
.pill.lend{top:auto;bottom:8px;left:8px;right:auto;background:rgba(88,86,214,.95);font-size:9px}
.magic{position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(28,28,30,.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:#fff;opacity:0;transform:scale(.85);transition:opacity .22s var(--ease),transform .18s var(--ease),background .2s}
.tile:hover .magic{opacity:1;transform:scale(1)}
.magic:hover{background:var(--blue)}
.magic:active{transform:scale(.88)}
.magic .ic{width:15px;height:15px}
.magic.busy .ic{animation:spin 1s linear infinite}
.oir{position:absolute;bottom:8px;right:46px;width:30px;height:30px;border-radius:50%;background:rgba(28,28,30,.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:#fff;opacity:0;transform:scale(.85);transition:opacity .22s var(--ease),transform .18s var(--ease),background .2s}
.tile:hover .oir{opacity:1;transform:scale(1)}
.oir:hover{background:var(--green)}
.oir:active{transform:scale(.88)}
.oir .ic{width:14px;height:14px}
.oir.hoy{background:var(--green);opacity:1;transform:none}
.meta{padding:9px 3px 0;min-width:0}
.meta .t{font-size:13.5px;font-weight:550;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .a{font-size:13px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.meta .y{font-size:11.5px;color:var(--txt3);margin-top:3px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stars{display:inline-flex;gap:2px;align-items:center}
.stars .st{width:15px;height:15px;color:var(--txt3);cursor:default;flex-shrink:0}
.stars .st.on{color:#ffb400}
.stars.big .st{width:30px;height:30px;cursor:pointer;transition:transform .12s var(--ease)}
.stars.big .st:hover{transform:scale(1.18)}
.stars.big .st:active{transform:scale(.94)}
.starbox{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:16px}
.starbox .lbl{font-size:11.5px;color:var(--txt3);font-weight:550;min-height:14px}
.tile .stars{margin-top:3px}
.tile .stars .st{width:11px;height:11px}

/* ---------- lista ---------- */
.lista{background:var(--elev);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh1)}
.lrow{display:flex;align-items:center;gap:13px;padding:9px 14px;border-bottom:.5px solid var(--sep);cursor:pointer;transition:background .14s}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--fill)}
.lrow:active{background:var(--fill2)}
.lrow .mini{width:44px;height:44px;border-radius:7px;background:var(--fill);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lrow .mini .ic{width:20px;height:20px;color:var(--txt3)}
.lrow .mini img{width:100%;height:100%;object-fit:cover}
.lrow .c1{flex:1;min-width:0}
.lrow .c1 .t{font-size:14.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .c1 .a{font-size:12.8px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .c2{width:150px;font-size:12.8px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;flex-shrink:0}
.lrow .c3{width:52px;font-size:12.8px;color:var(--txt3);text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
.lrow .c4{width:78px;text-align:right;flex-shrink:0}
.sop{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px}
.sop.vin{background:rgba(175,82,222,.15);color:#8944ab}
.sop.cd{background:rgba(48,176,199,.16);color:#1d7f92}
.sop .ic{width:12px;height:12px}

/* ---------- estantería ---------- */
.shelfwrap{background:linear-gradient(180deg,var(--sunk),var(--elev));border-radius:var(--r-md);padding:20px 18px 12px;box-shadow:var(--sh1);margin-bottom:18px;overflow:hidden}
.shelf{display:flex;gap:3px;align-items:flex-end;flex-wrap:wrap;row-gap:26px}
.spine{width:19px;height:158px;border-radius:2px 3px 3px 2px;cursor:pointer;position:relative;flex-shrink:0;
  box-shadow:1px 1px 3px rgba(0,0,0,.28), inset -2px 0 4px rgba(0,0,0,.22), inset 2px 0 3px rgba(255,255,255,.14);
  transition:transform .2s var(--ease),box-shadow .2s;display:flex;align-items:center;justify-content:center;overflow:hidden}
.spine.cd{height:112px;width:12px}
.spine:hover{transform:translateY(-12px) rotate(-1.2deg);box-shadow:0 8px 20px rgba(0,0,0,.32)}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;font-weight:600;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:96%;padding:6px 0;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.shelf-base{height:9px;background:linear-gradient(180deg,rgba(0,0,0,.16),transparent);border-radius:3px;margin-top:10px}

/* ---------- agrupación ---------- */
.gsec{margin-bottom:34px;scroll-margin-top:calc(var(--nav-h) + var(--sat) + 14px)}
.ghead{display:flex;align-items:center;gap:12px;position:sticky;top:calc(var(--nav-h) + var(--sat));z-index:12;padding:9px 2px;margin-bottom:12px;
  background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.ghead .gav{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--fill);flex-shrink:0}
.ghead h3{font-size:19px;font-weight:600;margin:0;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead .n{font-size:13px;color:var(--txt3);font-weight:500;font-variant-numeric:tabular-nums}
.ghead .gbtn{opacity:0;transition:opacity .18s}
.gsec:hover .ghead .gbtn{opacity:1}

/* ---------- índice A-Z ---------- */
.azbar{position:fixed;right:calc(10px + var(--sar));top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;
  gap:2px;background:var(--glass);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  padding:10px 5px;border-radius:999px;box-shadow:var(--sh2)}
.azbar button{border:none;background:transparent;color:var(--txt2);font-size:11.5px;font-weight:700;line-height:1;
  width:22px;height:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;
  transition:background .15s,color .15s,transform .15s}
.azbar button:hover{background:var(--blue);color:#fff;transform:scale(1.25)}
.azbar button:active{transform:scale(1.05)}
.azbar button:disabled{opacity:.3;cursor:default;background:transparent;color:var(--txt3);transform:none}

.blank{text-align:center;padding:80px 20px;color:var(--txt2)}
.blank .ic{width:44px;height:44px;color:var(--txt3);stroke-width:1.2;margin-bottom:14px}
.blank h3{font-size:19px;font-weight:600;color:var(--txt);margin:0 0 5px}
.blank p{font-size:14.5px;margin:0}

/* ---------- tarjetas y gráficos ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{background:var(--elev);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh1);min-width:0}
.card h3{font-size:16px;font-weight:600;margin:0 0 2px;letter-spacing:-.015em}
.card .sub{font-size:12.5px;color:var(--txt2);margin-bottom:16px}
.card.full{grid-column:1/-1}
.legend{display:flex;flex-wrap:wrap;gap:9px 16px;margin-top:12px}
.lg{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt2)}
.lg i{width:9px;height:9px;border-radius:3px;display:block;flex-shrink:0}
.lg b{color:var(--txt);font-weight:550;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:flex;flex-direction:column;gap:5px}
.hb .top{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.hb .top .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .top .v{color:var(--txt2);font-variant-numeric:tabular-nums;flex-shrink:0}
.hb .track{height:7px;border-radius:99px;background:var(--fill);overflow:hidden}
.hb .track>span{display:block;height:100%;border-radius:99px;transition:width .8s var(--ease)}
.hb.click{cursor:pointer}.hb.click:hover .top .n{color:var(--blue)}
.chartwrap{width:100%;overflow:hidden}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:inherit;fill:var(--txt2);font-size:11px}
svg.chart .axis{stroke:var(--sep);stroke-width:1}
.ringwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}

.wrapped{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.wcard{border-radius:var(--r-lg);padding:18px;color:#fff;position:relative;overflow:hidden;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.wcard .k{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.82}
.wcard .v{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.12;margin-top:5px;overflow:hidden;text-overflow:ellipsis}
.wcard .s{font-size:12.5px;opacity:.86;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard .bgic{position:absolute;top:-14px;right:-14px;width:92px;height:92px;opacity:.17;stroke-width:1.1}
.worldmap{position:relative;width:100%}
.worldmap svg{width:100%;height:auto;display:block}
.mapdot{cursor:pointer}

/* ---------- hojas ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:42px 18px;animation:fade .22s var(--ease);
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--elev);border-radius:var(--r-xl);width:100%;max-width:620px;box-shadow:var(--sh4);animation:rise .38s var(--ease);
  overflow:hidden;margin-bottom:42px}
.sheet.wide{max-width:860px}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
.grabber{display:none}
.sheet-hd{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;
  border-bottom:.5px solid var(--sep);background:var(--elev)}
.sheet-hd h2{font-size:16.5px;font-weight:600;margin:0;letter-spacing:-.015em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{width:30px;height:30px;border-radius:50%;border:none;background:var(--fill);color:var(--txt2);cursor:pointer;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;transition:background .18s,transform .1s}
.xbtn:hover{background:var(--fill2)}
.xbtn:active{transform:scale(.9)}
.xbtn .ic{width:14px;height:14px;stroke-width:2.4}
.sheet-bd{padding:20px}
.sheet-ft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 20px;border-top:.5px solid var(--sep);background:var(--sunk);flex-wrap:wrap}

.group{background:var(--sunk);border-radius:var(--r-sm);overflow:hidden;margin-bottom:15px;box-shadow:0 0 0 .5px var(--sep)}
.grow{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:48px;border-bottom:.5px solid var(--sep)}
.grow:last-child{border-bottom:none}
.grow>label{font-size:14.5px;color:var(--txt2);width:110px;flex-shrink:0}
.grow input,.grow select,.grow textarea{flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14.5px;
  color:var(--txt);padding:12px 0;min-width:0;text-align:right}
.grow select{appearance:none;-webkit-appearance:none;text-align-last:right;cursor:pointer;padding-right:16px}
.grow .cv{width:12px;height:12px;color:var(--txt3);margin-left:-14px;pointer-events:none}
.grow input::placeholder,.grow textarea::placeholder{color:var(--txt3)}
.grow textarea{resize:vertical;min-height:62px;text-align:left;line-height:1.5}
.grow.col{flex-direction:column;align-items:stretch;gap:0;padding:4px 14px 10px}
.grow.col>label{width:auto;padding-top:9px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;color:var(--txt3)}
.grow.col input,.grow.col textarea{text-align:left}

.segtype{display:flex;gap:2px;background:var(--fill);border-radius:10px;padding:2px;margin-bottom:15px}
.segtype button{flex:1;border:none;background:transparent;font-size:14.5px;font-weight:500;color:var(--txt2);padding:10px;border-radius:8px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .18s var(--ease),box-shadow .18s,color .18s}
.segtype button.on{background:var(--elev);box-shadow:var(--sh1);color:var(--txt)}
.segtype .ic{width:16px;height:16px}

.aicard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--blue-s);margin-bottom:12px}
.aicard .ic{width:19px;height:19px;color:var(--blue)}
.aicard .txt{flex:1;font-size:12.7px;color:var(--txt2);line-height:1.42}
.aicard .txt b{color:var(--txt);font-weight:600}
.note{font-size:12.5px;font-weight:500;margin-top:8px;text-align:center}
.note.ok{color:var(--green)}.note.err{color:var(--red)}.note.busy{color:var(--txt2)}
.warnb{display:flex;gap:9px;align-items:flex-start;background:rgba(255,149,0,.13);color:var(--txt);font-size:13.2px;padding:11px 13px;
  border-radius:var(--r-sm);margin-bottom:14px;line-height:1.4}
.warnb .ic{width:16px;height:16px;color:var(--orange);margin-top:1px;flex-shrink:0}
.warnb.info{background:var(--blue-s)}
.warnb.info .ic{color:var(--blue)}

.covrow{display:flex;gap:14px;align-items:flex-start;margin-bottom:15px}
.covbox{width:96px;height:96px;border-radius:var(--r-sm);background:var(--fill);flex-shrink:0;overflow:hidden;display:flex;
  align-items:center;justify-content:center;box-shadow:var(--sh1)}
.covbox img{width:100%;height:100%;object-fit:cover}
.covbox .ph{width:44%;height:44%;color:var(--txt3);stroke-width:1.3}

/* ---------- ficha ---------- */
.dhero{position:relative;padding:26px 22px 20px;text-align:center;border-bottom:.5px solid var(--sep);overflow:hidden}
.dhero::before{content:'';position:absolute;inset:0;background:var(--herobg,var(--sunk));z-index:0}
.dhero>*{position:relative;z-index:1}
.dhero .cov{width:210px;height:210px;margin:0 auto 18px;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh3);background:var(--fill);
  display:flex;align-items:center;justify-content:center;cursor:zoom-in;transition:transform .25s var(--ease)}
.dhero .cov:active{transform:scale(.97)}
.dhero .cov img{width:100%;height:100%;object-fit:cover}
.dhero .cov .ph{width:42%;height:42%;color:var(--txt3);stroke-width:1.3}
.dhero h3{font-size:23px;font-weight:700;margin:0;letter-spacing:-.026em;line-height:1.2}
.dhero .art2{font-size:16.5px;color:var(--blue);margin-top:4px;font-weight:550;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.dhero .art2 .ic{width:13px;height:13px;stroke-width:2.4}
.dhero .tags{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tag{font-size:12px;font-weight:550;padding:6px 12px;border-radius:99px;background:var(--fill);color:var(--txt2);border:none}
.tag.acc{background:var(--blue-s);color:var(--blue)}
.tag.grn{background:rgba(52,199,89,.16);color:var(--green)}
.tag.wrn{background:rgba(255,149,0,.18);color:#a05a00}
.tag.pur{background:rgba(175,82,222,.16);color:var(--purple)}
.tag.usr{background:var(--fill2);color:var(--txt);cursor:pointer}
.tag.vin{background:rgba(175,82,222,.16);color:#8944ab}
.tag.cd{background:rgba(48,176,199,.18);color:#1d7f92}
.linkrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.lnk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:550;padding:10px 15px;border-radius:999px;
  background:var(--fill);color:var(--txt);text-decoration:none;transition:background .18s,transform .12s;border:none;cursor:pointer}
.lnk:hover{background:var(--fill2)}
.lnk:active{transform:scale(.95)}
.lnk .ic{width:15px;height:15px}
.lnk.hecho{background:rgba(52,199,89,.18);color:var(--green)}

.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));background:var(--sunk);border-radius:var(--r-sm);
  overflow:hidden;box-shadow:0 0 0 .5px var(--sep);margin-bottom:18px}
.spec{padding:11px 13px;border-right:.5px solid var(--sep);border-bottom:.5px solid var(--sep);min-width:0}
.spec .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.045em;color:var(--txt3);font-weight:600}
.spec .v{font-size:14px;margin-top:3px;font-weight:500;word-break:break-word}

.tl-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 3px;gap:8px}
.tl-hd h4{font-size:16px;font-weight:600;margin:0;letter-spacing:-.012em}
.tl-hd .n{font-size:12.5px;color:var(--txt3);font-weight:450;margin-left:7px}
.tl{background:var(--sunk);border-radius:var(--r-sm);overflow:hidden;box-shadow:0 0 0 .5px var(--sep)}
.trk{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:.5px solid var(--sep);transition:background .15s}
.trk:last-child{border-bottom:none}
.trk:hover{background:var(--fill)}
.trk .num{font-size:13px;color:var(--txt3);width:20px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0;font-weight:500}
.trk .play{width:30px;height:30px;border-radius:50%;border:none;background:var(--fill2);color:var(--txt);cursor:pointer;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:background .18s,transform .12s}
.trk .play:hover{background:var(--blue);color:#fff}
.trk .play:active{transform:scale(.9)}
.trk .play .ic{width:12px;height:12px;fill:currentColor;stroke:none}
.trk .play.on{background:var(--blue);color:#fff}
.trk .nm{flex:1;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .dur{font-size:13px;color:var(--txt3);font-variant-numeric:tabular-nums;flex-shrink:0}
.trk input{border:none;background:transparent;outline:none;font-family:inherit;font-size:14.5px;color:var(--txt);width:100%;padding:2px 0}
.trk input.d{width:58px;text-align:right;font-size:13px;color:var(--txt2);font-variant-numeric:tabular-nums}
.trk .del{width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--red);cursor:pointer;display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
.trk .del:hover{background:rgba(255,59,48,.14)}
.trk .del .ic{width:15px;height:15px}
.trk.playing{background:var(--blue-s)}
.tl-empty{padding:22px 15px;text-align:center;font-size:14px;color:var(--txt3)}
.tl-add{width:100%;border:none;background:transparent;color:var(--blue);font-size:14.5px;font-weight:500;padding:13px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;border-top:.5px solid var(--sep)}
.tl-add:hover{background:var(--blue-s)}
.iconbtn{width:34px;height:34px;border-radius:50%;border:none;background:var(--fill);color:var(--txt2);cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:background .18s,color .18s,transform .12s;flex-shrink:0}
.iconbtn:hover{background:var(--fill2);color:var(--txt)}
.iconbtn:active{transform:scale(.9)}
.iconbtn.on{background:var(--blue);color:#fff}
.iconbtn .ic{width:16px;height:16px}

.lyr{width:26px;height:26px;border-radius:50%;border:none;background:transparent;color:var(--txt3);cursor:pointer;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;transition:background .16s,color .16s;text-decoration:none}
.lyr:hover{background:var(--fill2);color:var(--txt)}
.lyr .ic{width:14px;height:14px}
.trk .dur{min-width:34px;text-align:right}

.creds{background:var(--sunk);border-radius:var(--r-sm);box-shadow:0 0 0 .5px var(--sep);overflow:hidden;margin-bottom:18px}
.cred{display:flex;justify-content:space-between;gap:14px;padding:10px 14px;border-bottom:.5px solid var(--sep);font-size:13.5px}
.cred:last-child{border-bottom:none}
.cred .k{color:var(--txt2);flex-shrink:0}
.cred .v{text-align:right;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}

.tip{display:flex;gap:13px;align-items:flex-start;background:linear-gradient(120deg,rgba(0,113,227,.10),rgba(175,82,222,.10));
  border-radius:var(--r-lg);padding:16px 18px;margin-bottom:18px;position:relative;overflow:hidden}
.tip .bulb{width:34px;height:34px;border-radius:50%;background:var(--elev);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:var(--sh1)}
.tip .bulb .ic{width:18px;height:18px;color:var(--orange)}
.tip .tx{flex:1;min-width:0}
.tip .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--txt3)}
.tip .v{font-size:15px;line-height:1.45;margin-top:3px;font-weight:500}
.tip .v b{font-weight:700}
.tip .otro{border:none;background:var(--elev);color:var(--txt2);width:32px;height:32px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--sh1);transition:transform .2s}
.tip .otro:hover{transform:rotate(90deg)}
.tip .otro .ic{width:15px;height:15px}

.wiki{font-size:14.8px;line-height:1.62;color:var(--txt)}
.wiki p{margin:0 0 13px}
.wiki .fuente{font-size:12px;color:var(--txt3);margin-top:16px;padding-top:12px;border-top:.5px solid var(--sep)}
.wiki .fuente a{color:var(--blue);text-decoration:none}
.wikihd{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.wikihd img{width:74px;height:74px;border-radius:12px;object-fit:cover;background:var(--fill);flex-shrink:0}
.wikihd .n{font-size:19px;font-weight:650;letter-spacing:-.02em}
.wikihd .d{font-size:13px;color:var(--txt2);margin-top:2px}

.gotit{position:absolute;bottom:8px;left:8px;right:8px;border:none;border-radius:999px;background:rgba(52,199,89,.94);color:#fff;
  font-size:12.5px;font-weight:600;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  backdrop-filter:blur(10px);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.tile:hover .gotit{opacity:1;transform:none}
.gotit .ic{width:14px;height:14px}

/* ---------- candidatos e importación ---------- */
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:13px}
.cand{cursor:pointer;border-radius:var(--r-sm);overflow:hidden;background:var(--sunk);box-shadow:0 0 0 .5px var(--sep);transition:transform .2s var(--ease),box-shadow .2s;min-width:0}
.cand:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.cand:active{transform:scale(.97)}
.cand .cimg{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--fill);display:block}
.cand .cinf{padding:8px 10px 10px}
.cand .cinf .t{font-size:12.8px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .cinf .s{font-size:11.5px;color:var(--txt2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.vsc{background:var(--sunk);border-radius:var(--r-sm);padding:13px;box-shadow:0 0 0 .5px var(--sep);min-width:0}
.vsc.win{box-shadow:0 0 0 2px var(--blue)}
.vsc .h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--txt3);margin-bottom:9px}
.vsc .f{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-bottom:.5px solid var(--sep)}
.vsc .f:last-child{border-bottom:none}
.vsc .f .k{color:var(--txt3);flex-shrink:0}
.vsc .f .v{text-align:right;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsc .f.dif .v{color:var(--orange)}
.impbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:13.5px;color:var(--txt2)}

/* ---------- lightbox / paleta ---------- */
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;
  cursor:zoom-out;animation:fade .2s var(--ease);padding:24px}
.lightbox img{max-width:min(92vw,860px);max-height:88vh;border-radius:var(--r-md);box-shadow:0 30px 90px rgba(0,0,0,.7)}
.pal{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.34);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;padding:12vh 18px;animation:fade .16s var(--ease)}
.palbox{width:100%;max-width:600px;background:var(--elev);border-radius:var(--r-lg);box-shadow:var(--sh4);overflow:hidden;animation:rise .3s var(--ease)}
.palin{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:.5px solid var(--sep)}
.palin .ic{width:18px;height:18px;color:var(--txt3)}
.palin input{flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:17px;color:var(--txt)}
.palres{max-height:52vh;overflow-y:auto}
.palrow{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
.palrow.sel{background:var(--blue-s)}
.palrow img,.palrow .phb{width:38px;height:38px;border-radius:7px;object-fit:cover;background:var(--fill);flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.palrow .txt{flex:1;min-width:0}
.palrow .t{font-size:14.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palrow .s{font-size:12.5px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palrow .k{font-size:11px;color:var(--txt3);background:var(--fill);padding:3px 7px;border-radius:5px;flex-shrink:0}
.palhint{padding:9px 16px;font-size:11.5px;color:var(--txt3);border-top:.5px solid var(--sep);display:flex;gap:14px;flex-wrap:wrap}

/* ---------- archivo ---------- */
.dbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(226px,1fr));gap:12px;margin-bottom:16px}
.dbact{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:12px}
.act{background:var(--elev);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:8px;min-width:0}
.act .hd{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600}
.act .hd .ic{width:16px;height:16px;color:var(--blue)}
.act p{font-size:12.8px;color:var(--txt2);margin:0;line-height:1.45;flex:1}
.tipbox{background:var(--blue-s);border-radius:var(--r-md);padding:15px 17px;font-size:13.5px;line-height:1.55;color:var(--txt2);margin-bottom:16px}
.tipbox b{color:var(--txt)}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:.5px solid var(--sep);font-size:13.5px}
.hrow:last-child{border-bottom:none}

.toast{position:fixed;bottom:calc(24px + var(--sab) + var(--tabbar-h));left:50%;transform:translateX(-50%);z-index:200;
  background:rgba(28,28,30,.94);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  color:#fff;padding:12px 19px;border-radius:999px;font-size:14px;display:flex;align-items:center;gap:9px;box-shadow:var(--sh3);

.scanbox i:nth-child(3){bottom:-2px;left:-2px;border-right:none;border-top:none;border-radius:0 0 0 12px}
.scanbox i:nth-child(4){bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 12px 0}
.scanline{position:absolute;left:14%;right:14%;height:2px;background:var(--red);box-shadow:0 0 10px var(--red);animation:scanmove 2.2s ease-in-out infinite}

.ptr{position:fixed;top:calc(var(--sat) + 8px);left:50%;transform:translateX(-50%) scale(.5);z-index:50;width:34px;height:34px;

   2. UTILIDADES
   ============================================================ */
function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function nowISO(){ return new Date().toISOString(); }
function fdate(iso){
  if(!iso) return '—';
  try{ return new Date(iso).toLocaleString('es-ES', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}); }
  catch(e){ return iso; }
}
function fhora(iso){ try{ return new Date(iso).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}); }catch(e){ return ''; } }
function key(d){ return (d.artista || '').trim().toLowerCase() + '|' + (d.titulo || '').trim().toLowerCase() + '|' + (d.formato || ''); }
function plain(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, ''); }
function bytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}
function limpiaNombre(s){ return String(s || '').replace(/\s*\((\d{1,2})\)/g, '').replace(/\s{2,}/g, ' ').trim(); }
function limpiaSello(s){
  var raw = limpiaNombre(s).split(/\s*,\s*/), partes = [];
  raw.forEach(function(x){
    x = x.trim();
    if(!x) return;
    if(/^(inc|ltd|limited|llc|s\.?a|s\.?l|s\.?r\.?l|gmbh|b\.?v|co|corp|plc|ab|a\/s|oy|nv)\.?$/i.test(x) && partes.length){
      partes[partes.length - 1] += ', ' + x;
    }else partes.push(x);
  });
  var vistos = [], out = [];
  partes.forEach(function(x){
    var k = x.toLowerCase().replace(/\b(records|recordings|record|inc|ltd|limited|s\.?a|s\.?l|gmbh|music|the)\b/g, '').replace(/[^a-z0-9]/g, '');
    if(k && vistos.indexOf(k) >= 0) return;
    vistos.push(k); out.push(x);
  });
  return out.slice(0, 2).join(' / ');
}
function normTracks(tl){
  if(!Array.isArray(tl)) return [];
  return tl.map(function(t){
    if(typeof t === 'string') return {titulo:t, duracion:'', preview:''};
    return {titulo:(t.titulo || t.title || ''), duracion:(t.duracion || t.duration || ''), preview:(t.preview || t.previewUrl || '')};
  }).filter(function(t){ return t.titulo; });
}
function normDisc(d){
  d = d || {};
  var y = String(d['año'] || d.anio || d.year || '').trim();
  if(!/^\d{4}$/.test(y)) y = (y.match(/\d{4}/) || [''])[0];
  var fmt = (d.formato === 'CD' || d.formato === 'Vinilo') ? d.formato
    : (String(d.formato || '').toLowerCase().indexOf('cd') >= 0 ? 'CD' : 'Vinilo');
  return {
    id: d.id || uid(),
    lista: d.lista === 'deseos' ? 'deseos' : 'coleccion',
    artista: limpiaNombre(d.artista || d.artist || ''),
    titulo: d.titulo || d.title || '',
    'año': y,
    formato: fmt,
    formatoDetalle: d.formatoDetalle || (d.formato && d.formato !== 'CD' && d.formato !== 'Vinilo' ? d.formato : ''),
    genero: d.genero || d.genre || '',
    sello: limpiaSello(d.sello || d.label || ''),
    numeroCatalogo: d.numeroCatalogo || d.catalogNumber || '',
    pais: d.pais || d.country || '',
    estado: d.estado || d.condition || '',
    fechaCompra: d.fechaCompra || '',
    precioCompra: Number(d.precioCompra) || 0,
    valorMercado: Number(d.valorMercado) || 0,
    portada: d.portada || d.coverUrl || '',
    color: d.color || '',
    tracklist: normTracks(d.tracklist),
    notas: d.notas || d.notes || '',
    etiquetas: Array.isArray(d.etiquetas) ? d.etiquetas.filter(Boolean) : [],
    mbid: d.mbid || '', rgid: d.rgid || '', discogs: d.discogs || '',
    codigoBarras: d.codigoBarras || '',
    confianza: d.confianza || '',
    valoracion: Number(d.valoracion) || 0,
    extra: d.extra && typeof d.extra === 'object' ? d.extra : null,
    escuchas: Number(d.escuchas) || 0,
    escuchasFechas: Array.isArray(d.escuchasFechas) ? d.escuchasFechas.filter(Boolean).slice(-600) : [],
    ultimaEscucha: d.ultimaEscucha || '',
    prestadoA: d.prestadoA || '',
    prestadoDesde: d.prestadoDesde || '',
    fechaAlta: d.fechaAlta || nowISO(),
    mod: d.mod || d.fechaAlta || nowISO()
  };
}
function firma(d){
  var c = {};
  Object.keys(d).forEach(function(k){ if(k !== 'mod') c[k] = d[k]; });
  return JSON.stringify(c);
}
function hoyISO(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function escuchadoHoy(d){ return (d.escuchasFechas || []).indexOf(hoyISO()) >= 0; }
function totalEscuchas(d){ return Math.max(Number(d.escuchas) || 0, (d.escuchasFechas || []).length); }
function fechaBonita(iso){
  if(!iso) return '';
  var hoy = hoyISO();
  if(iso === hoy) return 'hoy';
  var ayer = new Date(Date.now() - 86400000);
  var a = ayer.getFullYear() + '-' + ('0' + (ayer.getMonth() + 1)).slice(-2) + '-' + ('0' + ayer.getDate()).slice(-2);
  if(iso === a) return 'ayer';
  try{ return new Date(iso + 'T12:00:00').toLocaleDateString('es-ES', {day:'numeric', month:'short', year:'numeric'}); }
  catch(e){ return iso; }
}
/* Marca (o desmarca) una escucha del día de hoy. Solo una por día. */
function marcarEscucha(id, silencioso){
  var d = DB.discos.filter(function(x){ return x.id === id; })[0];
  if(!d || readOnly) return false;
  var hoy = hoyISO();
  var i = (d.escuchasFechas || []).indexOf(hoy);
  var puesto;
  if(i >= 0){
    d.escuchasFechas.splice(i, 1);
    d.escuchas = Math.max(0, (Number(d.escuchas) || 1) - 1);
    puesto = false;
  }else{
    d.escuchasFechas = (d.escuchasFechas || []).concat([hoy]).sort();
    d.escuchas = (Number(d.escuchas) || 0) + 1;
    puesto = true;
  }
  d.ultimaEscucha = d.escuchasFechas.length ? d.escuchasFechas[d.escuchasFechas.length - 1] : '';
  persist(true);
  if(!silencioso) toast(puesto ? 'Escuchado hoy · ' + totalEscuchas(d) + (totalEscuchas(d) === 1 ? ' vez' : ' veces') : 'Escucha de hoy quitada');
  return puesto;
}
function coleccion(){ return DB.discos.filter(function(d){ return d.lista !== 'deseos'; }); }
function deseos(){ return DB.discos.filter(function(d){ return d.lista === 'deseos'; }); }
function dupSet(){
  var m = {}, s = {};
  coleccion().forEach(function(d){ var k = key(d); (m[k] = m[k] || []).push(d.id); });
  Object.keys(m).forEach(function(k){ if(m[k].length > 1) m[k].forEach(function(id){ s[id] = 1; }); });
  return s;
}
function incompleto(d){ return !d.portada || d.tracklist.length === 0 || !d.genero || !d['año'] || !d.sello; }
function todasEtiquetas(){
  var m = {};
  DB.discos.forEach(function(d){ d.etiquetas.forEach(function(t){ m[t] = (m[t] || 0) + 1; }); });
  return Object.keys(m).sort(function(a, b){ return m[b] - m[a]; });
}
function toast(msg, err){
  var old = document.querySelectorAll('.toast');
  for(var i = 0; i < old.length; i++) old[i].remove();
  var t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = (err ? I.warn : I.check) + '<span>' + esc(msg) + '</span>';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, err ? 4200 : 3000);
  return t;
}
function download(filename, content, mime){
  var blob = content instanceof Blob ? content : new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} a.remove(); }, 500);
}
function rngShuffle(arr, seed){
  var a = arr.slice(), s = seed || 1;
  for(var i = a.length - 1; i > 0; i--){
    s = (s * 9301 + 49297) % 233280;
    var j = Math.floor(s / 233280 * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function similitud(a, b){
  a = plain(a); b = plain(b);
  if(!a || !b) return 0;
  if(a === b) return 1;
  var bg = function(s){
    var r = [];
    for(var i = 0; i < s.length - 1; i++) r.push(s.substr(i, 2));
    return r;
  };
  var A = bg(a), B = bg(b);
  if(!A.length || !B.length) return 0;
  var copia = B.slice(), hits = 0;
  A.forEach(function(x){
    var i = copia.indexOf(x);
    if(i >= 0){ hits++; copia.splice(i, 1); }
  });
  return 2 * hits / (A.length + B.length);
}

/* ============================================================
   3. ALMACÉN LOCAL (caché)
   ============================================================ */
function idbOpen(){
  return new Promise(function(res, rej){
    if(!window.indexedDB) return rej('no-idb');
    var r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore(IDB_STORE); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbSet(k, val){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, k);
      tx.oncomplete = function(){ res(true); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}
function idbGet(k){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction(IDB_STORE, 'readonly');
      var q = tx.objectStore(IDB_STORE).get(k);
      q.onsuccess = function(){ res(q.result || null); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}
function guardarLocal(){
  var payload = { actualizado: DB.actualizado, discos: DB.discos, borrados: DB.borrados, sha: SHA, lastSync: lastSync };
  return idbSet(K_DATOS, payload).catch(function(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(payload)); }catch(e){}
  });
}
function guardarCfg(){ return idbSet(K_CFG, CFG).catch(function(){}); }

/* ============================================================
   4. CAMBIOS Y PERSISTENCIA
   ============================================================ */
var saveTimer = null;
function sellarCambios(){
  var ahora = nowISO(), n = 0, vistos = {};
  DB.discos.forEach(function(d){
    vistos[d.id] = 1;
    var f = firma(d);
    if(firmas[d.id] !== f){
      if(firmas[d.id] !== undefined || !d.mod) d.mod = ahora;
      firmas[d.id] = f;
      n++;
    }
  });
  Object.keys(firmas).forEach(function(id){
    if(!vistos[id]){
      delete firmas[id];
      DB.borrados = (DB.borrados || []).filter(function(b){ return b.id !== id; });
      DB.borrados.push({id:id, fecha:ahora});
      n++;
    }
  });
  if(DB.borrados && DB.borrados.length > 400) DB.borrados = DB.borrados.slice(-400);
  return n;
}
function indexarFirmas(){
  firmas = {};
  DB.discos.forEach(function(d){ firmas[d.id] = firma(d); });
}
function persist(silencioso){
  if(readOnly) return;
  var n = sellarCambios();
  if(n) DB.actualizado = nowISO();
  guardarLocal();
  if(n && CFG.token){ syncState = 'pend'; programarPush(); }
  if(!silencioso) renderAll(); else pintarSync();
}
function programarPush(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ push(); }, 2500);
}


/* ============================================================
   5. SINCRONIZACIÓN CON GITHUB
      Los datos viven en tu repositorio. Cada dispositivo baja,
      fusiona por fecha de modificación de cada disco y sube.
   ============================================================ */
var GH = 'https://api.github.com/repos/';
var pullTimer = null, ultimoPull = 0, reintentos = 0;

function b64enc(str){
  var bytes = new TextEncoder().encode(str), bin = '', paso = 0x8000;
  for(var i = 0; i < bytes.length; i += paso){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + paso));
  }
  return btoa(bin);
}
function b64dec(b64){
  var bin = atob(String(b64).replace(/\s/g, ''));
  var bytes = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function ghUrl(){
  return GH + encodeURIComponent(CFG.owner) + '/' + encodeURIComponent(CFG.repo)
    + '/contents/' + CFG.path.split('/').map(encodeURIComponent).join('/');
}
function ghHeaders(){
  return { 'Authorization': 'Bearer ' + CFG.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
}
function configurado(){ return !!(CFG.owner && CFG.repo && CFG.token); }

function pintarSync(){
  var b = document.getElementById('syncBadge'), t = document.getElementById('syncTxt');
  if(!b) return;
  var textos = {
    local: 'Solo en este equipo', ok: 'Al día', pend: 'Pendiente de subir',
    busy: 'Sincronizando…', err: 'Error de sincronía', off: 'Sin conexión'
  };
  b.className = 'sync ' + syncState;
  t.textContent = syncMsg || textos[syncState] || '';
  b.title = lastSync ? 'Última sincronización: ' + fdate(lastSync) : 'Pulsa para configurar la sincronización';
}
function marcar(estado, msg){
  syncState = estado; syncMsg = msg || '';
  pintarSync();
}

/* ---------- fusión ---------- */
function fusionar(locales, borrLoc, remotos, borrRem){
  var mapa = {}, out = [], cambiosLocales = 0, cambiosRemotos = 0;
  var borrados = {};
  (borrLoc || []).concat(borrRem || []).forEach(function(b){
    if(!borrados[b.id] || b.fecha > borrados[b.id]) borrados[b.id] = b.fecha;
  });
  (remotos || []).forEach(function(d){ mapa[d.id] = {r: normDisc(d)}; });
  (locales || []).forEach(function(d){
    mapa[d.id] = mapa[d.id] || {};
    mapa[d.id].l = d;
  });
  Object.keys(mapa).forEach(function(id){
    var par = mapa[id], l = par.l, r = par.r;
    var elegido = null;
    if(l && r) elegido = (String(l.mod || '') >= String(r.mod || '')) ? l : r;
    else elegido = l || r;
    var borr = borrados[id];
    if(borr && String(borr) >= String(elegido.mod || '')){
      if(l) cambiosLocales++;
      if(r) cambiosRemotos++;
      return;
    }
    if(l && r){
      var union = {}, antes = (elegido.escuchasFechas || []).length;
      (l.escuchasFechas || []).concat(r.escuchasFechas || []).forEach(function(f){ union[f] = 1; });
      var todas = Object.keys(union).sort();
      if(todas.length !== antes){
        elegido = Object.assign({}, elegido, {
          escuchasFechas: todas,
          escuchas: Math.max(todas.length, l.escuchas || 0, r.escuchas || 0),
          ultimaEscucha: todas.length ? todas[todas.length - 1] : ''
        });
        cambiosLocales++; cambiosRemotos++;
      }
      var etq = {};
      (l.etiquetas || []).concat(r.etiquetas || []).forEach(function(t){ etq[t] = 1; });
      if(Object.keys(etq).length !== (elegido.etiquetas || []).length){
        elegido = Object.assign({}, elegido, {etiquetas: Object.keys(etq)});
      }
    }
    if(!l || (r && elegido === r)) cambiosLocales++;
    if(!r || (l && elegido === l)) cambiosRemotos++;
    out.push(elegido);
  });
  var listaBorrados = Object.keys(borrados).map(function(id){ return {id:id, fecha:borrados[id]}; }).slice(-400);
  return { discos: out, borrados: listaBorrados, aLocal: cambiosLocales, aRemoto: cambiosRemotos };
}

/* ---------- descarga ---------- */
function pull(silencioso){
  if(!configurado()) return Promise.resolve(false);
  if(!navigator.onLine){ marcar('off'); return Promise.resolve(false); }
  marcar('busy');
  return fetch(ghUrl() + '?ref=' + encodeURIComponent(CFG.branch) + '&t=' + Date.now(), {headers: ghHeaders(), cache:'no-store'})
    .then(function(r){
      if(r.status === 404) return null;
      if(r.status === 401 || r.status === 403) throw new Error('token');
      if(!r.ok) throw new Error('http' + r.status);
      return r.json();
    })
    .then(function(j){
      ultimoPull = Date.now();
      if(!j){ SHA = ''; marcar('pend', 'Aún no subido'); return true; }
      SHA = j.sha;
      var texto = j.content ? b64dec(j.content) : null;
      var seguir = function(txt){
        var remoto = JSON.parse(txt);
        var res = fusionar(DB.discos, DB.borrados, remoto.discos || [], remoto.borrados || []);
        DB.discos = res.discos.map(normDisc);
        DB.borrados = res.borrados;
        indexarFirmas();
        lastSync = nowISO();
        guardarLocal();
        if(res.aRemoto > 0){ marcar('pend'); programarPush(); }
        else marcar('ok');
        if(res.aLocal > 0){
          renderAll();
          if(!silencioso) toast(res.aLocal + (res.aLocal === 1 ? ' cambio recibido' : ' cambios recibidos'));
        }else{
          renderAll();
        }
        return true;
      };
      if(texto !== null) return seguir(texto);
      return fetch(j.download_url, {cache:'no-store'}).then(function(r2){ return r2.text(); }).then(seguir);
    })
    .catch(function(e){
      marcar('err', String(e.message) === 'token' ? 'Token no válido' : '');
      return false;
    });
}

/* ---------- subida ---------- */
function push(){
  if(!configurado() || readOnly) return Promise.resolve(false);
  if(!navigator.onLine){ marcar('off'); return Promise.resolve(false); }
  marcar('busy');
  var doc = { version:4, actualizado: nowISO(), discos: DB.discos, borrados: DB.borrados || [] };
  var cuerpo = {
    message: 'Discoteca · ' + DB.discos.length + ' discos · ' + new Date().toLocaleString('es-ES'),
    content: b64enc(JSON.stringify(doc, null, 0)),
    branch: CFG.branch
  };
  if(SHA) cuerpo.sha = SHA;
  return fetch(ghUrl(), {method:'PUT', headers: ghHeaders(), body: JSON.stringify(cuerpo)})
    .then(function(r){
      if(r.status === 409 || r.status === 422){
        if(reintentos >= 3){ reintentos = 0; throw new Error('conflicto'); }
        reintentos++;
        return pull(true).then(function(){ return push(); });
      }
      if(r.status === 401 || r.status === 403) throw new Error('token');
      if(!r.ok) throw new Error('http' + r.status);
      return r.json().then(function(j){
        reintentos = 0;
        SHA = j.content && j.content.sha ? j.content.sha : SHA;
        DB.actualizado = doc.actualizado;
        lastSync = nowISO();
        guardarLocal();
        marcar('ok');
        return true;
      });
    })
    .catch(function(e){
      marcar('err', String(e.message) === 'token' ? 'Token no válido' : '');
      return false;
    });
}
function sincronizarAhora(){
  if(!configurado()){ pantallaSync(); return; }
  pull().then(function(){ if(syncState === 'pend') return push(); });
}

/* ---------- arranque ---------- */
function boot(){
  Promise.all([idbGet(K_CFG).catch(function(){ return null; }), idbGet(K_DATOS).catch(function(){ return null; })])
    .then(function(res){
      var cfg = res[0], loc = res[1];
      if(!loc){
        try{ var raw = localStorage.getItem(LS_KEY); if(raw) loc = JSON.parse(raw); }catch(e){}
      }
      if(cfg) CFG = Object.assign(CFG, cfg);
      if(loc && Array.isArray(loc.discos) && loc.discos.length){
        DB.discos = loc.discos.map(normDisc);
        DB.borrados = loc.borrados || [];
        DB.actualizado = loc.actualizado || '';
        SHA = loc.sha || '';
        lastSync = loc.lastSync || '';
        indexarFirmas();
        marcar(configurado() ? 'ok' : 'local');
        montarEventos();
        renderAll();
        if(configurado()) pull(true);
        return;
      }
      return fetch('datos.json?t=' + Date.now(), {cache:'no-store'})
        .then(function(r){ return r.ok ? r.json() : {discos:[]}; })
        .catch(function(){ return {discos:[]}; })
        .then(function(doc){
          DB.discos = (doc.discos || []).map(normDisc);
          DB.borrados = doc.borrados || [];
          DB.actualizado = doc.actualizado || nowISO();
          indexarFirmas();
          guardarLocal();
          marcar(configurado() ? 'ok' : 'local');
          montarEventos();
          renderAll();
          if(configurado()) pull(true);
        });
    })
    .catch(function(){
      montarEventos();
      renderAll();
    });
}

/* ============================================================
   6. MOTOR DE COMPLETADO AUTOMÁTICO
      Apple Music (iTunes Search) · MusicBrainz · Cover Art Archive
      APIs públicas, sin clave, con CORS.
   ============================================================ */
var IT = 'https://itunes.apple.com/';
var MB = 'https://musicbrainz.org/ws/2/';
var itNext = 0, mbNext = 0, dgNext = 0;
var artistNat = {}, artistMbid = {};
var cancelBulk = false;

function slot(kind, gap){
  var now = Date.now();
  var next = kind === 'it' ? itNext : (kind === 'dg' ? dgNext : mbNext);
  var wait = Math.max(0, next - now);
  var t = now + wait + gap;
  if(kind === 'it') itNext = t; else if(kind === 'dg') dgNext = t; else mbNext = t;
  return new Promise(function(r){ setTimeout(r, wait); });
}
function jget(url, kind, gap, retry){
  return slot(kind, gap).then(function(){ return fetch(url); }).then(function(r){
    if((r.status === 503 || r.status === 429) && (retry || 0) < 2){
      return new Promise(function(res){ setTimeout(res, 2600); }).then(function(){ return jget(url, kind, gap, (retry || 0) + 1); });
    }
    if(!r.ok) throw new Error('http' + r.status);
    return r.json();
  });
}
function itGet(path){ return jget(IT + path, 'it', 340); }
function mbGet(path){ return jget(MB + path + (path.indexOf('?') >= 0 ? '&' : '?') + 'fmt=json', 'mb', 1150); }
function lucene(s){ return String(s || '').replace(/[+\-&|!(){}\[\]^"~*?:\\\/]/g, ' ').replace(/\s+/g, ' ').trim(); }
function msDur(ms){
  if(!ms) return '';
  var t = Math.round(ms / 1000);
  return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2);
}
function selloDeCopyright(c){
  if(!c) return '';
  var s = String(c).replace(/^[\u2117\u00a9\s]*\d{4}\s*/, '')
    .replace(/^the copyright in this sound recording is owned by\s*/i, '')
    .replace(/\s*under exclusive licen[sc]e.*$/i, '')
    .replace(/,?\s+(a|an)\s+[^,]*\b(company|group|label)\b\.?$/i, '')
    .replace(/\s*\/.*$/, '').replace(/[,;.\s]+$/, '').trim();
  return (s.length >= 2 && s.length <= 46) ? s : '';
}
function artBig(url, px){ return String(url || '').replace('100x100bb', (px || 600) + 'x' + (px || 600) + 'bb'); }

/* ---------- Apple Music ---------- */
function itCandidatos(titulo, artista, laxo){
  var term = ((artista ? artista + ' ' : '') + titulo).trim();
  return itGet('search?term=' + encodeURIComponent(term) + '&entity=album&limit=25&country=ES').then(function(j){
    var nt = plain(titulo), na = plain(artista);
    var extra = /deluxe|live|remaster|legacy|edition|edicion|version|tour|anniversar|directo|greatest|best of|coleccion|collection|karaoke|tribute|tributo|instrumental/;
    var quiereExtra = extra.test(String(titulo).toLowerCase());
    var cand = [];
    (j.results || []).forEach(function(c){
      var ct = plain(c.collectionName), ca = plain(c.artistName), s = 0, exacto = false;
      if(!ct) return;
      if(na){
        if(ca === na) s += 5;
        else if(ca.indexOf(na) >= 0 || na.indexOf(ca) >= 0) s += 3;
        else if(!laxo) return;
      }
      if(ct === nt){ s += 8; exacto = true; }
      else if(ct.indexOf(nt) === 0 && nt.length >= 4) s += 5;
      else if(nt && ct.indexOf(nt) >= 0 && nt.length >= 5) s += 2;
      else if(nt && nt.indexOf(ct) === 0 && ct.length >= 5) s += 2;
      else{
        /* nada literal: aceptamos el más parecido si se aproxima bastante */
        var par = similitud(ct, nt);
        if(par >= 0.62) s += Math.round(par * 6);
        else return;
      }
      if(!quiereExtra && !exacto && extra.test(String(c.collectionName).toLowerCase())) s -= 5;
      if((c.trackCount || 0) < 3) s -= 4;
      cand.push({c:c, s:s, exacto:exacto, d:String(c.releaseDate || '9999')});
    });
    cand.sort(function(a, b){ return (b.s - a.s) || a.d.localeCompare(b.d); });
    return cand;
  });
}
function itBuscar(titulo, artista, laxo){
  return itCandidatos(titulo, artista, laxo).then(function(cand){
    if(!cand.length) throw new Error('sin coincidencia');
    if(!laxo && cand[0].s < (artista ? 8 : 6)) throw new Error('coincidencia débil');
    return cand[0];
  });
}
function itTracks(id){
  return itGet('lookup?id=' + id + '&entity=song&limit=200&country=ES').then(function(j){
    return (j.results || []).filter(function(x){ return x.wrapperType === 'track' && x.trackName; })
      .sort(function(a, b){ return (a.discNumber - b.discNumber) || (a.trackNumber - b.trackNumber); })
      .map(function(x){ return { titulo: x.trackName, duracion: msDur(x.trackTimeMillis), preview: x.previewUrl || '' }; });
  }).catch(function(){ return []; });
}

/* ---------- MusicBrainz ---------- */
function mbArtistaId(nombre){
  var k = (nombre || '').trim().toLowerCase();
  if(!k) return Promise.resolve('');
  if(artistMbid[k] !== undefined) return Promise.resolve(artistMbid[k]);
  return mbGet('artist?query=' + encodeURIComponent('artist:"' + lucene(nombre) + '"') + '&limit=3').then(function(j){
    var a = (j.artists || [])[0];
    artistMbid[k] = a ? a.id : '';
    if(a) artistNat[k] = !!(a.country === 'ES' || (a.area && /spain|españa/i.test(a.area.name || '')));
    return artistMbid[k];
  }).catch(function(){ artistMbid[k] = ''; return ''; });
}
function esArtistaEspanol(artista, generoRaw){
  var k = (artista || '').trim().toLowerCase();
  if(!k) return Promise.resolve(false);
  if(artistNat[k] !== undefined) return Promise.resolve(artistNat[k]);
  var prev = DB.discos.filter(function(d){
    return (d.artista || '').trim().toLowerCase() === k && /Nacional|Internacional/.test(d.genero || '');
  })[0];
  if(prev){ artistNat[k] = /Nacional/.test(prev.genero); return Promise.resolve(artistNat[k]); }
  return mbGet('artist?query=' + encodeURIComponent('artist:"' + lucene(artista) + '"') + '&limit=3').then(function(j){
    var a = (j.artists || [])[0];
    var es = !!a && (a.country === 'ES'
      || (a.area && /spain|españa/i.test(a.area.name || ''))
      || (a['begin-area'] && /spain|españa/i.test(a['begin-area'].name || '')));
    artistNat[k] = es;
    if(a) artistMbid[k] = a.id;
    return es;
  }).catch(function(){
    var es = /español|espanol/i.test(generoRaw || '');
    artistNat[k] = es;
    return es;
  });
}
function mbDetalle(relId){
  return mbGet('release/' + relId + '?inc=recordings+labels+artist-credits+release-groups+genres').then(function(r){
    var rg = r['release-group'] || {};
    var lab = (r['label-info'] || [])[0] || {};
    var tracks = [];
    (r.media || []).forEach(function(m){
      (m.tracks || []).forEach(function(t){
        tracks.push({ titulo: t.title, duracion: msDur(t.length || (t.recording && t.recording.length)), preview: '' });
      });
    });
    var fmt = '';
    if(r.media && r.media.length){
      var f = (r.media[0].format) || '';
      fmt = (r.media.length > 1 ? r.media.length + 'x' : '') + (f || '');
    }
    var year = String(r.date || rg['first-release-date'] || '').slice(0, 4);
    var orig = String(rg['first-release-date'] || '').slice(0, 4);
    return {
      id: r.id, rgId: rg.id, tracklist: tracks,
      titulo: r.title || '',
      artista: (r['artist-credit'] || []).map(function(c){ return c.name + (c.joinphrase || ''); }).join(''),
      'año': /^\d{4}$/.test(year) ? year : '',
      anioOriginal: /^\d{4}$/.test(orig) ? orig : '',
      sello: (lab.label && lab.label.name) || '',
      numeroCatalogo: lab['catalog-number'] || '',
      pais: (r.country && r.country !== 'XW' && r.country !== 'XE') ? r.country : '',
      formatoDetalle: fmt,
      codigoBarras: r.barcode || '',
      tags: ((r.genres || []).concat(rg.genres || [])).map(function(g){ return g.name; }).join(' '),
      sec: (rg['secondary-types'] || []).join(' ')
    };
  });
}
function mbBuscarReleases(titulo, artista, formato, limite){
  var q = 'release:"' + lucene(titulo) + '"';
  if(artista) q += ' AND artist:"' + lucene(artista) + '"';
  return mbGet('release?query=' + encodeURIComponent(q) + '&limit=' + (limite || 15)).then(function(res){
    var rel = (res.releases || []).filter(function(r){ return (r.score || 0) >= 65; });
    var wantCD = formato === 'CD';
    rel.sort(function(a, b){
      var fa = ((a.media && a.media[0] && a.media[0].format) || '').toLowerCase();
      var fb = ((b.media && b.media[0] && b.media[0].format) || '').toLowerCase();
      var ma = (wantCD ? fa.indexOf('cd') >= 0 : fa.indexOf('vinyl') >= 0) ? 1 : 0;
      var mb2 = (wantCD ? fb.indexOf('cd') >= 0 : fb.indexOf('vinyl') >= 0) ? 1 : 0;
      if(ma !== mb2) return mb2 - ma;
      if((b.score || 0) !== (a.score || 0)) return (b.score || 0) - (a.score || 0);
      return String(a.date || '9999').localeCompare(String(b.date || '9999'));
    });
    return rel;
  });
}
function mbRelease(titulo, artista, formato){
  return mbBuscarReleases(titulo, artista, formato, 15).then(function(rel){
    if(!rel.length) throw new Error('sin resultados');
    return mbDetalle(rel[0].id);
  });
}
function headStatus(url){
  return fetch(url, {method:'HEAD'}).then(function(r){ return r.ok ? 1 : 0; }).catch(function(){ return 2; });
}
function coverArchive(relId, rgId, px){
  var t = px || 500;
  if(!relId && !rgId) return Promise.resolve('');
  var u = 'https://coverartarchive.org/release/' + relId + '/front-' + t;
  return headStatus(u).then(function(st){
    if(st === 1 || st === 2) return u;
    if(!rgId) return '';
    var v = 'https://coverartarchive.org/release-group/' + rgId + '/front-' + t;
    return headStatus(v).then(function(s2){ return s2 === 1 ? v : ''; });
  }).catch(function(){ return ''; });
}

/* ---------- clasificación de género ---------- */
var CATS = [
  ['BSO', ['soundtrack','banda sonora','bandas sonoras','musica original','música original','stage & screen','original score','film score']],
  ['Flamenco', ['flamenco','rumba','copla','sevillanas']],
  ['Heavy / Metal', ['metal','thrash','doom','speed metal','metalcore']],
  ['Grunge', ['grunge']],
  ['Punk / Hardcore', ['punk','hardcore','oi!']],
  ['Hip Hop / Rap', ['hip-hop','hip hop','rap','trap']],
  ['R&B / Soul', ['r&b','soul','motown','rhythm and blues']],
  ['Funk / Disco', ['funk','disco']],
  ['New Wave / Synth Pop', ['new wave','synth-pop','synthpop','synth pop','new romantic','darkwave','minimal wave']],
  ['Electrónica / Dance', ['electronic','electrónica','electronica','techno','house','trance','ambient','dance','edm','downtempo','big beat','breakbeat','idm']],
  ['Jazz', ['jazz','bebop','swing','big band']],
  ['Blues', ['blues','rhythm & blues']],
  ['Reggae / Ska', ['reggae','ska','rocksteady','dub']],
  ['Country', ['country','bluegrass','americana','honky']],
  ['Clásica', ['classical','clásica','clasica','ópera','opera','barroc','sinfón','sinfon','chamber','crossover clásico']],
  ['Folk / Cantautor', ['folk','cantautor','singer/songwriter','singer-songwriter','canción de autor']],
  ['Rock', ['rock','psychedelic','garage','britpop','stoner']],
  ['Latina', ['latin','salsa','cumbia','bolero','ranchera','bachata','reguet','reggaet','merengue','tango']],
  ['Indie / Alternativo', ['indie','alternativ']],
  ['Pop', ['pop']]
];
function cuenta(t, kw){
  var n = 0, i = t.indexOf(kw);
  while(i >= 0){ n++; i = t.indexOf(kw, i + kw.length); }
  return n;
}
function clasificar(texto, esES, artista){
  var t = ' ' + String(texto || '').toLowerCase().replace(/[\/,;|]/g, ' ') + ' ';
  var a = String(artista || '').toLowerCase();
  if(/various artists|varios artistas|v\.a\.|artistas varios/.test(a)) return 'Recopilatorios / Varios';
  var mejor = '', punt = 0;
  CATS.forEach(function(cat){
    var s = 0;
    cat[1].forEach(function(kw){ s += cuenta(t, kw); });
    if(s > punt){ punt = s; mejor = cat[0]; }
  });
  if(!mejor) return '';
  if(mejor === 'Rock') return esES ? 'Rock Nacional' : 'Rock Internacional';
  if(mejor === 'Pop') return esES ? 'Pop Nacional' : 'Pop Internacional';
  if(mejor === 'Latina' && esES) return 'Pop Nacional';
  return mejor;
}
function clasificarMixto(appleGenero, mbTags, esES, artista){
  var t = ' ' + [appleGenero, appleGenero, appleGenero, mbTags].filter(Boolean).join(' ') + ' ';
  return clasificar(t, esES, artista);
}
function necesitaNacionalidad(g){ return g === 'Rock' || g === 'Pop' || /^(Rock|Pop) /.test(g) || g === 'Latina'; }

/* ---------- orquestador ---------- */
function fetchInfo(titulo, artista, formato, faltan){
  faltan = faltan || {};
  var out = null, conf = 'alta';
  return itBuscar(titulo, artista).then(function(hit){
    var al = hit.c;
    if(!hit.exacto) conf = 'baja';
    var year = String(al.releaseDate || '').slice(0, 4);
    out = {
      portada: artBig(al.artworkUrl100, 600),
      'año': /^\d{4}$/.test(year) ? year : '',
      sello: selloDeCopyright(al.copyright),
      generoRaw: al.primaryGenreName || '',
      artistaReal: al.artistName || artista,
      tituloReal: al.collectionName || titulo,
      tracklist: [], numeroCatalogo: '', pais: '', formatoDetalle: '', notas: '', mbid: '', rgid: '', codigoBarras: ''
    };
    return itTracks(al.collectionId);
  }).then(function(tr){
    out.tracklist = tr;
    var pre = clasificar(out.generoRaw, false, out.artistaReal || artista);
    if(!necesitaNacionalidad(pre)) return pre;
    return esArtistaEspanol(out.artistaReal || artista, out.generoRaw).then(function(esES){
      return clasificar(out.generoRaw, esES, out.artistaReal || artista);
    });
  }).then(function(gen){
    out.genero = gen;
    var necesitaMB = (faltan.sello && !out.sello) || faltan.catalogo || faltan.pais || faltan.formato
      || faltan['año'] || !out.tracklist.length || !out.genero;
    if(!necesitaMB) return out;
    return mbRelease(titulo, artista, formato).then(function(mb){
      out.mbid = mb.id; out.rgid = mb.rgId;
      if(!out.sello) out.sello = mb.sello;
      if(!out.numeroCatalogo) out.numeroCatalogo = mb.numeroCatalogo;
      if(!out.pais) out.pais = mb.pais;
      if(!out.formatoDetalle) out.formatoDetalle = mb.formatoDetalle;
      if(!out.codigoBarras) out.codigoBarras = mb.codigoBarras;
      var cand = mb.anioOriginal || mb['año'];
      if(!out['año']) out['año'] = cand;
      else if(cand && parseInt(cand) < parseInt(out['año'])) out['año'] = cand;
      if(!out.tracklist.length) out.tracklist = mb.tracklist;
      var texto = mb.tags + ' ' + mb.sec;
      var pre2 = clasificarMixto(out.generoRaw, texto, false, artista);
      if(!necesitaNacionalidad(pre2)){ if(pre2) out.genero = pre2; return out; }
      return esArtistaEspanol(artista, out.generoRaw + ' ' + texto).then(function(esES){
        var g2 = clasificarMixto(out.generoRaw, texto, esES, artista);
        if(g2) out.genero = g2;
        return out;
      });
    }).catch(function(){ return out; });
  }).then(function(r){ r.confianza = conf; return r; })
  .catch(function(){
    var res = null;
    return mbRelease(titulo, artista, formato).then(function(mb){
      res = mb;
      var texto = mb.tags + ' ' + mb.sec;
      var pre = clasificar(texto, false, artista);
      if(!necesitaNacionalidad(pre)) return pre;
      return esArtistaEspanol(artista, texto).then(function(esES){ return clasificar(texto, esES, artista); });
    }).then(function(gen){
      return coverArchive(res.id, res.rgId).then(function(cov){
        return {
          portada: cov, tracklist: res.tracklist, 'año': res.anioOriginal || res['año'], sello: res.sello,
          numeroCatalogo: res.numeroCatalogo, pais: res.pais, formatoDetalle: res.formatoDetalle,
          codigoBarras: res.codigoBarras, mbid: res.id, rgid: res.rgId, genero: gen, notas: '',
          confianza: plain(res.titulo) === plain(titulo) ? 'alta' : 'baja'
        };
      });
    });
  }).catch(function(){
    /* último intento: el disco que más se parezca, aunque el título no sea idéntico */
    return itBuscar(titulo, artista, true).then(function(hit){
      var al = hit.c;
      var year = String(al.releaseDate || '').slice(0, 4);
      return itTracks(al.collectionId).then(function(tr){
        var g = clasificar(al.primaryGenreName || '', false, al.artistName);
        return {
          portada: artBig(al.artworkUrl100, 600), 'año': /^\d{4}$/.test(year) ? year : '',
          sello: selloDeCopyright(al.copyright), tracklist: tr, genero: g,
          numeroCatalogo:'', pais:'', formatoDetalle:'', notas:'', mbid:'', rgid:'', codigoBarras:'',
          tituloReal: al.collectionName, artistaReal: al.artistName, confianza:'baja'
        };
      });
    });
  }).catch(function(){ return askAI(titulo, artista, formato, ''); });
}

function aplicar(d, r, force){
  if(!r) return false;
  var cambios = false;
  if(r.portada && (force || !d.portada)){ d.portada = r.portada; d.color = ''; cambios = true; }
  if(r.tracklist && r.tracklist.length && (force || d.tracklist.length === 0)){ d.tracklist = normTracks(r.tracklist); cambios = true; }
  ['año','sello','numeroCatalogo','pais','formatoDetalle','genero','mbid','rgid','codigoBarras'].forEach(function(f){
    if(r[f] && (force || !d[f])){ d[f] = r[f]; cambios = true; }
  });
  if(r.notas && !d.notas){ d.notas = r.notas; cambios = true; }
  if(cambios) d.confianza = r.confianza === 'baja' ? 'baja' : '';
  return cambios;
}
function enrich(id, force){
  var d = DB.discos.filter(function(x){ return x.id === id; })[0];
  if(!d || (!d.titulo && !d.artista)) return Promise.resolve(false);
  if(d.mbid && !force) return porMbid(d, d.mbid, false);
  var faltan = { sello: !d.sello, catalogo: !d.numeroCatalogo, pais: !d.pais, formato: !d.formatoDetalle, 'año': !d['año'] };
  return fetchInfo(d.titulo, d.artista, d.formato, faltan).then(function(r){
    var c = aplicar(d, r, force);
    if(c) persist();
    return c;
  }).catch(function(){ return false; });
}

/* ---------- edición concreta por identificador ---------- */
function idDesdeUrl(url){
  var s = String(url || '').trim();
  var m = s.match(/musicbrainz\.org\/release\/([0-9a-f\-]{36})/i);
  if(m) return {tipo:'release', id:m[1]};
  m = s.match(/musicbrainz\.org\/release-group\/([0-9a-f\-]{36})/i);
  if(m) return {tipo:'rg', id:m[1]};
  m = s.match(/^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i);
  if(m) return {tipo:'release', id:m[1]};
  m = s.match(/discogs\.com\/(?:[a-z]{2}\/)?release\/(\d+)/i);
  if(m) return {tipo:'discogs', id:m[1], url:s};
  return null;
}
function porMbid(d, relId, force){
  return mbDetalle(relId).then(function(mb){
    return coverArchive(mb.id, mb.rgId).then(function(cov){
      var texto = mb.tags + ' ' + mb.sec;
      var pre = clasificar(texto, false, d.artista);
      var seguir = function(gen){
        var r = {
          portada: cov || '', tracklist: mb.tracklist, 'año': mb.anioOriginal || mb['año'], sello: mb.sello,
          numeroCatalogo: mb.numeroCatalogo, pais: mb.pais, formatoDetalle: mb.formatoDetalle,
          codigoBarras: mb.codigoBarras, mbid: mb.id, rgid: mb.rgId, genero: gen, confianza: 'alta'
        };
        var c = aplicar(d, r, force);
        d.mbid = mb.id; d.rgid = mb.rgId; d.confianza = '';
        persist();
        return true;
      };
      if(!necesitaNacionalidad(pre)) return seguir(pre);
      return esArtistaEspanol(d.artista, texto).then(function(es){ return seguir(clasificar(texto, es, d.artista)); });
    });
  });
}
function porUrl(d, url, formato){
  var ref = idDesdeUrl(url);
  if(!ref) return Promise.reject(new Error('url'));
  if(ref.tipo === 'release') return porMbid(d, ref.id, true);
  if(ref.tipo === 'rg'){
    return mbGet('release?release-group=' + ref.id + '&inc=media&limit=50').then(function(j){
      var rel = j.releases || [];
      var quiereCD = (formato || d.formato) === 'CD';
      rel.sort(function(a, b){
        var fa = ((a.media && a.media[0] && a.media[0].format) || '').toLowerCase();
        var fb = ((b.media && b.media[0] && b.media[0].format) || '').toLowerCase();
        var ma = (quiereCD ? fa.indexOf('cd') >= 0 : fa.indexOf('vinyl') >= 0) ? 1 : 0;
        var mb2 = (quiereCD ? fb.indexOf('cd') >= 0 : fb.indexOf('vinyl') >= 0) ? 1 : 0;
        if(ma !== mb2) return mb2 - ma;
        return String(a.date || '9999').localeCompare(String(b.date || '9999'));
      });
      if(!rel.length) throw new Error('vacío');
      return porMbid(d, rel[0].id, true);
    });
  }
  d.discogs = ref.url;
  return fetchInfo(d.titulo, d.artista, d.formato, {sello:true, catalogo:true, pais:true, formato:true, 'año':true})
    .then(function(r){ aplicar(d, r, true); persist(); return true; });
}

      });

}
function aplicarCandidato(d, cand){
