/* ============================================================
   6. MOTOR DE COMPLETADO AUTOMÁTICO
      Apple Music (iTunes Search) · MusicBrainz · Cover Art Archive
      APIs públicas, sin clave, con CORS.
   ============================================================ */
var IT = 'https://itunes.apple.com/';
var MB = 'https://musicbrainz.org/ws/2/';
var itNext = 0, mbNext = 0, dgNext = 0;
var artistNat = {}, artistMbid = {};
var cancelBulk = false;

function slot(kind, gap){
  var now = Date.now();
  var next = kind === 'it' ? itNext : (kind === 'dg' ? dgNext : mbNext);
  var wait = Math.max(0, next - now);
  var t = now + wait + gap;
  if(kind === 'it') itNext = t; else if(kind === 'dg') dgNext = t; else mbNext = t;
  return new Promise(function(r){ setTimeout(r, wait); });
}
function jget(url, kind, gap, retry){
  return slot(kind, gap).then(function(){ return fetch(url); }).then(function(r){
    if((r.status === 503 || r.status === 429) && (retry || 0) < 2){
      return new Promise(function(res){ setTimeout(res, 2600); }).then(function(){ return jget(url, kind, gap, (retry || 0) + 1); });
    }
    if(!r.ok) throw new Error('http' + r.status);
    return r.json();
  });
}
function itGet(path){ return jget(IT + path, 'it', 340); }
function mbGet(path){ return jget(MB + path + (path.indexOf('?') >= 0 ? '&' : '?') + 'fmt=json', 'mb', 1150); }
function lucene(s){ return String(s || '').replace(/[+\-&|!(){}\[\]^"~*?:\\\/]/g, ' ').replace(/\s+/g, ' ').trim(); }
function msDur(ms){
  if(!ms) return '';
  var t = Math.round(ms / 1000);
  return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2);
}
function selloDeCopyright(c){
  if(!c) return '';
  var s = String(c).replace(/^[\u2117\u00a9\s]*\d{4}\s*/, '')
    .replace(/^the copyright in this sound recording is owned by\s*/i, '')
    .replace(/\s*under exclusive licen[sc]e.*$/i, '')
    .replace(/,?\s+(a|an)\s+[^,]*\b(company|group|label)\b\.?$/i, '')
    .replace(/\s*\/.*$/, '').replace(/[,;.\s]+$/, '').trim();
  return (s.length >= 2 && s.length <= 46) ? s : '';
}
function artBig(url, px){ return String(url || '').replace('100x100bb', (px || 600) + 'x' + (px || 600) + 'bb'); }

/* ---------- Apple Music ---------- */
function itCandidatos(titulo, artista, laxo){
  var term = ((artista ? artista + ' ' : '') + titulo).trim();
  return itGet('search?term=' + encodeURIComponent(term) + '&entity=album&limit=25&country=ES').then(function(j){
    var nt = plain(titulo), na = plain(artista);
    var extra = /deluxe|live|remaster|legacy|edition|edicion|version|tour|anniversar|directo|greatest|best of|coleccion|collection|karaoke|tribute|tributo|instrumental/;
    var quiereExtra = extra.test(String(titulo).toLowerCase());
    var cand = [];
    (j.results || []).forEach(function(c){
      var ct = plain(c.collectionName), ca = plain(c.artistName), s = 0, exacto = false;
      if(!ct) return;
      if(na){
        if(ca === na) s += 5;
        else if(ca.indexOf(na) >= 0 || na.indexOf(ca) >= 0) s += 3;
        else if(!laxo) return;
      }
      if(ct === nt){ s += 8; exacto = true; }
      else if(ct.indexOf(nt) === 0 && nt.length >= 4) s += 5;
      else if(nt && ct.indexOf(nt) >= 0 && nt.length >= 5) s += 2;
      else if(nt && nt.indexOf(ct) === 0 && ct.length >= 5) s += 2;
      else{
        /* nada literal: aceptamos el más parecido si se aproxima bastante */
        var par = similitud(ct, nt);
        if(par >= 0.62) s += Math.round(par * 6);
        else return;
      }
      if(!quiereExtra && !exacto && extra.test(String(c.collectionName).toLowerCase())) s -= 5;
      if((c.trackCount || 0) < 3) s -= 4;
      cand.push({c:c, s:s, exacto:exacto, d:String(c.releaseDate || '9999')});
    });
    cand.sort(function(a, b){ return (b.s - a.s) || a.d.localeCompare(b.d); });
    return cand;
  });
}
function itBuscar(titulo, artista, laxo){
  return itCandidatos(titulo, artista, laxo).then(function(cand){
    if(!cand.length) throw new Error('sin coincidencia');
    if(!laxo && cand[0].s < (artista ? 8 : 6)) throw new Error('coincidencia débil');
    return cand[0];
  });
}
function itTracks(id){
  return itGet('lookup?id=' + id + '&entity=song&limit=200&country=ES').then(function(j){
    return (j.results || []).filter(function(x){ return x.wrapperType === 'track' && x.trackName; })
      .sort(function(a, b){ return (a.discNumber - b.discNumber) || (a.trackNumber - b.trackNumber); })
      .map(function(x){ return { titulo: x.trackName, duracion: msDur(x.trackTimeMillis), preview: x.previewUrl || '',
        disco: Number(x.discNumber) || 1 }; });
  }).catch(function(){ return []; });
}

/* ---------- MusicBrainz ---------- */
function mbArtistaId(nombre){
  var k = (nombre || '').trim().toLowerCase();
  if(!k) return Promise.resolve('');
  if(artistMbid[k] !== undefined) return Promise.resolve(artistMbid[k]);
  return mbGet('artist?query=' + encodeURIComponent('artist:"' + lucene(nombre) + '"') + '&limit=3').then(function(j){
    var a = (j.artists || [])[0];
    artistMbid[k] = a ? a.id : '';
    if(a) artistNat[k] = !!(a.country === 'ES' || (a.area && /spain|españa/i.test(a.area.name || '')));
    return artistMbid[k];
  }).catch(function(){ artistMbid[k] = ''; return ''; });
}
function esArtistaEspanol(artista, generoRaw){
  var k = (artista || '').trim().toLowerCase();
  if(!k) return Promise.resolve(false);
  if(artistNat[k] !== undefined) return Promise.resolve(artistNat[k]);
  var prev = DB.discos.filter(function(d){
    return (d.artista || '').trim().toLowerCase() === k && /Nacional|Internacional/.test(d.genero || '');
  })[0];
  if(prev){ artistNat[k] = /Nacional/.test(prev.genero); return Promise.resolve(artistNat[k]); }
  return mbGet('artist?query=' + encodeURIComponent('artist:"' + lucene(artista) + '"') + '&limit=3').then(function(j){
    var a = (j.artists || [])[0];
    var es = !!a && (a.country === 'ES'
      || (a.area && /spain|españa/i.test(a.area.name || ''))
      || (a['begin-area'] && /spain|españa/i.test(a['begin-area'].name || '')));
    artistNat[k] = es;
    if(a) artistMbid[k] = a.id;
    return es;
  }).catch(function(){
    var es = /español|espanol/i.test(generoRaw || '');
    artistNat[k] = es;
    return es;
  });
}
function mbDetalle(relId){
  return mbGet('release/' + relId + '?inc=recordings+labels+artist-credits+release-groups+genres').then(function(r){
    var rg = r['release-group'] || {};
    var lab = (r['label-info'] || [])[0] || {};
    var tracks = [], varias = (r.media || []).length > 1;
    (r.media || []).forEach(function(m, i){
      (m.tracks || []).forEach(function(t){
        var o = { titulo: t.title, duracion: msDur(t.length || (t.recording && t.recording.length)), preview: '' };
        if(varias) o.disco = i + 1;
        if(t.number && /^[A-Z]\d*$/i.test(String(t.number))) o.pos = t.number;
        tracks.push(o);
      });
    });
    var fmt = '';
    if(r.media && r.media.length){
      var f = (r.media[0].format) || '';
      fmt = (r.media.length > 1 ? r.media.length + 'x' : '') + (f || '');
    }
    var year = String(r.date || rg['first-release-date'] || '').slice(0, 4);
    var orig = String(rg['first-release-date'] || '').slice(0, 4);
    return {
      id: r.id, rgId: rg.id, tracklist: tracks,
      titulo: r.title || '',
      artista: (r['artist-credit'] || []).map(function(c){ return c.name + (c.joinphrase || ''); }).join(''),
      'año': /^\d{4}$/.test(year) ? year : '',
      anioOriginal: /^\d{4}$/.test(orig) ? orig : '',
      sello: (lab.label && lab.label.name) || '',
      numeroCatalogo: lab['catalog-number'] || '',
      pais: (r.country && r.country !== 'XW' && r.country !== 'XE') ? r.country : '',
      formatoDetalle: fmt,
      codigoBarras: r.barcode || '',
      tags: ((r.genres || []).concat(rg.genres || [])).map(function(g){ return g.name; }).join(' '),
      sec: (rg['secondary-types'] || []).join(' ')
    };
  });
}
function mbBuscarReleases(titulo, artista, formato, limite){
  var q = 'release:"' + lucene(titulo) + '"';
  if(artista) q += ' AND artist:"' + lucene(artista) + '"';
  return mbGet('release?query=' + encodeURIComponent(q) + '&limit=' + (limite || 15)).then(function(res){
    var rel = (res.releases || []).filter(function(r){ return (r.score || 0) >= 65; });
    var wantCD = formato === 'CD';
    rel.sort(function(a, b){
      var fa = ((a.media && a.media[0] && a.media[0].format) || '').toLowerCase();
      var fb = ((b.media && b.media[0] && b.media[0].format) || '').toLowerCase();
      var ma = (wantCD ? fa.indexOf('cd') >= 0 : fa.indexOf('vinyl') >= 0) ? 1 : 0;
      var mb2 = (wantCD ? fb.indexOf('cd') >= 0 : fb.indexOf('vinyl') >= 0) ? 1 : 0;
      if(ma !== mb2) return mb2 - ma;
      if((b.score || 0) !== (a.score || 0)) return (b.score || 0) - (a.score || 0);
      return String(a.date || '9999').localeCompare(String(b.date || '9999'));
    });
    return rel;
  });
}
function mbRelease(titulo, artista, formato){
  return mbBuscarReleases(titulo, artista, formato, 15).then(function(rel){
    if(!rel.length) throw new Error('sin resultados');
    return mbDetalle(rel[0].id);
  });
}
function headStatus(url){

}
function coverArchive(relId, rgId, px){
  var t = px || 500;
  if(!relId && !rgId) return Promise.resolve('');
  var u = 'https://coverartarchive.org/release/' + relId + '/front-' + t;

    if(!rgId) return '';
    var v = 'https://coverartarchive.org/release-group/' + rgId + '/front-' + t;
    return headStatus(v).then(function(s2){ return s2 === 1 ? v : ''; });
  }).catch(function(){ return ''; });
}

/* ---------- clasificación de género ---------- */
var CATS = [
  ['BSO', ['soundtrack','banda sonora','bandas sonoras','musica original','música original','stage & screen','original score','film score']],
  ['Flamenco', ['flamenco','rumba','copla','sevillanas']],
  ['Heavy / Metal', ['metal','thrash','doom','speed metal','metalcore']],
  ['Grunge', ['grunge']],
  ['Punk / Hardcore', ['punk','hardcore','oi!']],
  ['Hip Hop / Rap', ['hip-hop','hip hop','rap','trap']],
  ['R&B / Soul', ['r&b','soul','motown','rhythm and blues']],
  ['Funk / Disco', ['funk','disco']],
  ['New Wave / Synth Pop', ['new wave','synth-pop','synthpop','synth pop','new romantic','darkwave','minimal wave']],
  ['Electrónica / Dance', ['electronic','electrónica','electronica','techno','house','trance','ambient','dance','edm','downtempo','big beat','breakbeat','idm']],
  ['Jazz', ['jazz','bebop','swing','big band']],
  ['Blues', ['blues','rhythm & blues']],
  ['Reggae / Ska', ['reggae','ska','rocksteady','dub']],
  ['Country', ['country','bluegrass','americana','honky']],
  ['Clásica', ['classical','clásica','clasica','ópera','opera','barroc','sinfón','sinfon','chamber','crossover clásico']],
  ['Folk / Cantautor', ['folk','cantautor','singer/songwriter','singer-songwriter','canción de autor']],
  ['Rock', ['rock','psychedelic','garage','britpop','stoner']],
  ['Latina', ['latin','salsa','cumbia','bolero','ranchera','bachata','reguet','reggaet','merengue','tango']],
  ['Indie / Alternativo', ['indie','alternativ']],
  ['Pop', ['pop']]
];
function cuenta(t, kw){
  var n = 0, i = t.indexOf(kw);
  while(i >= 0){ n++; i = t.indexOf(kw, i + kw.length); }
  return n;
}
function clasificar(texto, esES, artista){
  var t = ' ' + String(texto || '').toLowerCase().replace(/[\/,;|]/g, ' ') + ' ';
  var a = String(artista || '').toLowerCase();
  if(/various artists|varios artistas|v\.a\.|artistas varios/.test(a)) return 'Recopilatorios / Varios';
  var mejor = '', punt = 0;
  CATS.forEach(function(cat){
    var s = 0;
    cat[1].forEach(function(kw){ s += cuenta(t, kw); });
    if(s > punt){ punt = s; mejor = cat[0]; }
  });
  if(!mejor) return '';
  if(mejor === 'Rock') return esES ? 'Rock Nacional' : 'Rock Internacional';
  if(mejor === 'Pop') return esES ? 'Pop Nacional' : 'Pop Internacional';
  if(mejor === 'Latina' && esES) return 'Pop Nacional';
  return mejor;
}
function clasificarMixto(appleGenero, mbTags, esES, artista){
  var t = ' ' + [appleGenero, appleGenero, appleGenero, mbTags].filter(Boolean).join(' ') + ' ';
  return clasificar(t, esES, artista);
}
function necesitaNacionalidad(g){ return g === 'Rock' || g === 'Pop' || /^(Rock|Pop) /.test(g) || g === 'Latina'; }

/* ---------- orquestador ---------- */
function fetchInfo(titulo, artista, formato, faltan){
  faltan = faltan || {};
  var out = null, conf = 'alta';
  return itBuscar(titulo, artista).then(function(hit){
    var al = hit.c;
    if(!hit.exacto) conf = 'baja';
    var year = String(al.releaseDate || '').slice(0, 4);
    out = {
      portada: artBig(al.artworkUrl100, 600),
      'año': /^\d{4}$/.test(year) ? year : '',
      sello: selloDeCopyright(al.copyright),
      generoRaw: al.primaryGenreName || '',
      artistaReal: al.artistName || artista,
      tituloReal: al.collectionName || titulo,
      appleUrl: al.collectionViewUrl || '',
      tracklist: [], numeroCatalogo: '', pais: '', formatoDetalle: '', notas: '', mbid: '', rgid: '', codigoBarras: ''
    };
    return itTracks(al.collectionId);
  }).then(function(tr){
    out.tracklist = tr;
    var pre = clasificar(out.generoRaw, false, out.artistaReal || artista);
    if(!necesitaNacionalidad(pre)) return pre;
    return esArtistaEspanol(out.artistaReal || artista, out.generoRaw).then(function(esES){
      return clasificar(out.generoRaw, esES, out.artistaReal || artista);
    });
  }).then(function(gen){
    out.genero = gen;
    var necesitaMB = (faltan.sello && !out.sello) || faltan.catalogo || faltan.pais || faltan.formato
      || faltan['año'] || !out.tracklist.length || !out.genero;
    if(!necesitaMB) return out;
    return mbRelease(titulo, artista, formato).then(function(mb){
      out.mbid = mb.id; out.rgid = mb.rgId;
      if(!out.sello) out.sello = mb.sello;
      if(!out.numeroCatalogo) out.numeroCatalogo = mb.numeroCatalogo;
      if(!out.pais) out.pais = mb.pais;
      if(!out.formatoDetalle) out.formatoDetalle = mb.formatoDetalle;
      if(!out.codigoBarras) out.codigoBarras = mb.codigoBarras;
      var cand = mb.anioOriginal || mb['año'];
      if(!out['año']) out['año'] = cand;
      else if(cand && parseInt(cand) < parseInt(out['año'])) out['año'] = cand;
      if(!out.tracklist.length) out.tracklist = mb.tracklist;
      var texto = mb.tags + ' ' + mb.sec;
      var pre2 = clasificarMixto(out.generoRaw, texto, false, artista);
      if(!necesitaNacionalidad(pre2)){ if(pre2) out.genero = pre2; return out; }
      return esArtistaEspanol(artista, out.generoRaw + ' ' + texto).then(function(esES){
        var g2 = clasificarMixto(out.generoRaw, texto, esES, artista);
        if(g2) out.genero = g2;
        return out;
      });
    }).catch(function(){ return out; });
  }).then(function(r){ r.confianza = conf; return r; })
  .catch(function(){
    var res = null;
    return mbRelease(titulo, artista, formato).then(function(mb){
      res = mb;
      var texto = mb.tags + ' ' + mb.sec;
      var pre = clasificar(texto, false, artista);
      if(!necesitaNacionalidad(pre)) return pre;
      return esArtistaEspanol(artista, texto).then(function(esES){ return clasificar(texto, esES, artista); });
    }).then(function(gen){
      return coverArchive(res.id, res.rgId).then(function(cov){
        return {
          portada: cov, tracklist: res.tracklist, 'año': res.anioOriginal || res['año'], sello: res.sello,
          numeroCatalogo: res.numeroCatalogo, pais: res.pais, formatoDetalle: res.formatoDetalle,
          codigoBarras: res.codigoBarras, mbid: res.id, rgid: res.rgId, genero: gen, notas: '',
          confianza: plain(res.titulo) === plain(titulo) ? 'alta' : 'baja'
        };
      });
    });
  }).catch(function(){
    /* último intento: el disco que más se parezca, aunque el título no sea idéntico */
    return itBuscar(titulo, artista, true).then(function(hit){
      var al = hit.c;
      var year = String(al.releaseDate || '').slice(0, 4);
      return itTracks(al.collectionId).then(function(tr){
        var g = clasificar(al.primaryGenreName || '', false, al.artistName);
        return {
          portada: artBig(al.artworkUrl100, 600), 'año': /^\d{4}$/.test(year) ? year : '',
          sello: selloDeCopyright(al.copyright), tracklist: tr, genero: g,
          numeroCatalogo:'', pais:'', formatoDetalle:'', notas:'', mbid:'', rgid:'', codigoBarras:'',
          tituloReal: al.collectionName, artistaReal: al.artistName, confianza:'baja'
        };
      });
    });
  }).catch(function(){ return askAI(titulo, artista, formato, ''); });
}

function aplicar(d, r, force){
  if(!r) return false;
  var cambios = false;
  if(r.portada && (force || !d.portada)){ d.portada = r.portada; d.color = ''; cambios = true; }
  if(r.tracklist && r.tracklist.length && (force || d.tracklist.length === 0)){ d.tracklist = normTracks(r.tracklist); cambios = true; }
  ['año','sello','numeroCatalogo','pais','formatoDetalle','genero','mbid','rgid','codigoBarras','appleUrl'].forEach(function(f){
    if(r[f] && (force || !d[f])){ d[f] = r[f]; cambios = true; }
  });
  if(r.notas && !d.notas){ d.notas = r.notas; cambios = true; }
  if(cambios) d.confianza = r.confianza === 'baja' ? 'baja' : '';
  return cambios;
}
function enrich(id, force){
  var d = DB.discos.filter(function(x){ return x.id === id; })[0];
  if(!d || (!d.titulo && !d.artista)) return Promise.resolve(false);
  if(d.mbid && !force) return porMbid(d, d.mbid, false);
  var faltan = { sello: !d.sello, catalogo: !d.numeroCatalogo, pais: !d.pais, formato: !d.formatoDetalle, 'año': !d['año'] };
  return fetchInfo(d.titulo, d.artista, d.formato, faltan).then(function(r){
    var c = aplicar(d, r, force);
    if(c) persist();
    return c;
  }).catch(function(){ return false; });
}

/* ---------- edición concreta por identificador ---------- */
function idDesdeUrl(url){
  var s = String(url || '').trim();
  var m = s.match(/musicbrainz\.org\/release\/([0-9a-f\-]{36})/i);
  if(m) return {tipo:'release', id:m[1]};
  m = s.match(/musicbrainz\.org\/release-group\/([0-9a-f\-]{36})/i);
  if(m) return {tipo:'rg', id:m[1]};
  m = s.match(/^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i);
  if(m) return {tipo:'release', id:m[1]};
  m = s.match(/discogs\.com\/(?:[a-z]{2}\/)?release\/(\d+)/i);
  if(m) return {tipo:'discogs', id:m[1], url:s};
  return null;
}
function porMbid(d, relId, force){
  return mbDetalle(relId).then(function(mb){
    return coverArchive(mb.id, mb.rgId).then(function(cov){
      var texto = mb.tags + ' ' + mb.sec;
      var pre = clasificar(texto, false, d.artista);
      var seguir = function(gen){
        var r = {
          portada: cov || '', tracklist: mb.tracklist, 'año': mb.anioOriginal || mb['año'], sello: mb.sello,
          numeroCatalogo: mb.numeroCatalogo, pais: mb.pais, formatoDetalle: mb.formatoDetalle,
          codigoBarras: mb.codigoBarras, mbid: mb.id, rgid: mb.rgId, genero: gen, confianza: 'alta'
        };
        var c = aplicar(d, r, force);
        d.mbid = mb.id; d.rgid = mb.rgId; d.confianza = '';
        persist();
        return true;
      };
      if(!necesitaNacionalidad(pre)) return seguir(pre);
      return esArtistaEspanol(d.artista, texto).then(function(es){ return seguir(clasificar(texto, es, d.artista)); });
    });
  });
}
function porUrl(d, url, formato){
  var ref = idDesdeUrl(url);
  if(!ref) return Promise.reject(new Error('url'));
  if(ref.tipo === 'release') return porMbid(d, ref.id, true);
  if(ref.tipo === 'rg'){
    return mbGet('release?release-group=' + ref.id + '&inc=media&limit=50').then(function(j){
      var rel = j.releases || [];
      var quiereCD = (formato || d.formato) === 'CD';
      rel.sort(function(a, b){
        var fa = ((a.media && a.media[0] && a.media[0].format) || '').toLowerCase();
        var fb = ((b.media && b.media[0] && b.media[0].format) || '').toLowerCase();
        var ma = (quiereCD ? fa.indexOf('cd') >= 0 : fa.indexOf('vinyl') >= 0) ? 1 : 0;
        var mb2 = (quiereCD ? fb.indexOf('cd') >= 0 : fb.indexOf('vinyl') >= 0) ? 1 : 0;
        if(ma !== mb2) return mb2 - ma;
        return String(a.date || '9999').localeCompare(String(b.date || '9999'));
      });
      if(!rel.length) throw new Error('vacío');
      return porMbid(d, rel[0].id, true);
    });
  }
  d.discogs = ref.url;
  return fetchInfo(d.titulo, d.artista, d.formato, {sello:true, catalogo:true, pais:true, formato:true, 'año':true})
    .then(function(r){ aplicar(d, r, true); persist(); return true; });
}

/* ---------- color dominante de la carátula ---------- */
function colorDominante(url){
  return new Promise(function(res, rej){
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      try{
        var c = document.createElement('canvas'); c.width = 16; c.height = 16;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, 16, 16);
        var px = ctx.getImageData(0, 0, 16, 16).data;
        var r = 0, g = 0, b = 0, n = 0;
        for(var i = 0; i < px.length; i += 4){
          if(px[i+3] < 128) continue;
          r += px[i]; g += px[i+1]; b += px[i+2]; n++;
        }
        if(!n) return rej();
        res([Math.round(r/n), Math.round(g/n), Math.round(b/n)].join(','));
      }catch(e){ rej(e); }
    };
    img.onerror = rej;
    img.src = url;
  });
}
function aseguraColor(d){
  if(d.color || !d.portada) return Promise.resolve(d.color);
  return colorDominante(d.portada).then(function(c){ d.color = c; persist(true); return c; }).catch(function(){ return ''; });
}

  L.push('El género debe ser exactamente uno de: ' + GENEROS.join(' | '));

  L.push('Formato: {"portada":"","tracklist":[],"anio":"","sello":"","numeroCatalogo":"","pais":"","formatoDetalle":"","genero":"","notas":""}');
  L.push('No inventes: si no verificas un dato, deja "" o [].');
  return fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6', max_tokens:2000,

  }).then(function(r){ if(!r.ok) throw new Error('api'); return r.json(); }).then(function(data){

    var m = text.match(/\{[\s\S]*\}/);

   7. IMPORTACIÓN Y EXPORTACIÓN
   ============================================================ */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  var rows = [], row = [], cur = '', q = false, i = 0;
  while(i < text.length){
    var c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    }else{
      if(c === '"') q = true;
      else if(c === ','){ row.push(cur); cur = ''; }
      else if(c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
      else if(c === '\r'){ /* nada */ }
      else cur += c;
    }
    i++;
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  if(!rows.length) return [];
  var head = rows.shift().map(function(h){ return h.trim(); });
  return rows.filter(function(r){ return r.length > 1; }).map(function(r){
    var o = {}; head.forEach(function(h, j){ o[h] = (r[j] || '').trim(); }); return o;
  });
}
function csvCell(v){
  var s = (v == null ? '' : String(v));
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function filaADisco(x){
  var titulo = (x['Title'] || x['Título'] || x['Titulo'] || '').trim();
  var artista = (x['Artist'] || x['Artista'] || '').trim();
  if(!titulo && !artista) return null;
  var fmtRaw = (x['Format'] || x['Formato'] || '').trim();
  var formato = fmtRaw.toLowerCase().indexOf('cd') >= 0 ? 'CD' : 'Vinilo';
  return normDisc({
    id: uid(), artista: artista, titulo: titulo,
    'año': (x['Released'] || x['Año'] || '').trim(),
    formato: formato, formatoDetalle: fmtRaw,
    genero: clasificar(x['Genre'] || x['Style'] || x['Género'] || '', false, artista),
    sello: (x['Label'] || x['Sello'] || '').trim(),
    numeroCatalogo: (x['Catalog#'] || x['Catálogo'] || '').trim(),
    estado: (x['Collection Media Condition'] || x['Estado'] || '').trim(),
    notas: (x['Collection Notes'] || x['Notas'] || '').trim(),
    lista: /wishlist|deseos/i.test(x['CollectionFolder'] || '') ? 'deseos' : 'coleccion',

  });

/* Clasifica cada fila del CSV: nuevo, idéntico o dudoso.
   Nunca sobrescribe: los idénticos se descartan y los dudosos se preguntan. */
function nucleoTitulo(t){
  return plain(String(t || '')
    .replace(/[\(\[][^\)\]]*[\)\]]/g, ' ')
    .replace(/\b(remaster(ed)?|remasterizado|deluxe|expanded|edition|edicion|edición|anniversary|aniversario|reissue|reedicion|reedición|bonus|special|especial|limited|limitada|version|versión|digipak|digipack|vol|volume|volumen)\b/gi, ' ')
    .replace(/\s*[-–—:]\s*$/, ''));
}
function analizarImportacion(filas){
  var nuevos = [], identicos = [], dudosos = [];
  var porClave = {}, porArtista = {}, porCat = {};
  var registrar = function(d){
    porClave[key(d)] = d;
    var a = plain(d.artista);
    (porArtista[a] = porArtista[a] || []).push(d);
    if(d.numeroCatalogo) porCat[plain(d.numeroCatalogo)] = d;
  };
  DB.discos.forEach(registrar);
  filas.forEach(function(fila){
    var d = filaADisco(fila);
    if(!d) return;
    var exacto = porClave[key(d)];
    if(exacto){ identicos.push({nuevo:d, actual:exacto}); return; }

    var cands = porArtista[plain(d.artista)] || [], mejor = null, mejorS = 0, motivo = '';
    var nuc = nucleoTitulo(d.titulo);
    cands.forEach(function(c){
      var s = similitud(c.titulo, d.titulo), m = 'títulos parecidos';
      var nc = nucleoTitulo(c.titulo);
      if(nuc && nc && nuc === nc){ s = Math.max(s, 0.97); m = 'mismo álbum, edición distinta'; }
      if(d.numeroCatalogo && c.numeroCatalogo && plain(d.numeroCatalogo) === plain(c.numeroCatalogo)){ s = 1; m = 'mismo número de catálogo'; }
      if(s > mejorS){ mejorS = s; mejor = c; motivo = m; }
    });
    if(!mejor && d.numeroCatalogo && porCat[plain(d.numeroCatalogo)]){
      mejor = porCat[plain(d.numeroCatalogo)]; mejorS = 1; motivo = 'mismo número de catálogo';
    }
    if(mejor && mejorS >= 0.72){ dudosos.push({nuevo:d, actual:mejor, score:mejorS, motivo:motivo}); return; }
    nuevos.push(d);
    registrar(d);
  });
  return {nuevos:nuevos, identicos:identicos, dudosos:dudosos};
}
function importCsv(file){
  var r = new FileReader();
  r.onload = function(){
    var filas = parseCSV(String(r.result));
    if(!filas.length){ toast('El CSV está vacío o no se pudo leer', true); return; }
    var an = analizarImportacion(filas);
    pantallaImportacion(an, filas.length);
  };
  r.readAsText(file);
}

function revisarDudosos(dudosos, yaAnadidos){
  var i = 0, res = {mantener:0, sustituir:0, ambos:0}, aplicarTodo = '';
  var nuevosCompletar = [];
  var s = sheet('Revisar posibles repetidos', '<div id="revBody"></div>',
    '<button class="btn" id="revSalir">Terminar</button><div class="rowb" id="revBtns"></div>');
  var $ = function(q){ return s.querySelector(q); };

  function campo(k, a, b){
    var dif = String(a || '') !== String(b || '');
    return '<div class="f' + (dif ? ' dif' : '') + '"><span class="k">' + k + '</span><span class="v">' + esc(a || '—') + '</span></div>';
  }
  function ficha(d, titulo, clase){
    return '<div class="vsc ' + (clase || '') + '"><div class="h">' + titulo + '</div>'
      + '<div style="text-align:center;margin-bottom:10px"><div style="width:76px;height:76px;margin:0 auto;border-radius:10px;overflow:hidden;background:var(--fill);display:flex;align-items:center;justify-content:center">'
      + (d.portada ? '<img src="' + esc(d.portada) + '" style="width:100%;height:100%;object-fit:cover" onerror="this.remove()">' : I.disc) + '</div></div>'
      + '<div style="font-size:14px;font-weight:600;text-align:center;line-height:1.3;margin-bottom:2px">' + esc(d.titulo) + '</div>'
      + '<div style="font-size:12.5px;color:var(--txt2);text-align:center;margin-bottom:10px">' + esc(d.artista) + '</div>'
      + '<div>' + '</div></div>';
  }
  function pintar(){
    if(i >= dudosos.length){ terminar(); return; }
    var par = dudosos[i], a = par.actual, b = par.nuevo;
    var comparar = function(d, otro){
      return campo('Año', d['año'], otro['año']) + campo('Soporte', d.formato, otro.formato)
        + campo('Formato', d.formatoDetalle, otro.formatoDetalle) + campo('Sello', d.sello, otro.sello)
        + campo('Catálogo', d.numeroCatalogo, otro.numeroCatalogo) + campo('Estado', d.estado, otro.estado)
        + campo('Temas', d.tracklist.length || '—', otro.tracklist.length || '—');
    };
    $('#revBody').innerHTML =
      '<div class="impbar"><span>Dudoso ' + (i + 1) + ' de ' + dudosos.length + '</span>'
      + '<span>' + esc(par.motivo || 'parecido') + ' · ' + Math.round(par.score * 100) + '%</span></div>'
      + '<div class="vs">'
        + ficha(a, 'La tuya', 'win').replace('<div></div>', comparar(a, b))
        + ficha(b, 'La del CSV', '').replace('<div></div>', comparar(b, a))
      + '</div>'
      + '<div class="rowb" style="justify-content:center"><label style="font-size:12.5px;color:var(--txt2);display:flex;align-items:center;gap:6px">'
      + '<input type="checkbox" id="revTodo"> Aplicar lo mismo al resto</label></div>';
    $('#revBtns').innerHTML =
      '<button class="btn sm" data-r="ambos">Guardar las dos</button>'
      + '<button class="btn sm" data-r="sustituir">Sustituir</button>'
      + '<button class="btn pri sm" data-r="mantener">Mantener la mía</button>';
    $('#revBtns').querySelectorAll('[data-r]').forEach(function(b2){
      b2.onclick = function(){
        var acc = b2.dataset.r;
        if($('#revTodo') && $('#revTodo').checked) aplicarTodo = acc;
        decidir(acc);
      };
    });
  }
  function decidir(acc){
    var par = dudosos[i], a = par.actual, b = par.nuevo;
    if(acc === 'sustituir'){
      b.id = a.id; b.fechaAlta = a.fechaAlta;
      b.portada = b.portada || a.portada;
      b.tracklist = b.tracklist.length ? b.tracklist : a.tracklist;
      b.etiquetas = a.etiquetas; b.escuchas = a.escuchas; b.prestadoA = a.prestadoA; b.prestadoDesde = a.prestadoDesde;
      DB.discos = DB.discos.map(function(x){ return x.id === a.id ? b : x; });
      nuevosCompletar.push(b);
      res.sustituir++;
    }else if(acc === 'ambos'){
      DB.discos.push(b);
      nuevosCompletar.push(b);
      res.ambos++;
    }else res.mantener++;
    i++;
    if(aplicarTodo && i < dudosos.length){ decidir(aplicarTodo); return; }
    pintar();
  }
  function terminar(){
    persist();
    s.remove();
    var partes = [];
    if(yaAnadidos) partes.push(yaAnadidos + ' añadidos');
    if(res.ambos) partes.push(res.ambos + ' guardados aparte');
    if(res.sustituir) partes.push(res.sustituir + ' sustituidos');
    if(res.mantener) partes.push(res.mantener + ' conservados');
    toast(partes.join(' · ') || 'Sin cambios');
    var pend = nuevosCompletar.filter(incompleto);
    if(pend.length) setTimeout(function(){ bulkRun(pend); }, 600);
  }
  $('#revSalir').onclick = terminar;
  pintar();
}

/* ---------- imagen local para la carátula ---------- */
function shrinkDataUri(dataUri, maxPx, q){
  return new Promise(function(res){
    var img = new Image();
    img.onload = function(){
      var m = maxPx || 600, sc = Math.min(1, m / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try{ res(c.toDataURL('image/jpeg', q || 0.82)); }catch(e){ res(dataUri); }
    };
    img.onerror = function(){ res(dataUri); };
    img.src = dataUri;
  });
}
function fileToDataUri(file, maxPx){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ shrinkDataUri(String(fr.result), maxPx || 600, .82).then(res); };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

/* ============================================================
   8. ESCÁNER DE CÓDIGOS DE BARRAS
      Chrome de escritorio y Android usan el lector del sistema.
      En iPhone se carga un lector en JavaScript que sí funciona
      sobre el motor de Safari.
   ============================================================ */
var ZX_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
var zxCargando = null;
function cargarZX(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(zxCargando) return zxCargando;
  zxCargando = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = ZX_URL;
    s.onload = function(){ res(window.ZXing); };
    s.onerror = function(){ zxCargando = null; rej(new Error('cdn')); };
    document.head.appendChild(s);
  });
  return zxCargando;
}
function lectorZX(){
  var Z = window.ZXing;
  var hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [
    Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.EAN_8,
    Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39
  ]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  return new Z.BrowserMultiFormatReader(hints, 200);
}
/* Reduce una foto a un tamaño que el lector maneja bien */
function fotoParaLeer(file, lado){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var m = lado || 1600, sc = Math.min(1, m / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, c.width, c.height);
        /* más contraste: los códigos impresos en fundas brillantes se leen mucho mejor */
        try{
          var dat = ctx.getImageData(0, 0, c.width, c.height), px = dat.data;
          for(var i = 0; i < px.length; i += 4){
            var g = (px[i] * .299 + px[i+1] * .587 + px[i+2] * .114);
            g = g < 110 ? 0 : (g > 150 ? 255 : (g - 110) * 255 / 40);
            px[i] = px[i+1] = px[i+2] = g;
          }
          ctx.putImageData(dat, 0, 0);
        }catch(e){}
        res(c.toDataURL('image/png'));
      };
      img.onerror = rej;
      img.src = String(fr.result);
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
function escanear(){
  var body = '<div id="scanwrap"><video id="vid" playsinline muted autoplay></video>'
    + '<div class="scanbox"><i></i><i></i><i></i><i></i></div><div class="scanline"></div></div>'
    + '<div class="note busy" id="snote" style="margin-top:12px">Preparando la cámara…</div>'
    + '<div class="warnb info" style="margin-top:14px">' + I.info
    + '<span>Acerca el código hasta que llene el recuadro y sujeta firme un par de segundos. '
    + 'Con poca luz cuesta: usa la opción de la foto.</span></div>'
    + '<div class="group"><div class="grow"><label>O escríbelo</label>'
    + '<input id="cbMan" type="text" inputmode="numeric" enterkeyhint="search" placeholder="0724384296520"></div></div>';
  var pie = '<button class="btn sm" id="btnFoto">' + I.img + 'Usar una foto</button>'
    + '<div class="rowb"><button class="btn" id="scanCancel">Cancelar</button><button class="btn pri" id="cbOk">Buscar</button></div>';
  var s = sheet('Escanear disco', body, pie);
  var video = s.querySelector('#vid'), stream = null, parar = false, lector = null;
  var nota = function(txt, cls){ var n = s.querySelector('#snote'); if(n){ n.className = 'note ' + (cls || 'busy'); n.textContent = txt; } };
  var cerrar = function(){
    parar = true;
    try{ if(lector) lector.reset(); }catch(e){}
    if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
  };
  var encontrado = function(codigo){
    if(parar) return;
    cerrar(); s.remove();
    altaPorCodigo(codigo);
  };
  s.querySelector('#scanCancel').onclick = function(){ cerrar(); s.remove(); };
  s.querySelector('[data-close]').addEventListener('click', cerrar);
  s.querySelector('#cbOk').onclick = function(){
    var v = s.querySelector('#cbMan').value.replace(/\D/g, '');
    if(v.length >= 8){ cerrar(); s.remove(); altaPorCodigo(v); }
    else nota('Ese código no parece válido', 'err');
  };
  s.querySelector('#cbMan').onkeydown = function(e){ if(e.key === 'Enter') s.querySelector('#cbOk').click(); };
  s.querySelector('#btnFoto').onclick = function(){
    var inp = document.getElementById('filePhoto');
    inp.value = '';
    inp.onchange = function(ev){
      var f = ev.target.files[0];
      if(!f) return;
      nota('Leyendo la foto…');
      cargarZX().then(function(){
        return fotoParaLeer(f, 1600);
      }).then(function(uri){
        var rd = lectorZX();
        return rd.decodeFromImageUrl(uri).catch(function(){
          return fotoParaLeer(f, 2400).then(function(u2){ return lectorZX().decodeFromImageUrl(u2); });
        });
      }).then(function(r){
        encontrado(r.getText());
      }).catch(function(){
        nota('No se distingue el código en esa foto. Prueba más cerca, con buena luz y el código recto.', 'err');
      });
    };
    inp.click();
  };

  /* La cámara necesita resolución alta: con 640x480 las barras finas no se resuelven */
  var restricciones = {
    video: {
      facingMode: {ideal:'environment'},
      width: {ideal: 1920}, height: {ideal: 1080},
      focusMode: 'continuous', advanced: [{focusMode:'continuous'}]
    }
  };
  var conNativo = function(){
    if(!('BarcodeDetector' in window)) return Promise.reject(new Error('sin api'));
    var det = new window.BarcodeDetector({formats:['ean_13','upc_a','ean_8','upc_e','code_128']});
    return navigator.mediaDevices.getUserMedia(restricciones).then(function(st){
      stream = st; video.srcObject = st;
      nota('Encuadra el código de barras de la contraportada');
      var tick = function(){
        if(parar) return;
        det.detect(video).then(function(c){
          if(c && c.length) return encontrado(c[0].rawValue);
          setTimeout(tick, 250);
        }).catch(function(){ setTimeout(tick, 450); });
      };
      video.play().then(function(){ setTimeout(tick, 500); }).catch(function(){ setTimeout(tick, 900); });
    });
  };
  var conZX = function(){
    nota('Preparando el lector…');
    return cargarZX().then(function(){
      lector = lectorZX();
      nota('Encuadra el código de barras de la contraportada');
      return lector.decodeFromConstraints(restricciones, video, function(result, err){
        if(result) encontrado(result.getText());
      });
    });
  };
  conNativo().catch(conZX).catch(function(){
    nota('No se pudo abrir la cámara. Escribe el código o usa una foto.', 'err');
  });
}

      || (a.titulo || '').localeCompare(b.titulo || '', 'es');
    if(sortBy === 'title') return claveOrden(a.titulo).localeCompare(claveOrden(b.titulo), 'es');

    if(sortBy === 'rating') return (b.valoracion || 0) - (a.valoracion || 0) || totalEscuchas(b) - totalEscuchas(a);

  var max = Math.max(6, Math.floor((Math.min(window.innerWidth, 1320) - 100) / anchoLomo));
  grupos.forEach(function(g){
    if(ancho + g.lista.length > max && fila.length){ filas.push(fila); fila = []; ancho = 0; }
    fila.push(g); ancho += g.lista.length;
  });
  if(fila.length) filas.push(fila);
  return '<div class="shelfwrap">' + filas.map(function(f){
    return '<div class="shelf-sec"><div class="shelfrow"><div class="shelf">'
      + f.map(function(g){
          return g.lista.map(function(d){
            var c = colorDe(d);
            return '<div class="spine' + (d.formato === 'CD' ? ' cd' : '') + '" data-id="' + d.id + '"'
              + ' data-peek="' + d.id + '" style="background:linear-gradient(96deg,' + c
              + ',color-mix(in srgb,' + c + ' 62%, #000))">'
              + '<span style="color:' + textoSobre(d) + '">' + esc(d.titulo) + '</span></div>';
          }).join('');
        }).join('')
      + '</div></div><div class="shelf-base"></div></div>';
  }).join('') + '</div>';
}
/* Blanco o negro según lo claro que sea el lomo */
function textoSobre(d){
  if(!d.color) return '#fff';
  var p = String(d.color).split(',').map(Number);
  var lum = (0.299 * p[0] + 0.587 * p[1] + 0.114 * p[2]) / 255;
  return lum > 0.62 ? 'rgba(20,20,22,.92)' : '#fff';
}
/* Calcula en segundo plano el color dominante que falte, para que los lomos
   tengan el color real de su portada */
var calculandoColor = false;
function coloresParaEstanteria(items){
  if(calculandoColor) return;
  var faltan = items.filter(function(d){ return d.portada && !d.color; }).slice(0, 60);
  if(!faltan.length) return;
  calculandoColor = true;
  var i = 0, hechos = 0;
  var siguiente = function(){
    if(i >= faltan.length){
      calculandoColor = false;
      if(hechos) paintCol();
      return;
    }
    var d = faltan[i++];
    colorDominante(d.portada).then(function(c){
      d.color = c; hechos++;
      persist(true);
    }).catch(function(){}).then(function(){ setTimeout(siguiente, 30); });
  };
  for(var k = 0; k < 4; k++) setTimeout(siguiente, k * 60);
}
function montarPeek(root){
  var peek = document.getElementById('shelfPeek');
  if(!peek){
    peek = document.createElement('div');
    peek.id = 'shelfPeek';
    peek.className = 'shelf-peek';
    document.body.appendChild(peek);
  }
  var ocultar = function(){ peek.classList.remove('on'); };
  root.querySelectorAll('[data-peek]').forEach(function(el){
    el.onmouseenter = function(){
      var d = DB.discos.filter(function(x){ return x.id === el.dataset.peek; })[0];
      if(!d) return;
      peek.innerHTML = (d.portada ? '<img class="pimg" src="' + esc(d.portada) + '" alt="" onerror="this.style.opacity=.15">'
          : '<div class="pimg"></div>')
        + '<div class="pinf"><div class="pt">' + esc(d.titulo) + '</div>'
        + '<div class="pa">' + esc(d.artista) + '</div>'
        + '<div class="py">' + [d['año'], d.formato, d.sello].filter(Boolean).join(' · ') + '</div></div>';
      var r = el.getBoundingClientRect();
      var x = Math.min(window.innerWidth - 206, Math.max(10, r.left + r.width / 2 - 95));
      var arriba = r.top > 300;
      peek.style.left = x + 'px';
      peek.style.top = (arriba ? r.top - 290 : r.bottom + 14) + 'px';
      peek.classList.add('on');
    };
    el.onmouseleave = ocultar;
  });
  root.addEventListener('scroll', ocultar, {passive:true});
  window.addEventListener('scroll', ocultar, {passive:true});
}

function paintCol(){
  if(!document.getElementById('board')) return;
  var dups = dupSet();
  var base = coleccion();

  var gsel = document.getElementById('fGenre');
  var gs = [];
  base.forEach(function(d){ if(d.genero && gs.indexOf(d.genero) < 0) gs.push(d.genero); });
  gs.sort();
  gsel.innerHTML = '<option value="">Todos los géneros</option>'
    + gs.map(function(g){ return '<option value="' + esc(g) + '"' + (g === fGen ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('');

  var chips = [];
  if(fArt) chips.push(['artista', fArt]);
  if(fTag) chips.push(['etiqueta', fTag]);
  if(fDec) chips.push(['década', fDec]);
  if(fPais) chips.push(['país', nombrePais(fPais)]);
  if(fSello) chips.push(['sello', fSello]);
  document.getElementById('activeChips').innerHTML = chips.map(function(c){
    return '<span class="chipf">' + esc(c[1]) + '<button data-clear="' + c[0] + '">' + I.x + '</button></span>';
  }).join('');
  document.querySelectorAll('[data-clear]').forEach(function(b){
    b.onclick = function(){
      var k = b.dataset.clear;
      if(k === 'artista') fArt = ''; if(k === 'etiqueta') fTag = ''; if(k === 'década') fDec = '';
      if(k === 'país') fPais = ''; if(k === 'sello') fSello = '';
      paintCol();
    };
  });

  var list = ordenar(filtrados(base));

  var nv = base.filter(function(d){ return d.formato === 'Vinilo'; }).length;
  var nc = base.filter(function(d){ return d.formato === 'CD'; }).length;
  var anio = String(new Date().getFullYear());
  var esteAnio = base.filter(function(d){
    return (d.escuchasFechas || []).some(function(f){ return String(f).slice(0, 4) === anio; });
  }).length;
  var segs = 0;
  base.forEach(function(d){
    d.tracklist.forEach(function(t){
      var m = String(t.duracion || '').match(/^(\d+):(\d{2})$/);
      if(m) segs += (+m[1]) * 60 + (+m[2]);
    });
  });
  var horas = segs / 3600;

  var res = document.getElementById('resumen');
  if(res){
    var cel = function(icono, valor, etiqueta, clase){
      return '<div><div class="ri" style="color:var(--txt3)">' + icono + '</div>'
        + '<div class="v ' + (clase || '') + '">' + valor + '</div><div class="k">' + etiqueta + '</div></div>';
    };
    res.innerHTML = cel(I.layers, base.length, 'discos')
      + cel(I.vinBadge, nv, 'vinilos', 'vin')
      + cel(I.cdBadge, nc, 'CDs', 'cd')
      + cel(I.reloj2, Math.round(horas), 'horas');
  }
  document.getElementById('kpis').innerHTML =
      kpi(I.layers, 'Discos', base.length, 'var(--blue)')
    + kpi(I.vinBadge, 'Vinilos', nv, 'var(--purple)')
    + kpi(I.cdBadge, 'CDs', nc, 'var(--teal)')
    + kpi(I.reloj2, 'Horas de música', (horas >= 10 ? Math.round(horas) : horas.toFixed(1)) + '<small>h</small>', 'var(--orange)')
    + kpi(I.playF, 'Escuchados en ' + anio, esteAnio, 'var(--green)', 'esc');

  document.querySelectorAll('[data-kpi]').forEach(function(el){
    el.onclick = function(){
      fType = el.dataset.kpi;
      document.querySelectorAll('#segType button').forEach(function(x){ x.className = ''; });
      var b = document.querySelector('#segType [data-f=' + fType + ']');
      if(b) b.className = 'on';
      else document.querySelector('#segType [data-f=all]').className = 'on';
      paintCol();
    };
  });

  paintBanner();

  var board = document.getElementById('board');
  if(!list.length){
    board.innerHTML = '<div class="blank">' + I.music + '<h3>' + (base.length ? 'Sin resultados' : 'Tu discoteca está vacía')
      + '</h3><p>' + (base.length ? 'Prueba con otra búsqueda o quita algún filtro.' : 'Añade un disco o importa tu CSV de Discogs.') + '</p></div>';
    pintarAZ([]);
    return;
  }

  if(grupo === 'none'){
    board.innerHTML = bloque(list, dups);
    pintarAZ(sortBy === 'artist' || sortBy === 'title' ? list.map(function(d){ return (sortBy === 'artist' ? d.artista : d.titulo); }) : []);
  }else{
    var orden = [], mapa = {};
    list.forEach(function(d){
      var k = claveGrupo(d);
      if(!mapa[k]){ mapa[k] = []; orden.push(k); }
      mapa[k].push(d);
    });
    if(grupo === 'artista' || grupo === 'sello' || grupo === 'pais' || grupo === 'genero' || grupo === 'ubicacion'){
      orden.sort(function(a, b){ return claveOrden(a).localeCompare(claveOrden(b), 'es'); });
    }
    if(grupo === 'decada') orden.sort();
    board.innerHTML = orden.map(function(k, i){
      var items = mapa[k];
      var av = items.filter(function(d){ return d.portada; })[0];
      return '<section class="gsec" id="g' + i + '"><div class="ghead">'
        + (grupo === 'artista' && av ? '<img class="gav" src="' + esc(av.portada) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '')
        + '<h3>' + esc(k) + '</h3><span class="n">' + items.length + '</span>'
        + (grupo === 'artista' && !readOnly ? '<button class="btn xs gbtn" data-gaps="' + esc(k) + '">' + I.gap + 'Huecos</button>' : '')
        + '<button class="btn xs gbtn" data-only="' + esc(k) + '">Ver solo</button>'
        + '</div>' + bloque(items, dups) + '</section>';
    }).join('');
    pintarAZ(orden, true);
    board.querySelectorAll('[data-gaps]').forEach(function(b){
      b.onclick = function(e){ e.stopPropagation(); verHuecos(b.dataset.gaps); };
    });
    board.querySelectorAll('[data-only]').forEach(function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var k = b.dataset.only;
        if(grupo === 'artista') fArt = k;
        else if(grupo === 'genero') fGen = k;
        else if(grupo === 'sello') fSello = k;
        else if(grupo === 'decada') fDec = k;
        grupo = 'none';
        document.getElementById('selGroup').value = 'none';
        paintCol();
      };
    });
  }
  enlazarTiles(board, dups);
  if(modo === 'shelf'){ montarPeek(board); coloresParaEstanteria(list); }
  montarPulsacionLarga(board);
  if(modo === 'grid'){
    var tiles = board.querySelectorAll('.tile');
    for(var i = 0; i < tiles.length && i < 40; i++) tiles[i].style.animationDelay = (i * 22) + 'ms';
  }
}
function kpi(icon, label, val, color, filtro){

    + '<div class="ico" style="background:color-mix(in srgb,' + color + ' 15%, transparent);color:' + color + '">' + icon + '</div>'
    + '<div style="min-width:0"><div class="lbl">' + label + '</div><div class="val">' + val + '</div></div></div>';

function enlazarTiles(root, dups){
  root.querySelectorAll('.tile,.lrow,.spine').forEach(function(t){
    t.onclick = function(e){
      if(e.target.closest('[data-ai]') || e.target.closest('[data-oir]') || e.target.closest('[data-comprado]')) return;
      if(selMulti){ alternarSeleccion(t.dataset.id); return; }
      openDetail(t.dataset.id, t.querySelector('.art') || t.querySelector('.mini'));
    };
    if(selMulti && seleccion[t.dataset.id]) t.classList.add('sel');
  });
  root.querySelectorAll('[data-oir]').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var puesto = marcarEscucha(b.dataset.oir);
      b.className = 'oir' + (puesto ? ' hoy' : '');
      b.innerHTML = puesto ? I.check : I.playF;
      b.dataset.tip = puesto ? 'Ya lo marcaste hoy' : 'Marcar que lo has escuchado';
      var d = DB.discos.filter(function(x){ return x.id === b.dataset.oir; })[0];
      var y = b.closest('.tile') && b.closest('.tile').querySelector('.meta .y');
      if(y && d) y.textContent = (d['año'] || '—') + (d.genero ? ' · ' + d.genero : '')
        + (totalEscuchas(d) ? ' · ▶ ' + totalEscuchas(d) : '');
      refrescarContadores();
    };
  });
  root.querySelectorAll('[data-ai]').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      b.classList.add('busy'); b.disabled = true;
      enrich(b.dataset.ai, true).then(function(ok){
        toast(ok ? 'Ficha actualizada' : 'No se encontró el disco · prueba a pegar su URL de MusicBrainz', !ok);
        paintCol();
      });
    };
  });
}

  claves.forEach(function(k, i){

/* ---------- paleta de búsqueda ⌘K ---------- */
function abrirPaleta(){
  var p = document.createElement('div');
  p.className = 'pal';
  p.innerHTML = '<div class="palbox"><div class="palin">' + I.search
    + '<input id="pq" placeholder="Buscar discos, artistas, canciones o acciones…" autocomplete="off"></div>'
    + '<div class="palres" id="pres"></div>'
    + '<div class="palhint"><span>↑↓ moverse</span><span>↵ abrir</span><span>esc cerrar</span></div></div>';
  document.body.appendChild(p);
  var inp = p.querySelector('#pq'), res = p.querySelector('#pres'), sel = 0, items = [];
  var acciones = [
    {t:'Añadir disco', s:'Nueva ficha', k:'Acción', run:function(){ openForm(null); }},
    {t:'Añadir a deseos', s:'Lista de deseos', k:'Acción', run:function(){ openForm(null, 'deseos'); }},
    {t:'Completar todo automáticamente', s:'Rellena las fichas incompletas', k:'Acción', run:function(){ setView('col'); bulkRun(); }},
    {t:'Guardar', s:'Escribe o descarga el index.html', k:'Acción', run:function(){ guardar(); }},
    {t:'Sorpréndeme', s:'Un disco al azar', k:'Acción', run:function(){ discoAlAzar(); }},
    {t:'Escanear código de barras', s:'Alta con la cámara', k:'Acción', run:function(){ escanear(); }},
    {t:'Estadísticas', s:'Gráficos de la colección', k:'Ir a', run:function(){ setView('stats'); }},
    {t:'Archivo y copias', s:'Guardar, exportar, importar', k:'Ir a', run:function(){ setView('db'); }},
    {t:'Catálogo imprimible', s:'Genera un PDF con portadas', k:'Acción', run:function(){ catalogoImprimible(); }}
  ];
  function pinta(){
    var q = inp.value.trim().toLowerCase();
    items = [];
    if(q){
      var vistos = 0;
      DB.discos.forEach(function(d){
        if(vistos >= 8) return;
        var enFicha = plain(d.titulo + ' ' + d.artista + ' ' + d.sello).indexOf(plain(q)) >= 0;
        var cancion = enFicha ? null : d.tracklist.filter(function(t){ return plain(t.titulo).indexOf(plain(q)) >= 0; })[0];
        if(enFicha || cancion){
          items.push({
            t: d.titulo,
            s: d.artista + ' · ' + (d['año'] || '') + (cancion ? ' · ♪ ' + cancion.titulo : '')
               + (d.lista === 'deseos' ? ' · deseos' : '') + (escuchadoHoy(d) ? ' · escuchado hoy' : ''),
            img: d.portada, d: d, k: cancion ? 'Canción' : d.formato
          });
          if(!readOnly) items.push({
            t: 'Marcar escucha: ' + d.titulo, s: 'Registra que lo has puesto hoy', k: '▶',
            run: (function(x){ return function(){ marcarEscucha(x.id); renderAll(); }; })(d)
          });
          vistos++;
        }
      });
      var arts = [];
      DB.discos.forEach(function(d){ if(d.artista && arts.indexOf(d.artista) < 0 && plain(d.artista).indexOf(plain(q)) >= 0) arts.push(d.artista); });
      arts.slice(0, 3).forEach(function(a){
        items.push({t:a, s:'Ver todos sus discos', k:'Artista', run:function(){ fArt = a; grupo = 'none'; document.getElementById('selGroup').value = 'none'; setView('col'); paintCol(); }});
      });
      acciones.forEach(function(a){ if(a.t.toLowerCase().indexOf(q) >= 0) items.push(a); });
    }else{
      items = acciones.slice();
    }
    sel = 0;
    res.innerHTML = items.map(function(it, i){
      var img = it.img ? '<img src="' + esc(it.img) + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '<div class="phb">' + I.music + '</div>';
      return '<div class="palrow' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '">' + img
        + '<div class="txt"><div class="t">' + esc(it.t) + '</div><div class="s">' + esc(it.s || '') + '</div></div>'
        + '<span class="k">' + esc(it.k || '') + '</span></div>';
    }).join('') || '<div class="tl-empty">Sin resultados</div>';
    res.querySelectorAll('.palrow').forEach(function(r){
      r.onclick = function(){ ejecutar(+r.dataset.i); };
    });
  }
  function marca(){
    res.querySelectorAll('.palrow').forEach(function(r, i){ r.className = 'palrow' + (i === sel ? ' sel' : ''); });
    var el = res.querySelectorAll('.palrow')[sel];
    if(el) el.scrollIntoView({block:'nearest'});
  }
  function ejecutar(i){
    var it = items[i];
    if(!it) return;
    cerrar();
    if(it.run) it.run();
    else if(it.d) openDetail(it.d.id);
  }
  function cerrar(){ p.remove(); document.removeEventListener('keydown', tecla, true); }
  function tecla(e){
    if(e.key === 'Escape'){ e.preventDefault(); cerrar(); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(sel + 1, items.length - 1); marca(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(sel - 1, 0); marca(); }
    else if(e.key === 'Enter'){ e.preventDefault(); ejecutar(sel); }
  }
  inp.oninput = pinta;
  document.addEventListener('keydown', tecla, true);
  p.addEventListener('mousedown', function(e){ if(e.target === p) cerrar(); });
  pinta();
  inp.focus();
}

  var ds = coleccion();
  if(!ds.length) return;
  openDetail(ds[Math.floor(Math.random() * ds.length)].id);
}

  s.addEventListener('scroll', function(){ hd.classList.toggle('visto', s.scrollTop > 90); }, {passive:true});
  s.dataset.cerrable = '1';
  s.addEventListener('mousedown', function(e){ if(e.target === s) cerrar(); });
  function onKey(ev){ if(ev.key === 'Escape' && !document.querySelector('.pal')) cerrar(); }
  document.addEventListener('keydown', onKey);
  arrastrarParaCerrar(s, cerrar);
  s.scrollTop = 0;
  return s;
}
/* En el móvil, deslizar desde el borde izquierdo cierra la hoja, como el gesto
   de volver atrás. Nunca interfiere con el desplazamiento vertical. */
function arrastrarParaCerrar(scrim, cerrar){
  var hoja = scrim.querySelector('.sheet');
  if(!hoja || window.innerWidth > 760) return;
  var x0 = null, y0 = 0, dx = 0, valido = false;
  scrim.addEventListener('touchstart', function(e){
    var t = e.touches[0];
    if(t.clientX > 26){ x0 = null; return; }
    x0 = t.clientX; y0 = t.clientY; dx = 0; valido = false;
    hoja.style.transition = 'none';
  }, {passive:true});
  scrim.addEventListener('touchmove', function(e){
    if(x0 === null) return;
    var t = e.touches[0];
    dx = t.clientX - x0;
    var dyAbs = Math.abs(t.clientY - y0);
    if(!valido){
      if(dx > 12 && dx > dyAbs) valido = true;
      else if(dyAbs > 12){ x0 = null; hoja.style.transform = ''; return; }
    }
    if(!valido) return;
    hoja.style.transform = 'translateX(' + Math.max(0, dx) + 'px)';
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  var soltar = function(){
    if(x0 === null) return;
    hoja.style.transition = 'transform .26s var(--ease)';
    if(valido && dx > 90){ hoja.style.transform = 'translateX(100%)'; setTimeout(cerrar, 220); }
    else hoja.style.transform = '';
    x0 = null; dx = 0; valido = false;
  };
  scrim.addEventListener('touchend', soltar);
  scrim.addEventListener('touchcancel', soltar);
}

/* ---------- reproductor ---------- */
var player = null, playingId = '';
function pararAudio(){
  if(player){ player.pause(); player.currentTime = 0; }
  playingId = '';
}
function reproducir(url, id, boton){
  if(!player) player = document.getElementById('player');
  if(playingId === id){ pararAudio(); pintarBotonesAudio(); return; }
  player.src = url;
  player.play().then(function(){ playingId = id; pintarBotonesAudio(); }).catch(function(){ toast('No se pudo reproducir', true); });
  player.ontimeupdate = function(){
    var fila = document.querySelector('.trk.playing .prog');
    if(fila && player.duration) fila.style.width = (player.currentTime / player.duration * 100) + '%';
  };
  player.onended = function(){ playingId = ''; pintarBotonesAudio(); };
}
function pintarBotonesAudio(){
  document.querySelectorAll('[data-prev]').forEach(function(b){
    var on = b.dataset.prev === playingId;
    b.className = 'play' + (on ? ' on' : '');
    b.innerHTML = on ? I.pause : I.play;
    var fila = b.closest('.trk');
    fila.className = 'trk' + (on ? ' playing' : '');
    var pr = fila.querySelector('.prog');
    if(on && !pr){ fila.insertAdjacentHTML('beforeend', '<span class="prog"></span>'); }
    else if(!on && pr) pr.remove();
  });
}

/* La portada pulsada vuela hasta su posición en la ficha */
function volarPortada(origen, destino){
  if(!origen || !destino || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var a = origen.getBoundingClientRect(), b = destino.getBoundingClientRect();
  if(!a.width || !b.width) return;
  var clon = origen.cloneNode(true);
  clon.style.cssText = 'position:fixed;z-index:70;margin:0;pointer-events:none;border-radius:12px;overflow:hidden;'
    + 'left:' + a.left + 'px;top:' + a.top + 'px;width:' + a.width + 'px;height:' + a.height + 'px;'
    + 'transition:all .42s cubic-bezier(.32,.72,0,1);box-shadow:0 12px 40px rgba(0,0,0,.28)';
  document.body.appendChild(clon);
  destino.style.opacity = '0';
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var r = destino.getBoundingClientRect();
      clon.style.left = r.left + 'px';
      clon.style.top = r.top + 'px';
      clon.style.width = r.width + 'px';
      clon.style.height = r.height + 'px';
      clon.style.borderRadius = getComputedStyle(destino).borderRadius;
    });
  });
  setTimeout(function(){
    destino.style.opacity = '';
    clon.remove();
  }, 440);
}

function pintarTracklist(d, tracks){
  var porDisco = {}, orden = [];
  tracks.forEach(function(t, i){
    var k = t.disco || 1;
    if(!porDisco[k]){ porDisco[k] = []; orden.push(k); }
    porDisco[k].push({t:t, i:i});
  });
  var varios = orden.length > 1;
  var caraDe = function(t){
    var m = String(t.pos || '').match(/^([A-Z])/i);
    return m ? m[1].toUpperCase() : '';
  };
  return orden.map(function(k){
    var lista = porDisco[k];
    var caras = [], porCara = {};
    lista.forEach(function(x){
      var c = caraDe(x.t);
      if(!porCara[c]){ porCara[c] = []; caras.push(c); }
      porCara[c].push(x);
    });
    var hayCaras = caras.length > 1 || (caras.length === 1 && caras[0] !== '');
    var cuerpo = hayCaras
      ? caras.map(function(c){
          return (c ? '<div class="cara">Cara ' + c + '</div>' : '')
            + porCara[c].map(function(x, j){ return filaTrack(d, x.t, x.i, j + 1); }).join('');
        }).join('')
      : lista.map(function(x, j){ return filaTrack(d, x.t, x.i, j + 1); }).join('');
    return (varios ? '<div class="unidad">' + (d.formato === 'Vinilo' ? 'Disco ' : 'CD ') + k
        + '<span>' + lista.length + ' temas' + (duracionLista(lista.map(function(x){ return x.t; })) ? ' · '
        + duracionLista(lista.map(function(x){ return x.t; })) : '') + '</span></div>' : '')
      + '<div class="tl">' + cuerpo + '</div>';
  }).join('');
}
function duracionLista(ts){
  var seg = 0;
  ts.forEach(function(t){
    var m = String(t.duracion || '').match(/^(\d+):(\d{2})$/);
    if(m) seg += (+m[1]) * 60 + (+m[2]);
  });
  if(!seg) return '';
  return Math.round(seg / 60) + ' min';
}

/* ---------- fusionar duplicados ---------- */
function fusionarDuplicados(base){
  var grupo2 = DB.discos.filter(function(x){ return key(x) === key(base); });
  if(grupo2.length < 2){ toast('No hay fichas repetidas de este disco'); return; }
  var campos = ['año','genero','sello','numeroCatalogo','pais','estado','fechaCompra','portada','notas','formatoDetalle','mbid','rgid','discogs','codigoBarras'];
  var res = normDisc(JSON.parse(JSON.stringify(grupo2[0])));
  grupo2.forEach(function(d){
    campos.forEach(function(f){ if(!res[f] && d[f]) res[f] = d[f]; });
    if(!res.precioCompra && d.precioCompra) res.precioCompra = d.precioCompra;
    if(res.tracklist.length < d.tracklist.length) res.tracklist = d.tracklist;
    d.etiquetas.forEach(function(t){ if(res.etiquetas.indexOf(t) < 0) res.etiquetas.push(t); });
    res.escuchas = Math.max(res.escuchas, d.escuchas || 0);
  });
  var s = sheet('Fusionar ' + grupo2.length + ' fichas',
    '<p style="font-size:14.5px;color:var(--txt2);line-height:1.5;margin:0 0 14px">Se conservará una sola ficha con lo mejor de cada una: '
    + 'el tracklist más completo, la portada, y todos los campos rellenos. Las demás se eliminarán.</p>'
    + '<div class="specs">' + spec('Título', res.titulo) + spec('Artista', res.artista) + spec('Año', res['año'] || '—')
    + spec('Sello', res.sello || '—') + spec('Temas', res.tracklist.length) + spec('Portada', res.portada ? 'Sí' : 'No') + '</div>',
    '<span></span><div class="rowb"><button class="btn" data-close5>Cancelar</button><button class="btn pri" id="okf">Fusionar</button></div>');
  s.querySelector('[data-close5]').onclick = function(){ s.remove(); };
  s.querySelector('#okf').onclick = function(){
    guardarDeshacer(grupo2, 'fusionar fichas');
    var ids = grupo2.map(function(d){ return d.id; });
    DB.discos = DB.discos.filter(function(d){ return ids.indexOf(d.id) < 0; });
    DB.discos.push(res);
    persist(); s.remove();
    toast(grupo2.length + ' fichas fusionadas en una');
  };
}

function estrellaSVG(llena){
  return '<svg class="ic st' + (llena ? ' on solid' : '') + '" viewBox="0 0 24 24">'
    + '<path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>';
}
function estrellasHtml(n, grande, id){
  var v = Number(n) || 0, out = '<span class="stars' + (grande ? ' big' : '') + '"' + (id ? ' data-rate="' + id + '"' : '') + '>';
  for(var i = 1; i <= 5; i++){
    out += grande ? '<span data-v="' + i + '" role="button" aria-label="' + i + ' estrellas">' + estrellaSVG(i <= v) + '</span>'
                  : estrellaSVG(i <= v);
  }
  return out + '</span>';
}
var TEXTO_VALORACION = ['Sin valorar', 'Flojo', 'Correcto', 'Bueno', 'Muy bueno', 'Imprescindible'];
function montarEstrellas(caja, d, alCambiar){
  if(!caja) return;
  caja.querySelectorAll('[data-v]').forEach(function(el){
    el.onclick = function(){
      var v = +el.dataset.v;
      d.valoracion = (d.valoracion === v) ? 0 : v;

      caja.innerHTML = estrellasHtml(d.valoracion, true, d.id).replace(/^<span class="stars big"[^>]*>|<\/span>$/g, '');
      montarEstrellas(caja, d, alCambiar);
      if(alCambiar) alCambiar(d.valoracion);
    };
  });
}

/* ---------- Wikipedia en español ---------- */
var wikiCache = {};
function wikiBuscar(termino){
  if(wikiCache[termino]) return Promise.resolve(wikiCache[termino]);
  var api = 'https://es.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts|pageimages'
    + '&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=300&redirects=1&generator=search&gsrlimit=1&gsrsearch='
    + encodeURIComponent(termino);
  return fetch(api).then(function(r){ return r.json(); }).then(function(j){
    var pages = j && j.query && j.query.pages;
    if(!pages) throw new Error('sin resultados');
    var k = Object.keys(pages)[0], p = pages[k];
    if(!p || !p.extract) throw new Error('sin extracto');
    var res = {
      titulo: p.title,
      extracto: p.extract,
      img: p.thumbnail ? p.thumbnail.source : '',
      url: 'https://es.wikipedia.org/wiki/' + encodeURIComponent(p.title.replace(/ /g, '_'))
    };
    wikiCache[termino] = res;
    return res;
  });
}
function verWikipedia(d, sobreAlbum){
  var termino = sobreAlbum ? (d.titulo + ' ' + d.artista + ' álbum') : d.artista;
  var s = sheet(sobreAlbum ? d.titulo : d.artista,
    '<div class="note busy" id="wnote">Buscando en Wikipedia en español…</div><div id="wbody"></div>',
    '<button class="btn" id="wOtro">' + (sobreAlbum ? 'Ver el artista' : 'Ver el álbum') + '</button>'
    + '<a class="btn pri" id="wLink" target="_blank" rel="noopener" href="#">Abrir en Wikipedia</a>');
  var $ = function(q){ return s.querySelector(q); };
  $('#wOtro').onclick = function(){ s.remove(); verWikipedia(d, !sobreAlbum); };
  wikiBuscar(termino).then(function(w){
    $('#wnote').style.display = 'none';
    $('#wLink').href = w.url;
    var parrafos = w.extracto.split('\n').filter(function(p){ return p.trim().length > 30; }).slice(0, 3);
    $('#wbody').innerHTML =
      '<div class="wikihd">' + (w.img ? '<img src="' + esc(w.img) + '" alt="">' : '')
      + '<div><div class="n">' + esc(w.titulo) + '</div><div class="d">Wikipedia en español</div></div></div>'
      + '<div class="wiki">' + parrafos.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('')
      + '<div class="fuente">Extracto de <a href="' + esc(w.url) + '" target="_blank" rel="noopener">'
      + esc(w.titulo) + '</a> en Wikipedia, bajo licencia CC BY-SA.</div></div>';
  }).catch(function(){
    $('#wnote').className = 'note err';
    $('#wnote').textContent = 'No hay artículo en español sobre ' + (sobreAlbum ? 'este disco' : 'este artista') + '.';
    $('#wLink').href = 'https://es.wikipedia.org/w/index.php?search=' + encodeURIComponent(termino);
  });
}

function duracionTotal(d){
  var seg = 0, n = 0;
  (d.tracklist || []).forEach(function(t){
    var m = String(t.duracion || '').match(/^(\d+):(\d{2})$/);
    if(m){ seg += (+m[1]) * 60 + (+m[2]); n++; }
  });
  if(!n) return '';
  var h = Math.floor(seg / 3600), mi = Math.round(seg % 3600 / 60);
  return h ? h + ' h ' + mi + ' min' : mi + ' min';
}
function cargarExtra(d){
  if(!d.mbid) return Promise.reject(new Error('sin mbid'));
  return mbGet('release/' + d.mbid + '?inc=artist-rels+label-rels+release-groups+genres+ratings+recordings')
    .then(function(r){
      var rg = r['release-group'] || {};
      var creditos = {};
      (r.relations || []).forEach(function(rel){
        var tipo = ROLES[rel.type] || null;
        if(!tipo) return;
        var quien = (rel.artist && rel.artist.name) || (rel.label && rel.label.name) || (rel.place && rel.place.name);
        if(!quien) return;
        creditos[tipo] = creditos[tipo] ? (creditos[tipo].indexOf(quien) < 0 ? creditos[tipo] + ', ' + quien : creditos[tipo]) : quien;
      });
      var tags = ((r.genres || []).concat(rg.genres || []))
        .sort(function(a, b){ return (b.count || 0) - (a.count || 0); })
        .map(function(g){ return g.name; }).filter(function(v, i, a){ return a.indexOf(v) === i; }).slice(0, 6);
      var ex = {
        fecha: r.date || '',
        primera: rg['first-release-date'] || '',
        packaging: r.packaging || '',
        idioma: (r['text-representation'] && r['text-representation'].language) || '',
        estado: r.status || '',
        barcode: r.barcode || '',
        discos: (r.media || []).length,
        tipo: rg['primary-type'] || '',
        secundarios: (rg['secondary-types'] || []).join(', '),
        nota: (rg.rating && rg.rating.value) || 0,
        votos: (rg.rating && rg.rating['votes-count']) || 0,
        tags: tags,
        creditos: creditos,
        cargado: nowISO()
      };
      d.extra = ex;
      if(!d.codigoBarras && ex.barcode) d.codigoBarras = ex.barcode;
      persist(true);
      return ex;
    });
}

function otraEdicion(d){

    if(e) return e;
  }
  return DB.discos.filter(function(x){
    return x.id !== d.id && x.lista === d.lista && x.formato !== d.formato
      && plain(x.artista) === plain(d.artista) && plain(x.titulo) === plain(d.titulo);
  })[0] || null;
}

}
function separarEdiciones(d){

function candidatasEnlace(d){

/* ---------- curiosidades ---------- */
function curiosidades(){
  var ds = coleccion();
  if(ds.length < 4) return [];
  var out = [];
  var cuenta = function(fn){
    var m = {};
    ds.forEach(function(d){ var k = fn(d); if(k) m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).map(function(k){ return {k:k, v:m[k]}; }).sort(function(a, b){ return b.v - a.v; });
  };
  var art = cuenta(function(d){ return d.artista; });
  var sel = cuenta(function(d){ return d.sello; });
  var dec = cuenta(function(d){ var y = parseInt(d['año']); return y ? Math.floor(y / 10) * 10 : 0; });
  var anios = cuenta(function(d){ return d['año']; });
  var pais = cuenta(function(d){ return d.pais; });
  var vin = ds.filter(function(d){ return d.formato === 'Vinilo'; }).length;
  var temas = ds.reduce(function(a, d){ return a + d.tracklist.length; }, 0);

  if(art[0] && art[0].v > 1) out.push('Tu artista más presente es <b>' + esc(art[0].k) + '</b>, con <b>' + art[0].v + ' discos</b> en la estantería.');
  if(dec[0]) out.push('La década de los <b>' + dec[0].k + '</b> domina tu colección: <b>' + dec[0].v + ' discos</b>, un ' + Math.round(dec[0].v / ds.length * 100) + '% del total.');
  if(anios[0] && anios[0].v > 2) out.push('<b>' + anios[0].k + '</b> fue un buen año para ti: tienes <b>' + anios[0].v + ' discos</b> publicados ese año.');
  if(sel[0] && sel[0].v > 2) out.push('El sello que más se repite es <b>' + esc(sel[0].k) + '</b>, con <b>' + sel[0].v + ' referencias</b>.');
  if(temas) out.push('Entre todos tus discos suman <b>' + temas + ' canciones</b>. Puestas seguidas serían más de <b>' + Math.round(temas * 4 / 60) + ' horas</b> de música.');
  out.push('Tu colección es <b>' + Math.round(vin / ds.length * 100) + '% vinilo</b> y <b>' + Math.round((ds.length - vin) / ds.length * 100) + '% CD</b>.');
  if(pais[0] && PAISES[pais[0].k]) out.push('La mayoría de tus prensados vienen de <b>' + nombrePais(pais[0].k) + '</b> ' + bandera(pais[0].k) + ': <b>' + pais[0].v + ' discos</b>.');

  var viejo = ds.filter(function(d){ return parseInt(d['año']) > 1900; }).sort(function(a, b){ return parseInt(a['año']) - parseInt(b['año']); })[0];
  if(viejo) out.push('El disco más veterano es <b>' + esc(viejo.titulo) + '</b> de ' + esc(viejo.artista) + ', de <b>' + viejo['año'] + '</b>. Tiene ya ' + (new Date().getFullYear() - parseInt(viejo['año'])) + ' años.');
  var nuevo = ds.slice().sort(function(a, b){ return parseInt(b['año'] || 0) - parseInt(a['año'] || 0); })[0];
  if(nuevo && nuevo['año']) out.push('Lo más reciente que tienes es de <b>' + nuevo['año'] + '</b>: ' + esc(nuevo.titulo) + ', de ' + esc(nuevo.artista) + '.');

  var largo = ds.filter(function(d){ return d.tracklist.length; }).sort(function(a, b){ return b.tracklist.length - a.tracklist.length; })[0];
  if(largo) out.push('<b>' + esc(largo.titulo) + '</b> es tu disco con más canciones: <b>' + largo.tracklist.length + ' temas</b>.');

  var titulos = {};
  ds.forEach(function(d){ d.tracklist.forEach(function(t){ var k = plain(t.titulo); if(k.length > 3) titulos[k] = (titulos[k] || 0) + 1; }); });
  var rep = Object.keys(titulos).filter(function(k){ return titulos[k] > 1; }).sort(function(a, b){ return titulos[b] - titulos[a]; })[0];
  if(rep){
    var nombreReal = '';
    ds.some(function(d){ return d.tracklist.some(function(t){ if(plain(t.titulo) === rep){ nombreReal = t.titulo; return true; } }); });
    out.push('Tienes <b>' + titulos[rep] + ' versiones</b> de la misma canción: <b>' + esc(nombreReal) + '</b>.');
  }

  var conNota = ds.filter(function(d){ return d.valoracion; });
  if(conNota.length > 2){
    var media = conNota.reduce(function(a, d){ return a + d.valoracion; }, 0) / conNota.length;
    out.push('Has valorado <b>' + conNota.length + ' discos</b> con una media de <b>' + media.toFixed(1) + ' estrellas</b>.');
    var cinco = conNota.filter(function(d){ return d.valoracion === 5; });
    if(cinco.length) out.push('Para ti son imprescindibles <b>' + cinco.length + ' discos</b>. El primero de la lista: ' + esc(cinco[0].titulo) + '.');
  }
  var escuchados = ds.filter(function(d){ return totalEscuchas(d) > 0; });
  if(escuchados.length){
    var top = escuchados.slice().sort(function(a, b){ return totalEscuchas(b) - totalEscuchas(a); })[0];
    out.push('El disco que más has puesto es <b>' + esc(top.titulo) + '</b>, <b>' + totalEscuchas(top) + ' veces</b>.');
    out.push('Llevas <b>' + escuchados.length + ' discos</b> estrenados de ' + ds.length + '. Te quedan <b>' + (ds.length - escuchados.length) + '</b> por poner.');
  }
  var gasto = ds.reduce(function(a, d){ return a + (d.precioCompra || 0); }, 0);
  if(gasto > 0) out.push('Lo que llevas registrado en compras suma <b>' + gasto.toFixed(0) + ' €</b>, a una media de ' + (gasto / ds.filter(function(d){ return d.precioCompra; }).length).toFixed(1) + ' € por disco.');

  var huecos = [];
  for(var y = 1960; y <= new Date().getFullYear(); y += 10){
    if(!dec.some(function(x){ return +x.k === y; })) huecos.push(y + 's');
  }
  if(huecos.length && huecos.length < 4) out.push('No tienes ningún disco de los <b>' + huecos.join(' ni de los ') + '</b>. Un hueco por llenar.');

  var solos = art.filter(function(a){ return a.v === 1; }).length;
  if(solos) out.push('De <b>' + solos + ' artistas</b> tienes un único disco. La mitad de tu colección son visitas de una sola vez.');

  var letras = {};
  ds.forEach(function(d){ var L = (d.artista || '?')[0]; if(L) letras[L.toUpperCase()] = (letras[L.toUpperCase()] || 0) + 1; });
  var topL = Object.keys(letras).sort(function(a, b){ return letras[b] - letras[a]; })[0];
  if(topL) out.push('La letra <b>' + topL + '</b> es la más poblada de tu estantería, con <b>' + letras[topL] + ' artistas o discos</b>.');

  return out;
}
