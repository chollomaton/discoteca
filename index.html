<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https://api.github.com https://api.discogs.com https://musicbrainz.org https://coverartarchive.org https://itunes.apple.com https://es.wikipedia.org https://ws.audioscrobbler.com https://app.ticketmaster.com https://api.audd.io https://api.anthropic.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="Catálogo personal de vinilos y CDs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discoteca">
<title>Discoteca</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="gVin" cx="34%" cy="28%" r="78%">
    <stop offset="0%" stop-color="#3c3c44"/><stop offset="42%" stop-color="#1b1b21"/><stop offset="100%" stop-color="#08080b"/>
  </radialGradient>
  <linearGradient id="gVinLab" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e0343f"/><stop offset="100%" stop-color="#ad1d29"/>
  </linearGradient>
  <linearGradient id="gCd" x1="12%" y1="4%" x2="88%" y2="96%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="22%" stop-color="#dfe7ef"/>
    <stop offset="42%" stop-color="#c3d0de"/><stop offset="58%" stop-color="#e8edf3"/>
    <stop offset="78%" stop-color="#b9c6d5"/><stop offset="100%" stop-color="#dde5ee"/>
  </linearGradient>
  <linearGradient id="gCdHole" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#dfe6ee"/>
  </linearGradient>
</defs></svg>

<div class="ptr" id="ptr"><svg class="ic" viewBox="0 0 24 24"><polyline points="21 4 21 10 15 10"/><polyline points="3 20 3 14 9 14"/><path d="M19.4 9a8 8 0 0 0-13.1-3L3 9m18 6l-3.3 3A8 8 0 0 1 4.6 15"/></svg></div>

<nav class="nav" id="nav">
  <div class="nav-in">
    <div class="logo" id="logo" data-tip="Volver a la colección">
      <svg class="disc" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <radialGradient id="gVin2" cx="32%" cy="28%" r="80%">
            <stop offset="0%" stop-color="#3a3a42"/><stop offset="55%" stop-color="#18181c"/><stop offset="100%" stop-color="#050506"/>
          </radialGradient>
          <linearGradient id="gCromo2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fdfdfd"/><stop offset="50%" stop-color="#9aa0a6"/><stop offset="100%" stop-color="#e8ebee"/>
          </linearGradient>
          <linearGradient id="gRojo2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff6f61"/><stop offset="100%" stop-color="#c8202f"/>
          </linearGradient>
        </defs>
        <circle cx="14" cy="16.5" r="12.4" fill="url(#gVin2)"/>
        <circle cx="14" cy="16.5" r="9.6" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width=".5"/>
        <circle cx="14" cy="16.5" r="7.4" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width=".5"/>
        <path d="M4.6 11.2A12.4 12.4 0 0 1 12 4.4" stroke="#fff" stroke-opacity=".28" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <circle cx="14" cy="16.5" r="4.4" fill="url(#gRojo2)"/>
        <circle cx="14" cy="16.5" r=".8" fill="#050506"/>
        <path d="M22.6 15.4c-2 0-2.6-2.6-1.1-3.9 1.1-.9 2.6-.8 3.4.4.8-1.2 2.3-1.3 3.4-.4 1.5 1.3.9 3.9-1.1 3.9-1.1 0-2-.9-2.3-1.6-.3.7-1.2 1.6-2.3 1.6z" fill="url(#gCromo2)"/>
        <path d="M22.3 15.3c-2.2 3-4.3 4.7-5.6 5.6" stroke="url(#gCromo2)" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      </svg>
      <div>
        <h1>Discoteca</h1>
        <div class="cnt" id="navCount">—</div>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button type="button" class="on" data-v="col"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg><span>Colección</span></button>
      <button type="button" data-v="wish"><svg class="ic" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg><span>Deseos</span></button>
      <button type="button" data-v="stats"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Estadísticas</span></button>
      <button type="button" data-v="db"><svg class="ic" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3.2"/><path d="M4 5.5v13c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2v-13"/><path d="M4 12c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2"/></svg><span>Ajustes</span></button>
    </div>
    <div class="rowb">
      <button type="button" class="sync" id="syncBadge" data-tip="Estado de la sincronización" data-tecla="⌘S"><span class="dot"></span><span class="stxt" id="syncTxt">Local</span></button>
      <button type="button" class="btn icon no-mob hide-ro" id="btnSel" data-tip="Seleccionar varios discos"><svg class="ic" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8"/></svg></button>
      <button type="button" class="btn icon" id="btnPal" data-tip="Buscar en la colección" data-tecla="⌘K"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><line x1="21" y1="21" x2="16.8" y2="16.8"/></svg></button>
      <button type="button" class="btn icon no-mob" id="btnDice" data-tip="Abrir un disco al azar" data-tecla="R"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2.6l8.4 4.2v9.9L12 21.4 3.6 16.7V6.8z"/><path d="M3.6 6.8L12 11.5l8.4-4.7M12 11.5v9.9"/><circle cx="8" cy="8.4" r="1" fill="currentColor" stroke="none"/><circle cx="7.6" cy="14.6" r="1" fill="currentColor" stroke="none"/><circle cx="16.4" cy="10.6" r="1" fill="currentColor" stroke="none"/><circle cx="16.4" cy="15.4" r="1" fill="currentColor" stroke="none"/></svg></button>
      <button type="button" class="btn icon hide-ro" id="btnScan" data-tip="Escanear un código de barras"><svg class="ic" viewBox="0 0 24 24"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8M21 16v2.5a2.5 2.5 0 0 1-2.5 2.5H16M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16"/><line x1="3" y1="12" x2="21" y2="12"/></svg></button>
      <button type="button" class="btn icon only-mob hide-ro" id="btnAddMob" data-tip="Añadir un disco"><svg class="ic" viewBox="0 0 24 24" style="stroke-width:2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button type="button" class="btn pri no-mob hide-ro" id="btnAdd" data-tip="Añadir un disco" data-tecla="N"><svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Añadir</button>
    </div>
  </div>
</nav>

<div class="page">

  <section class="view on" id="v-col">
    <div id="musicHome"></div>
    <div class="kpis" id="kpis"></div>
    <div class="resumen" id="resumen"></div>
    <div id="bannerSlot"></div>
    <div class="controls">
      <div class="searchw" id="searchw">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><line x1="21" y1="21" x2="16.8" y2="16.8"/></svg>
        <input type="text" id="q" placeholder="Buscar álbum, artista, canción…" enterkeyhint="search" autocapitalize="none" autocorrect="off">
        <button type="button" class="clr" id="qClear" aria-label="Borrar" data-tip="Borrar la búsqueda"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="filtros">
        <div class="seg" id="segType">
          <button type="button" class="on" data-f="all">Todo</button>
          <button type="button" data-f="Vinilo">Vinilo</button>
          <button type="button" data-f="CD">CD</button>
          <button type="button" data-f="fav">Favoritos</button>
          <button type="button" data-f="noesc">Sin escuchar</button>
          <button type="button" data-f="dup">Repetidos</button>
          <button type="button" data-f="inc">Incompletas</button>
          <button type="button" data-f="rev">Revisar</button>
        </div>
        <div class="selw">
          <span class="sl">Agrupar</span>
          <select id="selGroup">
            <option value="none">Nada</option>
            <option value="artista">Artista</option>
            <option value="genero">Género</option>
            <option value="decada">Década</option>
            <option value="sello">Sello</option>
            <option value="pais">País</option>
            <option value="formato">Soporte</option>
            <option value="ubicacion">Dónde está</option>
          </select>
          <svg class="ic cv" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="selw">
          <span class="sl">Orden</span>
          <select id="sortBy">
            <option value="artist">Artista A–Z</option>
            <option value="added">Añadido</option>
            <option value="title">Título A–Z</option>
            <option value="year-desc">Año ↓</option>
            <option value="year-asc">Año ↑</option>
            <option value="rating">Mejor valorados</option>
            <option value="plays">Más escuchados</option>
            <option value="last">Escuchado hace poco</option>
            <option value="random">Aleatorio</option>
          </select>
          <svg class="ic cv" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="selw">
          <span class="sl">Género</span>
          <select id="fGenre"></select>
          <svg class="ic cv" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="seg" id="segMode">
          <button type="button" class="on" data-m="grid" data-tip="Ver portadas"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg></button>
          <button type="button" data-m="list" data-tip="Ver en lista"><svg class="ic" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg></button>
          <button type="button" data-m="shelf" data-tip="Ver la estantería"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="3.4" height="14" rx="1"/><rect x="9.3" y="4" width="3.4" height="14" rx="1"/><rect x="14.6" y="4" width="3.4" height="14" rx="1"/><line x1="3" y1="20.5" x2="21" y2="20.5"/></svg></button>
        </div>
        <div id="activeChips" class="rowb"></div>
      </div>
      <div class="listas-bar" id="listasBar"></div>
    </div>
    <div id="sugerencias"></div>
    <div id="board"></div>
    <div class="azbar" id="azbar"></div>
  </section>

  <section class="view" id="v-wish"><div id="wishBody"></div></section>
  <section class="view" id="v-stats"><div id="statsBody"></div></section>
  <section class="view" id="v-db"><div id="dbBody"></div></section>

</div>

<nav class="tabbar" id="tabbar">
  <div class="in">
    <button type="button" class="on" data-v="col">
      <svg class="ic ico-off" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      <svg class="ic ico-on" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      Colección
    </button>
    <button type="button" data-v="wish">
      <svg class="ic ico-off" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <svg class="ic ico-on" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      Deseos
    </button>
    <button type="button" class="fab hide-ro" id="fabTienda" aria-label="Modo tienda">
      <span><svg class="ic" viewBox="0 0 24 24"><path d="M4 8h16l-1.2 11.2a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8z"/><path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/></svg></span>
    </button>
    <button type="button" data-v="stats">
      <svg class="ic ico-off" viewBox="0 0 24 24"><rect x="4" y="12" width="4" height="8" rx="1.4"/><rect x="10" y="4" width="4" height="16" rx="1.4"/><rect x="16" y="8" width="4" height="12" rx="1.4"/></svg>
      <svg class="ic ico-on" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4" y="12" width="4" height="8" rx="1.4"/><rect x="10" y="4" width="4" height="16" rx="1.4"/><rect x="16" y="8" width="4" height="12" rx="1.4"/></svg>
      Estadísticas
    </button>
    <button type="button" data-v="db">
      <svg class="ic ico-off" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>
      <svg class="ic ico-on" viewBox="0 0 24 24" fill="currentColor" stroke="none"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 8.6V12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V8.6c-1.6 1.2-4.4 1.9-7.5 1.9s-5.9-.7-7.5-1.9z"/><path d="M4.5 14.6V18c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-3.4c-1.6 1.2-4.4 1.9-7.5 1.9s-5.9-.7-7.5-1.9z"/></svg>
      Ajustes
    </button>
  </div>
</nav>

<input type="file" id="fileCsv" accept=".csv,text/csv" style="display:none">
<input type="file" id="fileBak" accept=".json,application/json" style="display:none">
<input type="file" id="fileImg" accept="image/*" style="display:none">
<input type="file" id="filePhoto" accept="image/*" capture="environment" style="display:none">
<audio id="player" preload="none"></audio>

<script src="js/core.js"></script>
<script src="js/library.js"></script>
<script src="js/features.js"></script>
<script src="js/insights.js"></script>
<script src="js/stats.js"></script>
<script src="js/settings.js"></script>
<script src="js/bootstrap.js"></script>
</body>
</html>
