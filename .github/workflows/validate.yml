name: Validar Discoteca

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]

concurrency:
  group: validar-discoteca-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Integridad de la app y datos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar validaciones
        run: node scripts/validate.mjs

      - name: Probar sincronización multicliente
        run: node scripts/sync-tests.mjs

      - name: Probar Radar y Detective
        run: node scripts/quality-tests.mjs

      - name: Probar diseño Apple Music
        run: node scripts/design-tests.mjs

      - name: Probar actualización PWA
        run: node scripts/pwa-update-tests.mjs

      - name: Probar arquitectura modular
        run: node scripts/module-tests.mjs

      - name: Probar descubrimiento inteligente
        run: node scripts/phase6-tests.mjs

      - name: Probar privacidad y recuperación
        run: node scripts/phase7-tests.mjs

      - name: Probar descubrimiento práctico y microanimaciones
        run: node scripts/phase8-tests.mjs
